let ALED = { key:'sys:cash', r:null };
function ledgerEntries(key){
  const [ty, id] = key.split(':');
  if(ty === 'c' || ty === 's') return partyEntries(ty === 'c' ? { c:id, s:null } : { c:null, s:id }).map(e => ({ d:e.d, txt:e.txt, amt:e.amt }));
  if(key === 'sys:cash') return cashRows().map(r => ({ d:r.date, txt:[r.who, r.note].filter(Boolean).join(' · '), amt:r.dir === 'in' ? r.amt : -r.amt }));
  if(key === 'sys:bank') return bankRows().map(r => ({ d:r.date, txt:[r.who, r.note].filter(Boolean).join(' · '), amt:r.inflow ? r.amt : -r.amt }));
  const E = [], ob = db.obs[key] || 0;
  if(ob) E.push({ d:'', txt:L('शुरुआती बाक़ी (Opening)', 'Opening balance'), amt:ob, ts:0 });
  db.journals.filter(j => j.dr === key || j.cr === key).forEach(j => E.push({ d:j.date, ts:tnum2(j.id),
    txt:(j.vno ? j.vno + ' · ' : '') + accName(j.dr === key ? j.cr : j.dr) + (j.note ? ' · ' + j.note : ''), amt:j.dr === key ? j.amt : -j.amt }));
  return E.sort((a, b) => (a.d || '').localeCompare(b.d || '') || a.ts - b.ts);
}
function aledCalc(){
  const r = ALED.r || { f:rangeOf('fy')[0], t:today() }, all = ledgerEntries(ALED.key);
  const open = sumBy(all.filter(e => r.f && (e.d || '') < r.f), e => e.amt);
  let bal = open; const rows = all.filter(e => inRange(e.d, r)).map(e => { bal += e.amt; return Object.assign({ bal }, e); });

}

/* ---------- Cash flow: where money came from and where it went (cash + bank) ---------- */
let CF_R = null;
function cashFlow(r){
  const inR = d => inRange(d, r), bucket = {};
  const add = (dir, k, v) => { if(!(v > 0)) return; const key = dir + '|' + k; bucket[key] = (bucket[key] || 0) + v; };
  db.payments.forEach(p => { if(!inR(p.date)) return;
    if(p.ty === 'c'){ if(p.amt > 0) add('in', L('ग्राहकों से मिला', 'Received from customers'), p.amt); else add('out', L('ग्राहकों को लौटाया', 'Refunds to customers'), -p.amt); }
    else { if(p.amt > 0) add('out', L('सप्लायरों को दिया', 'Paid to suppliers'), p.amt); else add('in', L('सप्लायरों से वापस मिला', 'Refunds from suppliers'), -p.amt); } });
  db.cashbook.forEach(c => { if(inR(c.date)) add(c.dir, c.dir === 'in' ? L('कैश बुक में डाला', 'Cash added') : L('कैश बुक ख़र्चे', 'Cash Book expenses'), c.amt); });
  const money2 = k => k === 'sys:cash' || k === 'sys:bank';
  db.journals.forEach(j => { if(!inR(j.date) || money2(j.dr) === money2(j.cr)) return;
    if(money2(j.dr)) add('in', accName(j.cr) + ' (' + accGroup(j.cr) + ')', j.amt); else add('out', accName(j.dr) + ' (' + accGroup(j.dr) + ')', j.amt); });
  const list = dir => Object.keys(bucket).filter(k => k.startsWith(dir + '|')).map(k => ({ k:k.slice(dir.length + 1), v:bucket[k] })).sort((a, b) => b.v - a.v);
  const dayB = r.f ? dayBefore(r.f) : '';
  const open = r.f ? accBal('sys:cash', dayB) + accBal('sys:bank', dayB) : (db.obs['sys:cash'] || 0) + (db.obs['sys:bank'] || 0);
  const close = accBal('sys:cash', r.t || '9999-12-31') + accBal('sys:bank', r.t || '9999-12-31');
  const ins = list('in'), outs = list('out');
  return { ins, outs, open, close, tin:sumBy(ins, x => x.v), tout:sumBy(outs, x => x.v) };
}
function renderCflow(){
  if(!CF_R){ const r = rangeOf('month'); CF_R = { f:r[0], t:r[1] }; }
  const c = cashFlow(CF_R), ok = Math.abs(c.open + c.tin - c.tout - c.close) < 0.5;
  document.getElementById('cflowView').innerHTML = viewHead('🌊', L('कैश फ़्लो', 'Cash flow'), L('पैसा कहाँ से आया और कहाँ गया (कैश + बैंक)', 'Where money came from and where it went (cash + bank)')) + `
  <div class="card"><div class="rchips">${[['month', L('यह महीना', 'This month')], ['last', L('पिछला महीना', 'Last month')], ['fy', L('यह साल', 'This year')], ['all', L('पूरा', 'All')]].map(([k, txt]) =>
    `<button class="light sm" onclick="const r=rangeOf('${k}');CF_R={f:r[0],t:r[1]};renderCflow()">${txt}</button>`).join('')}</div><p class="hint2">📅 ${rangeTxt(CF_R)}</p></div>
  ${tiles([[L('शुरू में', 'Opening'), money(c.open), '', '🏁'], [L('आया', 'Came in'), money(c.tin), 'green', '⬇️'], [L('गया', 'Went out'), money(c.tout), 'red', '⬆️'], [L('आख़िर में', 'Closing'), money(c.close), 'blue', '🎯']])}
  <div class="card"><h3>⬇️ ${L('पैसा कहाँ से आया', 'Money came from')}</h3>${c.ins.length ? bars(c.ins, 'linear-gradient(90deg,#22c55e,#15803d)') : `<p class="hint2">—</p>`}</div>
  <div class="card"><h3>⬆️ ${L('पैसा कहाँ गया', 'Money went to')}</h3>${c.outs.length ? bars(c.outs, 'linear-gradient(90deg,#f87171,#b91c1c)') : `<p class="hint2">—</p>`}
    <div class="${ok ? 'bsOk' : 'bsBad'}">${ok ? '✅ ' + L('शुरू + आया − गया = आख़िर — हिसाब मिल गया', 'Opening + in − out = closing — it matches') : '⚠️ ' + L('हिसाब में अंतर', 'Totals differ')}</div></div>`;
}

function fingerprint(){
  return [db.invoices.length, db.purchases.length, db.payments.length, db.notes.length, db.journals.length, db.cashbook.length, db.items.length,
    db.customers.length, db.stockadj.length, db.transfers.length, db.quotes.length, db.accounts.length, Object.keys(db.obs).length,

    sumBy(db.purchases, x => pVal(x)), sumBy(db.journals, j => j.amt)].join('|');
}

/* state codes as used in GSTIN (first two digits) */
function stCode(v){ const m = /^\s*(\d{1,2})/.exec(String(v ?? '')); if(!m) return ''; const c = m[1].padStart(2, '0'); const k = Number(c); return (k >= 1 && k <= 38) || k === 97 ? c : ''; }
const STATES = { '01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan',
  '09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam',
  '19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','25':'Daman & Diu','26':'Dadra & Nagar Haveli and Daman & Diu',
  '27':'Maharashtra','28':'Andhra Pradesh (old)','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar',
  '36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory' };
const stName = c => STATES[c] || '';
function stateOpts(sel){ return `<option value="">—</option>` + Object.keys(STATES).map(c => `<option value="${c}" ${c === sel ? 'selected' : ''}>${c} · ${STATES[c]}</option>`).join(''); }
/* same state → CGST + SGST (half each); other state → IGST */
function isInter(pos){ const me = db.settings.st; return !!(pos && me && pos !== me); }
function splitTax(pos, tax){ return isInter(pos) ? { cgst:0, sgst:0, igst:tax } : { cgst:tax / 2, sgst:tax / 2, igst:0 }; }
function gstSplitHTML(inv, tax){
  if(!(tax > 0)) return `GST: ${money(0)}<br>`;
  const x = splitTax(inv.pos, tax);
  return x.igst ? `IGST: ${money(x.igst)}<br>` : `CGST: ${money(x.cgst)}<br>SGST: ${money(x.sgst)}<br>`;
}

  if(s2.gstin){ purchDraft.sgstin = s2.gstin; const e = document.getElementById('pu_g'); if(e) e.value = s2.gstin; }

/* ---------- collect everything the accountant needs for one period ---------- */
let GR_R = null;
function gstData(r){
  const inR = d => inRange(d, r), inv = db.invoices.filter(i => inR(i.cd));
  const b2b = [], b2cs = {}, hsn = {}, cdn = [], itc = [];
  const addHsn = (code, n, unit, q, val, rate, pos, sign) => {
    const k = (code || '—') + '|' + rate, h = hsn[k] = hsn[k] || { hsn:code || '', desc:n, unit, q:0, val:0, rate, igst:0, cgst:0, sgst:0 };
    const tax = val * rate / 100, x = splitTax(pos, tax);
    h.q += sign * q; h.val += sign * val; h.igst += sign * x.igst; h.cgst += sign * x.cgst; h.sgst += sign * x.sgst;
  };
  inv.forEach(i => {
    const byRate = {};
    totals(i).all.forEach(x => { const v = x.pre, g = x.gst; byRate[g] = (byRate[g] || 0) + v; addHsn(x.hsn, x.n, x.unit, x.q + x.fq, v, g, i.pos, 1); });
    Object.keys(byRate).forEach(g => {
      const val = byRate[g], tax = val * g / 100, x = splitTax(i.pos, tax);
      if(i.cgstin) b2b.push({ gstin:i.cgstin, name:i.cn, no:i.no, date:i.cd, total:i.total, pos:i.pos, rate:Number(g), val, ...x });
      else { const k = (i.pos || db.settings.st || '') + '|' + g; const b = b2cs[k] = b2cs[k] || { pos:i.pos || db.settings.st || '', rate:Number(g), val:0, igst:0, cgst:0, sgst:0 };
        b.val += val; b.igst += x.igst; b.cgst += x.cgst; b.sgst += x.sgst; }
    });
  });
  db.notes.filter(x => x.ty === 'cn' && inR(x.date)).forEach(x => {
    const c = db.customers.find(y => y.id === x.pid) || {}, pos = c.st || stCode((c.gstin || '').slice(0, 2)) || db.settings.st, val = x.q * x.r, tax = nTax(x);
    cdn.push({ type:'C', no:x.no, date:x.date, party:x.pname, gstin:c.gstin || '', pos, rate:Number(x.gst) || 0, val, ...splitTax(pos, tax) });
    const it = itemById(x.iid) || {}; addHsn(it.hsn, x.n, x.unit, x.q, val, Number(x.gst) || 0, pos, -1);
  });
  db.purchases.filter(x => inR(x.date) && !x.ro).forEach(x => {
    const val = pVal(x), rate = Number(x.gst) || 0, pos = x.sst || stCode((x.sgstin || '').slice(0, 2)) || db.settings.st;
    itc.push({ gstin:x.sgstin || '', name:x.supplier, bill:x.bill || x.pno || '', date:x.date, item:x.n, rate, val, ...splitTax(pos, pTax(x)) });
  });
  db.notes.filter(x => x.ty === 'dn' && inR(x.date)).forEach(x => {
    const sp = db.suppliers.find(y => y.id === x.pid) || {}, pos = sp.st || stCode((sp.gstin || '').slice(0, 2)) || db.settings.st, val = x.q * x.r;
    cdn.push({ type:'D', no:x.no, date:x.date, party:x.pname, gstin:sp.gstin || '', pos, rate:Number(x.gst) || 0, val, ...splitTax(pos, nTax(x)) });
  });
  const sum = (a, k) => a.reduce((s2, x) => s2 + (x[k] || 0), 0), all = [...b2b, ...Object.values(b2cs)];
  const out = { val:sum(all, 'val'), igst:sum(all, 'igst'), cgst:sum(all, 'cgst'), sgst:sum(all, 'sgst') };
  const cn = cdn.filter(x => x.type === 'C'), dn = cdn.filter(x => x.type === 'D');
  const cnT = { val:sum(cn, 'val'), igst:sum(cn, 'igst'), cgst:sum(cn, 'cgst'), sgst:sum(cn, 'sgst') };
  const inT = { val:sum(itc, 'val') - sum(dn, 'val'), igst:sum(itc, 'igst') - sum(dn, 'igst'), cgst:sum(itc, 'cgst') - sum(dn, 'cgst'), sgst:sum(itc, 'sgst') - sum(dn, 'sgst') };
  const pay = { igst:out.igst - cnT.igst - inT.igst, cgst:out.cgst - cnT.cgst - inT.cgst, sgst:out.sgst - cnT.sgst - inT.sgst };
  return { b2b, b2cs:Object.values(b2cs), hsn:Object.values(hsn), cdn, itc, out, cnT, inT, pay, missing:{ st:!db.settings.st, gstin:!db.settings.gstin,
    noHsn:inv.reduce((a, i) => a + i.lines.filter(l => (Number(l.gst) || 0) > 0 && !l.hsn).length, 0), noSupGstin:db.purchases.filter(x => inR(x.date) && pTax(x) > 0 && !x.sgstin).length } };
}

  </div>

const kfmt = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e7 ? (a / 1e7).toFixed(1) + 'Cr' : a >= 1e5 ? (a / 1e5).toFixed(1) + 'L' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : Math.round(a)); };
const dayKeys = n => [...Array(n)].map((_, i) => { const d = new Date(today() + 'T12:00:00'); d.setDate(d.getDate() - n + 1 + i); return ymd(d); });
const monthKeys = n => [...Array(n)].map((_, i) => { const d = new Date(today().slice(0, 7) + '-15T12:00:00'); d.setMonth(d.getMonth() - n + 1 + i); return ymd(d).slice(0, 7); });
const mLabel = k => new Date(k + '-15T12:00:00').toLocaleDateString(db.settings.lang === 'hi' ? 'hi-IN' : 'en-IN', { month:'short' });
const dLabel = k => k.slice(8) + '/' + k.slice(5, 7);
/* line / area chart in SVG, one or more series */
function lineChart(labels, series){
  const W = 600, H = 240, P = { l:62, r:14, t:16, b:34 }, all = series.flatMap(s => s.v), mx = Math.max(1, ...all), mn = Math.min(0, ...all);
  const X = i => P.l + (labels.length < 2 ? 0 : i * (W - P.l - P.r) / (labels.length - 1)), Y = v => P.t + (mx - v) / (mx - mn || 1) * (H - P.t - P.b);
  const grid = [0, .25, .5, .75, 1].map(f => { const v = mn + (mx - mn) * f; return `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" class="cgrid"/><text x="${P.l - 6}" y="${Y(v) + 4}" class="cax" text-anchor="end">${kfmt(v)}</text>`; }).join('');
  const step = Math.ceil(labels.length / 8), xl = labels.map((l, i) => i % step === 0 || i === labels.length - 1 ? `<text x="${X(i)}" y="${H - 8}" class="cax" text-anchor="middle">${esc(l)}</text>` : '').join('');
  const paths = series.map((s, si) => { const pts = s.v.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    return `<defs><linearGradient id="lg${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".35"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs>
      ${series.length === 1 ? `<polygon points="${X(0)},${Y(Math.max(mn, 0))} ${pts} ${X(s.v.length - 1)},${Y(Math.max(mn, 0))}" fill="url(#lg${si})"/>` : ''}
      <polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" class="cline"/>
      ${s.v.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${labels.length > 15 ? 2 : 3.5}" fill="#fff" stroke="${s.c}" stroke-width="2"><title>${esc(labels[i])}: ${money(v)}</title></circle>`).join('')}`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${xl}${paths}</svg>`;
}
/* grouped columns in SVG: several series side by side */
function colChart(labels, series){
  const W = 600, H = 240, P = { l:62, r:10, t:16, b:34 }, all = series.flatMap(s => s.v), mx = Math.max(1, ...all), mn = Math.min(0, ...all);
  const Y = v => P.t + (mx - v) / (mx - mn || 1) * (H - P.t - P.b), gw = (W - P.l - P.r) / labels.length, bw = Math.min(26, gw * .8 / series.length);
  const grid = [0, .5, 1].map(f => { const v = mn + (mx - mn) * f; return `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" class="cgrid"/><text x="${P.l - 6}" y="${Y(v) + 4}" class="cax" text-anchor="end">${kfmt(v)}</text>`; }).join('');
  const bars2 = labels.map((l, i) => series.map((s, si) => { const v = s.v[i], x = P.l + i * gw + (gw - bw * series.length) / 2 + si * bw, y0 = Y(0), y1 = Y(v);
    return `<rect x="${x}" y="${Math.min(y0, y1)}" width="${bw - 2}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="4" fill="${v < 0 ? '#ef4444' : s.c}" class="cbar"><title>${esc(l)} · ${esc(s.n)}: ${money(v)}</title></rect>`; }).join('')
    + `<text x="${P.l + i * gw + gw / 2}" y="${H - 8}" class="cax" text-anchor="middle">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${bars2}</svg>`;
}
/* donut with legend */
function donut(items){
  items = items.filter(x => x.v > 0.004); const tot = items.reduce((a, x) => a + x.v, 0);
  if(!tot) return `<p class="hint2" style="text-align:center">📭 ${L('इस समय का कोई डेटा नहीं', 'No data for this period')}</p>`;
  const C = ['#2563eb','#16a34a','#f59e0b','#e11d48','#7c3aed','#0891b2','#ea580c','#65a30d','#db2777','#475569'];
  let a0 = -Math.PI / 2; const R = 80, r = 50, cx = 100, cy = 100;
  const arcs = items.map((x, i) => { const a1 = a0 + x.v / tot * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0, p = (a, rr) => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`;
    const d = items.length === 1 ? `M${cx},${cy - R}A${R},${R} 0 1 1 ${cx - .01},${cy - R}L${cx - .01},${cy - r}A${r},${r} 0 1 0 ${cx},${cy - r}Z`
      : `M${p(a0, R)}A${R},${R} 0 ${big} 1 ${p(a1, R)}L${p(a1, r)}A${r},${r} 0 ${big} 0 ${p(a0, r)}Z`; a0 = a1;
    return `<path d="${d}" fill="${C[i % C.length]}" class="cslice"><title>${esc(x.k)}: ${money(x.v)}</title></path>`; }).join('');
  return `<div class="donutWrap"><svg viewBox="0 0 200 200" class="donut">${arcs}<text x="100" y="96" text-anchor="middle" class="dT">${L('कुल', 'Total')}</text><text x="100" y="116" text-anchor="middle" class="dV">${kfmt(tot)}</text></svg>
    <div class="dLeg">${items.map((x, i) => `<div><span style="background:${C[i % C.length]}"></span>${esc(x.k)}<b>${money(x.v)} · ${(x.v / tot * 100).toFixed(0)}%</b></div>`).join('')}</div></div>`;
}
const legend = series => `<div class="cLeg">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`;

  ['negStock',  '📦', 'स्टॉक से ज़्यादा बिक्री (माइनस स्टॉक)', 'Selling more than stock (negative stock)', 'बिक्री के बाद स्टॉक माइनस में जाए तो', 'When stock would go below zero'],
  ['belowCost', '📉', 'ख़रीद रेट से कम में बिक्री', 'Selling below purchase rate', 'सामान का बिक्री रेट उसके ख़रीद रेट से कम हो तो', 'When the sale rate is below the purchase rate'],
  ['climit',    '💳', 'उधार की सीमा पार', 'Credit limit crossed', 'ग्राहक की उधार सीमा पार हो तो', 'When a customer goes past the credit limit'],

  ['zeroRate',  '0️⃣', 'बिना रेट (₹0) का सामान', 'Item without a rate (₹0)', 'किसी लाइन में रेट ₹0 हो तो', 'When a line has rate ₹0'],
  ['dateFy',    '📅', 'तारीख़ इस वित्त वर्ष से बाहर / आगे की', 'Date outside this financial year / in future', 'बिल की तारीख़ आज से आगे की या चालू वित्त वर्ष से बाहर हो तो', 'When the date is in the future or outside the current financial year'],
  ['bigDisc',   '🏷️', 'ज़्यादा छूट', 'High discount', 'कुल छूट तय % से ज़्यादा हो तो', 'When the total discount is above a set %'],
  ['noGstin',   '🪪', 'बड़े बिल में ग्राहक का GSTIN नहीं', 'Big bill without customer GSTIN', 'तय रक़म से बड़े बिल में ग्राहक का GSTIN न हो तो', 'When a bill above a set amount has no customer GSTIN'],
  ['buyAboveSale', '🛒', 'ख़रीद रेट बिक्री रेट से ज़्यादा', 'Purchase rate above sale rate', 'ख़रीद में रेट, सामान के बिक्री रेट से ज़्यादा हो तो', 'When the purchase rate is above the item\'s sale rate']
];
function warnCfg(){
  const w = db.settings.warn = Object.assign({ dupNo:true, negStock:true, belowCost:true, climit:true, overdue:true, zeroRate:true, dateFy:true, bigDisc:true, noGstin:false, buyAboveSale:true, discPct:20, gstinAmt:50000 },
    (db.settings.warn && typeof db.settings.warn === 'object') ? db.settings.warn : {});
  return w;
}
/* financial year that a date falls in: [start, end] as YYYY-MM-DD */
function fyOf(d){
  const fm = db.settings.fyM || 4, y = Number(String(d || today()).slice(0, 4)), m = Number(String(d || today()).slice(5, 7));
  const sy = m >= fm ? y : y - 1, pad = x => String(x).padStart(2, '0');
  return [sy + '-' + pad(fm) + '-01', ymd(new Date(sy + 1, fm - 1, 0))];
}
/* shows the warnings and waits: resolves true for Yes, false for No.
   list item: { ic, t (title), m (message), act:[label, code], stop (no Yes button: must be fixed) } */
function warnAsk(list){
  return new Promise(res => {
    const stop = list.some(w => w.stop), box = document.createElement('div');
    box.className = 'warnOv';
    box.innerHTML = `<div class="warnBox" role="alertdialog" aria-modal="true">
      <div class="warnHead">⚠️ ${L('चेतावनी', 'Warning')}</div>
      ${list.map((w, i) => `<div class="warnItem"><b>${w.ic} ${esc(w.t)}</b><div>${w.m}</div>${w.act ? `<button class="light sm" data-act="${i}">${esc(w.act[0])}</button>` : ''}</div>`).join('')}
      <p class="hint2">${stop ? L('इसे ठीक किए बिना सेव नहीं होगा।', 'This must be fixed before saving.') : L('फिर भी सेव करें?', 'Save anyway?')}</p>
      <div class="warnBtns">${stop ? '' : `<button class="green" data-yes="1">✅ ${L('हाँ (Yes), सेव करें', 'Yes, save')}</button>`}
        <button class="${stop ? 'green' : 'gray'}" data-no="1">✖️ ${stop ? L('ठीक है', 'OK') : L('नहीं (No), वापस जाएँ', 'No, go back')}</button></div>
      <p class="hint2" style="margin:8px 0 0">${L('चेतावनियाँ चालू / बंद: सेटिंग्स → ⚠️ चेतावनियाँ', 'Turn warnings on / off: Settings → ⚠️ Warnings')}</p></div>`;
    const done = v => { box.remove(); res(v); };
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.yes) done(true); else if(b.dataset.no) done(false);
      else if(b.dataset.act !== undefined){ const w = list[Number(b.dataset.act)]; done(false); setTimeout(() => w.act[1](), 30); }
    });
    document.body.appendChild(box);
    setTimeout(() => { const y = box.querySelector('[data-no]'); if(y) y.focus(); }, 30);
  });
}
/* every warning that applies to the bill being saved */
function saleWarnings(){
  const w = warnCfg(), out = [], x = totals(cur), oldInv = editingNo ? db.invoices.find(i => i.no === editingNo) : null;
  /* same bill number: always checked, because receipts and payments are linked to the bill number */
  const no = db.settings.billNoMode === 'manual' ? (cur.no || '').trim() : (editingNo || billNumber());
  const dup = db.invoices.find(i => i.no === no && i.no !== editingNo);
  if(dup){ const [f, t2] = fyOf(dup.cd), same = (cur.cd || '') >= f && (cur.cd || '') <= t2;
    out.push({ ic:'🔁', t:L('यह बिल नंबर पहले से है', 'This bill number already exists'), stop:true,
      m:`<b>${esc(dup.no)}</b> · ${esc(dup.cn)} · ${fmtDate(dup.cd)} · ${money(dup.total)}${same ? ' · ' + L('इसी वित्त वर्ष में', 'in this financial year') : ''}<br>${L('एक नंबर के दो बिल नहीं हो सकते (रसीद और पेमेंट बिल नंबर से जुड़ते हैं)। नया नंबर लिखें, या पुराना बिल खोलकर उसमें बदलाव करें।', 'Two bills cannot share a number (receipts and payments are linked to it). Type a new number, or open the old bill and change it.')}`,
      act:[L('📂 पुराना बिल खोलें (Modify)', '📂 Open the old bill (modify)'), () => { if(!editingNo || confirm(L('अभी वाले बदलाव छोड़कर पुराना बिल खोलें?', 'Leave the current changes and open the old bill?'))) editInv(dup.no); }] }); }
  const need = {}; cur.lines.forEach(l => { if(l.iid) need[l.iid] = (need[l.iid] || 0) + outQ(l); });
  if(oldInv) oldInv.lines.forEach(l => { if(l.iid && need[l.iid] !== undefined) need[l.iid] -= outQ(l); });
  if(w.negStock){ const neg = Object.keys(need).map(id => ({ it:itemById(id), q:need[id] })).filter(o => o.it && o.q > 0 && (Number(o.it.stock) || 0) - o.q < -0.0005);
    if(neg.length) out.push({ ic:'📦', t:L('स्टॉक माइनस में जाएगा', 'Stock will go negative'), m:neg.map(o => `${esc(o.it.name)}: ${L('स्टॉक', 'stock')} ${fmtQty(o.it.stock)}, ${L('बिल में', 'in bill')} ${fmtQty(o.q)} → <b class="due">${fmtQty((Number(o.it.stock) || 0) - o.q)}</b>`).join('<br>') }); }
  if(w.belowCost){ const low = x.rows.filter(r => { const it = r.l.iid && itemById(r.l.iid); return it && Number(it.buy) > 0 && r.q > 0 && r.pre / (r.q + r.fq) < Number(it.buy) - 0.004; });
    if(low.length) out.push({ ic:'📉', t:L('ख़रीद रेट से कम में बिक्री', 'Selling below purchase rate'), m:low.map(r => `${esc(r.n)}: ${L('बिक्री', 'sale')} ${money(r.pre / (r.q + r.fq))} / ${L('ख़रीद', 'purchase')} ${money(itemById(r.l.iid).buy)}`).join('<br>') }); }
  if(w.climit){ const o = custOver(cur.cid, cur.paid ? 0 : x.total, oldInv ? oldInv.total : 0);
    if(o && o.over) out.push({ ic:'💳', t:L('उधार की सीमा पार', 'Credit limit crossed'), m:`${esc(o.c.name)}: ${L('सीमा', 'limit')} ${money(o.c.climit)} · ${L('इस बिल के बाद बाक़ी', 'due after this bill')} <b class="due">${money(o.after)}</b>`,
      act:[L('👤 ग्राहक खोलें', '👤 Open customer'), () => { selCid = o.c.id; showTab('cust'); }] }); }
  if(w.overdue && cur.cid && cur.cid !== 'CASH'){ const late = db.invoices.filter(i => i.cid === cur.cid && !i.paid && i.no !== editingNo && i.due && i.due < today());
    if(late.length) out.push({ ic:'⏰', t:L('ग्राहक का पुराना पैसा बाक़ी है', 'Customer has overdue bills'), m:late.slice(0, 5).map(i => `${esc(i.no)} · ${fmtDate(i.cd)} · ${money(i.total)} · ${L('आख़िरी तारीख़', 'due')} ${fmtDate(i.due)}`).join('<br>') + (late.length > 5 ? '<br>…' : '') }); }
  if(w.zeroRate){ const z = cur.lines.filter(l => l.n.trim() && !(Number(l.r) > 0) && !(Number(l.q) === 0 && Number(l.fq) > 0));
    if(z.length) out.push({ ic:'0️⃣', t:L('बिना रेट का सामान', 'Item without a rate'), m:z.map(l => esc(l.n)).join(', ') }); }
  if(w.dateFy){ const [f, t2] = fyOf(today()), d = cur.cd || today();
    if(d > today() || d < f || d > t2) out.push({ ic:'📅', t:L('तारीख़ जाँचें', 'Check the date'), m:`${fmtDate(d)} · ${d > today() ? L('आज से आगे की तारीख़', 'a future date') : L('चालू वित्त वर्ष से बाहर', 'outside the current financial year')} (${fmtDate(f)} – ${fmtDate(t2)})` }); }
  if(w.bigDisc && x.gross > 0 && x.disc / x.gross * 100 > (Number(w.discPct) || 0) + 0.004)
    out.push({ ic:'🏷️', t:L('ज़्यादा छूट', 'High discount'), m:`${L('कुल छूट', 'Total discount')} ${money(x.disc)} = <b>${(x.disc / x.gross * 100).toFixed(1)}%</b> (${L('सीमा', 'limit')} ${w.discPct}%)` });
  if(w.noGstin && !isCashName(cur.cn) && !(cur.cgstin || '').trim() && x.total >= (Number(w.gstinAmt) || 0))
    out.push({ ic:'🪪', t:L('ग्राहक का GSTIN नहीं है', 'Customer GSTIN missing'), m:`${L('बिल', 'Bill')} ${money(x.total)} ≥ ${money(w.gstinAmt)}`, act:[L('✏️ ग्राहक की जानकारी भरें', '✏️ Fill customer details'), openCustWin] });
  return out;
}

  return db.invoices.filter(i => !i.paid && i.cid && i.cid !== 'CASH').map(i => {

  }).filter(r => r.days > 0).sort((a, b) => b.int - a.int);
}

function addRecur(){
  const no = valOf('rc_no'); if(!no) return;
  db.recur.push({ id:newId('R'), no, day:Math.min(28, Math.max(1, Math.floor(Number(valOf('rc_d')) || 1))), last:today().slice(0, 7), on:true });
  save(); toast(L('अगले महीने से अपने-आप बनेगा', 'Will be made from next month')); renderRecur();
}
function toggleRecur(id){ const r = db.recur.find(x => x.id === id); if(r){ r.on = !r.on; save(); renderRecur(); } }
function checkRecur(){
  if(!db.recur || !db.recur.length) return;
  const d0 = today(), ym = d0.slice(0, 7), day = Number(d0.slice(8, 10)); let made = 0;
  db.recur.forEach(r => {
    if(!r.on || r.last >= ym || day < r.day) return;
    const src = db.invoices.find(i => i.no === r.no); if(!src) return;
    const inv = JSON.parse(JSON.stringify(src));
    inv.no = db.settings.billNoMode === 'manual' ? src.no + '-' + ym.replace('-', '') : (db.settings.billPrefix || '') + String(db.settings.next++).padStart(4, '0');
    if(db.invoices.some(i => i.no === inv.no)) return;
    inv.cd = ym + '-' + String(r.day).padStart(2, '0'); inv.ts = Date.now(); inv.paid = false; inv.pmode = ''; delete inv.due;
    const c = db.customers.find(x => x.id === inv.cid); if(c && c.cdays){ const d = new Date(inv.cd + 'T12:00:00'); d.setDate(d.getDate() + c.cdays); inv.due = ymd(d); }
    inv.lines.forEach(l => { const it = l.iid && itemById(l.iid); if(it) it.stock = (Number(it.stock) || 0) - outQ(l); });
    inv.total = totals(inv).total; db.invoices.push(inv); r.last = ym; made++;
  });
  if(made){ save(); toast('🔁 ' + made + ' ' + L('हर महीने वाला बिल बन गया', 'monthly bill(s) made')); }
}

const C128 = '212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128(txt){
  const v = [...String(txt)].map(ch => Math.min(94, Math.max(0, ch.charCodeAt(0) - 32)));
  let sum = 104; v.forEach((x, i) => sum += x * (i + 1));
  return [104, ...v, sum % 103, 106].map(k => C128[k]).join('');
}

async function makeLabels(){
  const pick = db.items.filter(it => BC_SEL[it.id] > 0); if(!pick.length){ toast(L('कम से कम एक सामान के लेबल की गिनती लिखें', 'Type a label count for at least one item')); return; }
  const giveNew = chk('bc_new'), price = chk('bc_price');
  let changed = false;
  pick.forEach(it => { if(!it.bc && giveNew){ let n; do{ n = '2' + String(Date.now()).slice(-8) + String(Math.floor(Math.random() * 1000)).padStart(3, '0'); }while(db.items.some(x => x.bc === n)); it.bc = n; changed = true; } });
  if(changed) save();
  const list = []; pick.forEach(it => { if(it.bc) for(let k = 0; k < BC_SEL[it.id]; k++) list.push(it); });
  if(!list.length){ toast(L('इन सामान का बारकोड नहीं है', 'These items have no barcode')); return; }
  const out = document.getElementById('pdfOut'); if(out) out.innerHTML = `<p class="hint2">⏳ ${L('PDF बन रही है…', 'Making the PDF…')}</p>`;
  await new Promise(r => setTimeout(r, 30));
  const COLS = 3, ROWS = 8, W = PG.W, H = PG.H, mx = 40, my = 50, lw = (W - 2 * mx) / COLS, lh = (H - 2 * my) / ROWS, pages = [];
  list.forEach((it, n) => {
    if(n % (COLS * ROWS) === 0){ const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); pages.push(c); }
    const g = pages[pages.length - 1].getContext('2d'), k = n % (COLS * ROWS), x = mx + (k % COLS) * lw, y = my + Math.floor(k / COLS) * lh;
    g.strokeStyle = '#d1d5db'; g.lineWidth = 1; g.setLineDash([6, 6]); g.strokeRect(x + 4, y + 4, lw - 8, lh - 8); g.setLineDash([]);
    g.fillStyle = '#111827'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `600 17px ${PFONT}`; g.fillText(fitTxt(g, db.settings.name || '', lw - 30), x + lw / 2, y + 24);
    g.font = `700 21px ${PFONT}`; g.fillText(fitTxt(g, it.name, lw - 30), x + lw / 2, y + 50);
    const pat = code128(it.bc), units = [...pat].reduce((a, d) => a + Number(d), 0), bw = Math.max(1, Math.floor((lw - 50) / units)), total = units * bw;
    let bx = x + (lw - total) / 2; const by = y + 66, bh = lh - (price ? 120 : 100);
    [...pat].forEach((d, i) => { const w = Number(d) * bw; if(i % 2 === 0){ g.fillStyle = '#000'; g.fillRect(bx, by, w, bh); } bx += w; });
    g.fillStyle = '#111827'; g.font = `500 17px ${PFONT}`; g.fillText(it.bc, x + lw / 2, by + bh + 16);
    if(price){ g.font = `800 22px ${PFONT}`; g.fillText('MRP ' + money(it.sale), x + lw / 2, by + bh + 40); }
    g.textAlign = 'left';
  });
  const blob = pdfFromPages(pages);
  lastPdf = { blob, name:'barcode-labels.pdf', text:L('बारकोड लेबल', 'Barcode labels') };
  if(out) out.innerHTML = `<div class="pdfReady"><img src="${pages[0].toDataURL('image/jpeg', 0.6)}" alt=""><div><b>✅ ${list.length} ${L('लेबल तैयार', 'labels ready')}</b><small>${pages.length} ${L('पेज', 'page(s)')}</small>
    <button class="green" onclick="sharePdf()">📤 ${L('शेयर / प्रिंट', 'Share / print')}</button><button class="light" onclick="downloadPdf()">⬇️ ${L('डाउनलोड', 'Download')}</button></div></div>`;
}

function saveBom(){
  const parts = BOM_D.parts.filter(p => itemById(p.iid) && Number(p.q) > 0 && p.iid !== BOM_D.iid);

  db.boms.push({ id:newId('B'), iid:BOM_D.iid, q:Number(BOM_D.q) || 1, parts:parts.map(p => ({ iid:p.iid, q:Number(p.q) })) });

function saveProd(){
  const b = db.boms.find(x => x.id === valOf('pr_b')), n = Number(valOf('pr_n')) || 0; if(!b || !(n > 0)){ alert(t('badAmt')); return; }
  const parts = b.parts.map(p => ({ iid:p.iid, q:p.q * n })), short = parts.filter(p => (Number((itemById(p.iid) || {}).stock) || 0) < p.q);
  if(short.length && !confirm(L('कुछ कच्चे माल का स्टॉक कम है: ', 'Some raw stock is short: ') + short.map(p => (itemById(p.iid) || {}).name).join(', ') + L('\nफिर भी सेव करें?', '\nSave anyway?'))) return;
  const p = { id:newId('M'), date:valOf('pr_d') || today(), bom:b.id, iid:b.iid, q:b.q * n, parts };
  db.prods.push(p); const fin = itemById(b.iid); if(fin) fin.stock = (Number(fin.stock) || 0) + p.q;
  parts.forEach(x => { const it = itemById(x.iid); if(it) it.stock = (Number(it.stock) || 0) - x.q; });
  save(); toast(L('उत्पादन सेव हो गया, स्टॉक बदल गया', 'Production saved, stock updated')); renderBom();

function delProd(id){

}

    <button class="gray" onclick="if(confirm(t('confDel'))){db.counts=db.counts.filter(x=>x.done);save();renderPcount();}">🗑️ ${L('यह गिनती छोड़ें', 'Discard this count')}</button></div>`
  : `<div class="card"><p>${L('गिनती शुरू करने पर अभी का स्टॉक लिख लिया जाएगा। फिर दुकान में माल गिनकर संख्या भरें।', 'Starting a count notes the current stock. Then count the goods and type the numbers.')}</p>
    <button class="green" onclick="pcStart()" ${db.items.length ? '' : 'disabled'}>▶️ ${L('नई गिनती शुरू करें', 'Start a new count')}</button></div>`) +
  (db.counts.some(x => x.done) ? `<div class="card"><h3>🗒️ ${L('पिछली गिनतियाँ', 'Past counts')}</h3>${db.counts.filter(x => x.done).reverse().map(x => `<div class="hint2">${fmtDate(x.date)} · ${x.rows.filter(r => r.got !== '' && Math.abs(r.got - r.sys) > 0.0005).length} ${L('सामान में अंतर ठीक किया', 'items corrected')}</div>`).join('')}</div>` : '');

function pcStart(){ db.counts.push({ id:newId('PC'), date:today(), done:false, rows:[...db.items].sort((a, b) => a.name.localeCompare(b.name)).map(it => ({ iid:it.id, sys:Number(it.stock) || 0, got:'' })) }); save(); renderPcount(); }
function pcSet(i, v){ const c = curCount(); if(!c || !c.rows[i]) return; c.rows[i].got = String(v).trim() === '' ? '' : parseNum(v); save(); renderPcount(); }
function pcApply(){
  const c = curCount(); if(!c) return;
  const diff = c.rows.filter(r => r.got !== '' && Math.abs(r.got - r.sys) > 0.0005);
  if(!confirm(L(`${diff.length} सामान का स्टॉक गिनती के हिसाब से बदलेगा (स्टॉक घट-बढ़ की एंट्री बनेगी)। आगे बढ़ें?`, `Stock of ${diff.length} items will be set to the count (stock adjustment entries are made). Continue?`))) return;
  diff.forEach(r => { const it = itemById(r.iid); if(!it) return; const q = r.got - (Number(it.stock) || 0); if(Math.abs(q) < 0.0005) return;
    db.stockadj.push({ id:newId('X'), date:today(), iid:it.id, q, reason:L('स्टॉक गिनती से मिलान', 'Physical stock count') }); it.stock = r.got; });
  c.done = true; save(); toast(L('स्टॉक मिल गया', 'Stock matched')); renderPcount(); renderBar();
}

/* ================= PDF reports (work offline) =================
   Pages are drawn on a canvas with the phone's own fonts (so Hindi prints correctly),
   then packed into a real PDF file that can be shared to WhatsApp, email or any app. */
const PG = { W:1240, H:1754, M:70 };          /* A4 page at 150 dpi */
const PFONT = 'system-ui,"Noto Sans Devanagari","Noto Sans",Arial,sans-serif';
function b64Bytes(dataUrl){ const s = atob(dataUrl.split(',')[1]); const u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function pdfFromPages(pages){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; put(id + ' 0 obj\n' + body + '\nendobj\n'); };
  put('%PDF-1.4\n'); put(new Uint8Array([37, 226, 227, 207, 211, 10]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ')}] /Count ${pages.length} >>`);
  pages.forEach((c, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2, jpg = b64Bytes(c.toDataURL('image/jpeg', 0.85));
    obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(cid, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[iid] = len;
    put(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
    put(jpg); put('\nendstream\nendobj\n');
  });
  const total = 3 + pages.length * 3, xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  put(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type:'application/pdf' });
}
function fitTxt(g, s, w){
  s = String(s ?? ''); if(g.measureText(s).width <= w) return s;
  while(s.length > 1 && g.measureText(s + '…').width > w) s = s.slice(0, -1);
  return s + '…';
}
async function loadImg(src){ if(!src) return null; const im = new Image(); im.src = src; try{ await im.decode(); return im; }catch(e){ return null; } }
/* doc = { title, period, party:[lines], cols:[{h, w, a}], rows:[{c:[..], b, sub, tone}], summary:[[label, value, tone]] } */
async function drawReport(doc){
  const s = db.settings, color = s.design.color || '#1f5fbf', logo = await loadImg(s.logo);
  const pages = []; let g, y;
  const W = PG.W, M = PG.M, IW = W - 2 * M, colX = []; let acc = M;
  doc.cols.forEach(c => { colX.push(acc); acc += c.w * IW; });
  const font = (sz, wt) => { g.font = `${wt || 400} ${sz}px ${PFONT}`; };
  const newPage = () => {
    const c = document.createElement('canvas'); c.width = W; c.height = PG.H; pages.push(c);
    g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, PG.H); g.textBaseline = 'middle';
    if(pages.length === 1){
      let tx = M;
      if(logo){ const r = Math.min(110 / logo.width, 110 / logo.height); g.drawImage(logo, M, M, logo.width * r, logo.height * r); tx = M + logo.width * r + 24; }
      g.fillStyle = '#111827'; font(44, 800); g.fillText(fitTxt(g, s.name || 'BillEasy', 620), tx, M + 26);
      g.fillStyle = '#4b5563'; font(23);
      const info = [[s.addr, s.city].filter(Boolean).join(', '), [s.phone && '📞 ' + s.phone, s.gstin && 'GSTIN ' + s.gstin].filter(Boolean).join('   ')].filter(Boolean);
      info.forEach((l, i) => g.fillText(fitTxt(g, l, 640), tx, M + 70 + i * 32));
      g.textAlign = 'right'; g.fillStyle = color; font(36, 800); g.fillText(fitTxt(g, doc.title, 420), W - M, M + 26);
      g.fillStyle = '#374151'; font(23, 600); g.fillText(doc.period || '', W - M, M + 70);
      g.fillStyle = '#6b7280'; font(19); g.fillText(L('बनाया: ', 'Made: ') + fmtDate(today()) + ' ' + new Date().toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }), W - M, M + 102);
      g.textAlign = 'left';
      y = M + 150; g.fillStyle = color; g.fillRect(M, y, IW, 5); y += 26;
      if(doc.party && doc.party.length){
        const h = 30 + doc.party.length * 32;
        g.fillStyle = '#f5f7fb'; g.fillRect(M, y, IW, h); g.fillStyle = color; g.fillRect(M, y, 7, h);
        doc.party.forEach((l, i) => { g.fillStyle = i ? '#374151' : '#111827'; font(i ? 22 : 27, i ? 400 : 800); g.fillText(fitTxt(g, l, IW - 50), M + 26, y + 30 + i * 32); });
        y += h + 22;
      }
    } else {
      g.fillStyle = '#111827'; font(26, 800); g.fillText(fitTxt(g, s.name || 'BillEasy', 600), M, M + 10);
      g.textAlign = 'right'; g.fillStyle = color; g.fillText(fitTxt(g, doc.title + (doc.period ? ' · ' + doc.period : ''), 520), W - M, M + 10); g.textAlign = 'left';
      y = M + 36; g.fillStyle = color; g.fillRect(M, y, IW, 3); y += 18;
    }
    head();
  };
  const head = () => {
    g.fillStyle = color; g.fillRect(M, y, IW, 50); g.fillStyle = '#fff'; font(21, 700);
    doc.cols.forEach((c, i) => cell(c.h, i, y + 25));
    y += 50;
  };
  const cell = (txt, i, cy) => {
    const c = doc.cols[i], x = colX[i], w = c.w * IW - 16;
    const t2 = fitTxt(g, txt, w);
    if(c.a === 'r'){ g.textAlign = 'right'; g.fillText(t2, x + c.w * IW - 8, cy); g.textAlign = 'left'; } else g.fillText(t2, x + 8, cy);
  };
  const bottom = () => PG.H - M - 50;
  newPage();
  let zebra = false;
  doc.rows.forEach(r => {
    const h = r.sub ? 34 : 46;
    if(y + h > bottom()){ newPage(); zebra = false; }
    if(r.sub){
      g.fillStyle = '#6b7280'; font(19); g.fillText(fitTxt(g, '   ' + r.sub, IW - 30), M + 24, y + h / 2);
    } else {
      if(r.tone === 'open'){ g.fillStyle = '#fef9c3'; g.fillRect(M, y, IW, h); }
      else if(zebra){ g.fillStyle = '#f8fafc'; g.fillRect(M, y, IW, h); }
      zebra = !zebra;
      font(21, r.b ? 700 : 400);
      r.c.forEach((v, i) => { g.fillStyle = (r.colors && r.colors[i]) || '#111827'; cell(v, i, y + h / 2); });
    }
    y += h;
    if(!r.sub){ g.fillStyle = '#e5e7eb'; g.fillRect(M, y - 1, IW, 1); }
  });
  if(!doc.rows.length){ g.fillStyle = '#6b7280'; font(24); g.fillText(L('इस समय में कोई एंट्री नहीं है।', 'No entries in this period.'), M + 10, y + 40); y += 80; }
  if(doc.summary && doc.summary.length){
    const bh = 26 + doc.summary.length * 42;
    if(y + bh + 30 > bottom()) newPage();
    y += 26; const bx = W - M - 560;
    g.fillStyle = '#f5f7fb'; g.fillRect(bx, y, 560, bh); g.strokeStyle = color; g.lineWidth = 2; g.strokeRect(bx, y, 560, bh);
    doc.summary.forEach(([lab, val, tone], i) => {
      const cy = y + 34 + i * 42; font(22, tone === 'big' ? 800 : 500);
      g.fillStyle = '#374151'; g.fillText(fitTxt(g, lab, 300), bx + 20, cy);
      g.textAlign = 'right'; g.fillStyle = tone === 'red' ? '#b91c1c' : tone === 'green' ? '#15803d' : '#111827';
      font(tone === 'big' ? 26 : 22, 800); g.fillText(val, W - M - 20, cy); g.textAlign = 'left';
    });
    y += bh;
  }
  if(s.sign){
    const si = await loadImg(s.sign);
    if(si){ if(y + 150 > bottom()) newPage(); const r = Math.min(260 / si.width, 80 / si.height); g.drawImage(si, W - M - si.width * r, y + 40, si.width * r, si.height * r); }
    g.fillStyle = '#374151'; font(20); g.textAlign = 'right'; g.fillText(t('authSign'), W - M, y + 140); g.textAlign = 'left';
  }
  pages.forEach((c, i) => {
    const p = c.getContext('2d'); p.textBaseline = 'middle'; p.font = `400 19px ${PFONT}`; p.fillStyle = '#9ca3af';
    p.fillText(L('BillEasy से बनाया गया', 'Made with BillEasy'), M, PG.H - M + 10);
    p.textAlign = 'right'; p.fillText(L(`पेज ${i + 1} / ${pages.length}`, `Page ${i + 1} of ${pages.length}`), W - M, PG.H - M + 10); p.textAlign = 'left';
  });
  return pages;
}

/* ---------- Date range: quick choices plus from / to ---------- */
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function rangeOf(k){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const fm = (db.settings.fyM || 4) - 1, fyStart = m >= fm ? y : y - 1, pad = x => String(x).padStart(2, '0');
  return ({ today:[ymd(n), ymd(n)], month:[ymd(new Date(y, m, 1)), ymd(n)], last:[ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))],
    fy:[fyStart + '-' + pad(fm + 1) + '-01', ymd(n)], lastfy:[(fyStart - 1) + '-' + pad(fm + 1) + '-01', ymd(new Date(fyStart, fm, 0))], all:['', ''] })[k];
}
function rangeBox(def){
  const [f, t2] = rangeOf(def || 'month');
  const chip = (k, txt) => `<button class="light sm rchip${k === (def || 'month') ? ' on' : ''}" onclick="setRange('${k}', this)">${txt}</button>`;
  return `<div class="secT">📅 ${L('किस तारीख़ से किस तारीख़ तक', 'From which date to which date')}</div>
    <div class="rchips">${chip('today', L('आज', 'Today'))}${chip('month', L('यह महीना', 'This month'))}${chip('last', L('पिछला महीना', 'Last month'))}${chip('fy', L('यह साल (अप्रैल से)', 'This year (from April)'))}${chip('lastfy', L('पिछला साल', 'Last year'))}${chip('all', L('पूरा', 'All'))}</div>
    <div class="grid2"><div><label>${L('से', 'From')}</label><input id="rg_f" type="date" value="${f}" oninput="clearChips()"></div>
      <div><label>${L('तक', 'To')}</label><input id="rg_t" type="date" value="${t2}" oninput="clearChips()"></div></div>`;
}
function setRange(k, b){
  const [f, t2] = rangeOf(k), F = document.getElementById('rg_f'), T = document.getElementById('rg_t');
  F.value = f; T.value = t2; F.dispatchEvent(new Event('input')); T.dispatchEvent(new Event('input'));
  document.querySelectorAll('.rchip').forEach(x => x.classList.toggle('on', x === b));
}
function clearChips(){ document.querySelectorAll('.rchip').forEach(x => x.classList.remove('on')); }
function getRange(){ return { f:document.getElementById('rg_f').value || '', t:document.getElementById('rg_t').value || '' }; }
const inRange = (d, r) => (!r.f || (d || '') >= r.f) && (!r.t || (d || '') <= r.t);
const rangeTxt = r => r.f || r.t ? `${r.f ? fmtDate(r.f) : L('शुरू', 'Start')} – ${r.t ? fmtDate(r.t) : L('आज', 'Today')}` : L('पूरा समय', 'All time');
const optBox = (id, on, label) => `<label class="sw"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}><span>${label}</span></label>`;
const chk = id => { const e = document.getElementById(id); return !!(e && e.checked); };

/* ---------- Make the PDF, then show it with Share / Download ---------- */
let lastPdf = null;
async function makePdf(doc, fileName){
  const out = document.getElementById('pdfOut'); if(out) out.innerHTML = `<p class="hint2">⏳ ${L('PDF बन रही है…', 'Making the PDF…')}</p>`;
  await new Promise(r => setTimeout(r, 30));
  const pages = await drawReport(doc), blob = pdfFromPages(pages);
  lastPdf = { blob, name:fileName.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf', text:doc.title + ' · ' + (doc.period || '') };
  if(out) out.innerHTML = `<div class="pdfReady">
      <img src="${pages[0].toDataURL('image/jpeg', 0.6)}" alt="">
      <div><b>✅ ${L('PDF तैयार है', 'PDF is ready')}</b><small>${pages.length} ${L('पेज', pages.length > 1 ? 'pages' : 'page')} · ${(blob.size / 1024).toFixed(0)} KB</small>
        <button class="green" onclick="sharePdf()">📤 ${L('शेयर करें (WhatsApp आदि)', 'Share (WhatsApp etc.)')}</button>
        <button class="light" onclick="downloadPdf()">⬇️ ${L('डाउनलोड', 'Download')}</button></div></div>`;
}
async function sharePdf(){
  if(!lastPdf) return;
  const file = new File([lastPdf.blob], lastPdf.name, { type:'application/pdf' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:lastPdf.name, text:lastPdf.text }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  toast(L('यहाँ सीधा शेयर नहीं हो सकता, PDF डाउनलोड कर रहे हैं', 'Direct share not available here, downloading the PDF'));
  downloadPdf();
}
function downloadPdf(){
  if(!lastPdf) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(lastPdf.blob); a.download = lastPdf.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}

/* ---------- Party statement: everything sold to / bought from one party ---------- */
function linkedParty(ty, id){
  /* a customer and a supplier with the same name or phone are treated as one party */
  const me = ty === 'c' ? db.customers.find(x => x.id === id) : db.suppliers.find(x => x.id === id); if(!me) return { c:null, s:null, me:null };
  const same = o => o && ((o.name || '').trim().toLowerCase() === (me.name || '').trim().toLowerCase() || (digits(o.phone) && digits(o.phone) === digits(me.phone)));
  if(id === 'CASH') return { c:ty === 'c' ? 'CASH' : null, s:ty === 's' ? 'CASH' : null, me };
  return ty === 'c' ? { c:id, s:(db.suppliers.find(same) || {}).id || null, me } : { s:id, c:(db.customers.find(same) || {}).id || null, me };
}
function partyEntries(p){
  const E = [];  /* amt > 0: they owe us more (debit) · amt < 0: we owe them / they paid (credit) */
  if(p.c){
    db.invoices.filter(i => i.cid === p.c).forEach(i => E.push({ d:i.cd, k:'sale', no:i.no, txt:L('बिक्री बिल ', 'Sale bill ') + i.no, amt:i.total, lines:totals(i).all, ts:i.ts || 0 }));
    db.payments.filter(x => x.ty === 'c' && x.pid === p.c).forEach(x => E.push({ d:x.date, k:'pay', txt:(x.amt > 0 ? L('पैसा मिला', 'Received') : L('पैसा लौटाया', 'Refunded')) + (x.rno ? ' ' + x.rno : '') + ' · ' + x.mode + (x.note && !x.auto ? ' · ' + x.note : ''), amt:-x.amt, ts:Number(String(x.id).replace(/\D/g, '').slice(0, 13)) || 0 }));
    db.notes.filter(n => n.ty === 'cn' && n.pid === p.c).forEach(n => E.push({ d:n.date, k:'ret', txt:L('क्रेडिट नोट ', 'Credit note ') + n.no + ' · ' + n.n + ' ×' + fmtQty(n.q), amt:-nAmt(n), ts:n.ts || 0 }));
  }
  if(p.s){
    db.purchases.filter(x => x.sid === p.s).forEach(x => E.push({ d:x.date, k:'purch', txt:L('ख़रीद · ', 'Purchase · ') + x.n + (x.chg || x.ro ? '' : ' ' + fmtQty(x.q) + (x.fq ? '+' + fmtQty(x.fq) : '') + ' ' + uLabel(x.unit) + ' × ' + money(x.r)) + (x.gst ? ' + GST ' + x.gst + '%' : ''), amt:-pAmt(x), ts:Number(String(x.id).replace(/\D/g, '').slice(0, 13)) || 0 }));
    db.payments.filter(x => x.ty === 's' && x.pid === p.s).forEach(x => E.push({ d:x.date, k:'pay', txt:(x.amt > 0 ? L('पैसा दिया', 'Paid') : L('पैसा वापस मिला', 'Refund received')) + ' · ' + x.mode + (x.note && !x.auto ? ' · ' + x.note : ''), amt:x.amt, ts:Number(String(x.id).replace(/\D/g, '').slice(0, 13)) || 0 }));
    db.notes.filter(n => n.ty === 'dn' && n.pid === p.s).forEach(n => E.push({ d:n.date, k:'ret', txt:L('डेबिट नोट ', 'Debit note ') + n.no + ' · ' + n.n + ' ×' + fmtQty(n.q), amt:nAmt(n), ts:n.ts || 0 }));
  }
  /* opening balances and journal vouchers of this party */
  [p.c && 'c:' + p.c, p.s && 's:' + p.s].filter(Boolean).forEach(key => {
    const ob = (db.obs || {})[key] || 0;
    if(ob) E.push({ d:'', k:'ob', txt:L('शुरुआती बाक़ी (Opening)', 'Opening balance'), amt:ob, ts:0 });
    (db.journals || []).filter(j => j.dr === key || j.cr === key).forEach(j => E.push({ d:j.date, k:'jv',
      txt:'Journal · ' + accName(j.dr === key ? j.cr : j.dr) + (j.note ? ' · ' + j.note : ''), amt:j.dr === key ? j.amt : -j.amt, ts:Number(String(j.id).replace(/\D/g, '').slice(0, 13)) || 0 }));
  });
  return E.sort((a, b) => (a.d || '').localeCompare(b.d || '') || a.ts - b.ts);
}
const balTxt = v => Math.abs(v) < 0.005 ? money(0) : money(Math.abs(v)) + (v > 0 ? ' ' + L('लेना', 'Dr') : ' ' + L('देना', 'Cr'));
function openStatement(ty, id){
  const p = linkedParty(ty, id); if(!p.me) return;
  openWin(`<h3>📄 ${L('PDF स्टेटमेंट', 'PDF statement')} · ${esc(p.me.name)}</h3>
    <p class="hint2">${L('इस पार्टी से हुए सारे लेन-देन की PDF बनाकर किसी भी ऐप पर शेयर करें।', 'Make a PDF of all dealings with this party and share it to any app.')}</p>
    ${rangeBox('fy')}
    <div class="secT">✅ ${L('PDF में क्या-क्या हो', 'What to include')}</div>
    ${p.c ? optBox('op_sale', true, L('बिक्री के बिल', 'Sale bills')) + optBox('op_lines', true, L('हर बिल का सामान (विवरण)', 'Items in each bill')) : ''}
    ${p.s ? optBox('op_purch', true, L('ख़रीद', 'Purchases')) : ''}
    ${optBox('op_pay', true, L('पैसा मिला / दिया (रसीद, भुगतान)', 'Money received / paid'))}
    ${optBox('op_ret', true, L('वापसी (क्रेडिट / डेबिट नोट)', 'Returns (credit / debit notes)'))}
    ${optBox('op_bal', true, L('हर लाइन के बाद बाक़ी रक़म', 'Running balance on each line'))}
    <button class="green" style="margin-top:12px" onclick="makeStatement('${ty}','${id}')">📄 ${L('PDF बनाएँ', 'Make PDF')}</button>
    <button class="gray" style="margin-top:12px" onclick="closePreview()">${t('close')}</button>
    <div id="pdfOut"></div>`);
}
function makeStatement(ty, id){
  const p = linkedParty(ty, id), r = getRange(), all = partyEntries(p);
  const want = e => e.k === 'ob' || e.k === 'jv' || (e.k === 'sale' && chk('op_sale')) || (e.k === 'purch' && chk('op_purch')) || (e.k === 'pay' && chk('op_pay')) || (e.k === 'ret' && chk('op_ret'));
  const showBal = chk('op_bal'), lines = chk('op_lines');
  let bal = all.filter(e => r.f && (e.d || '') < r.f).reduce((a, e) => a + e.amt, 0);
  const open = bal, rows = [];
  const cols = showBal
    ? [{ h:t('date'), w:.13 }, { h:L('विवरण', 'Particulars'), w:.42 }, { h:L('लेना (Dr)', 'Debit'), w:.14, a:'r' }, { h:L('देना (Cr)', 'Credit'), w:.14, a:'r' }, { h:L('बाक़ी', 'Balance'), w:.17, a:'r' }]
    : [{ h:t('date'), w:.15 }, { h:L('विवरण', 'Particulars'), w:.53 }, { h:L('लेना (Dr)', 'Debit'), w:.16, a:'r' }, { h:L('देना (Cr)', 'Credit'), w:.16, a:'r' }];
  if(r.f) rows.push({ c:['', L('पिछला बाक़ी (Opening)', 'Opening balance'), '', '', showBal ? balTxt(open) : ''].slice(0, cols.length), b:true, tone:'open' });
  let dr = 0, cr = 0;
  all.filter(e => inRange(e.d, r)).forEach(e => {
    bal += e.amt;
    if(!want(e)) return;
    if(e.amt > 0) dr += e.amt; else cr += -e.amt;
    const c = [fmtDate(e.d), e.txt, e.amt > 0 ? money(e.amt) : '', e.amt < 0 ? money(-e.amt) : ''];
    if(showBal) c.push(balTxt(bal));
    rows.push({ c, colors:[null, null, '#b45309', '#15803d', bal > 0.005 ? '#b91c1c' : '#15803d'] });
    if(lines && e.lines) e.lines.forEach(r => rows.push({ sub:r.charge ? `• ${r.n} = ${money(r.tot)}` : `• ${r.n}  ${fmtQty(r.q)}${r.fq ? ' +' + fmtQty(r.fq) + ' ' + L('फ़्री', 'free') : ''} ${uLabel(r.unit)} × ${money(r.r)}${r.disc > 0.004 ? ' − ' + money(r.disc) : ''}${r.gst ? ' + GST ' + r.gst + '%' : ''} = ${money(r.tot)}` }));
  });
  const me = p.me, party = [me.name, [me.phone && '📞 ' + me.phone, me.gstin && 'GSTIN ' + me.gstin].filter(Boolean).join('   '), me.address || ''].filter(Boolean);
  const doc = { title:L('खाता स्टेटमेंट', 'Account Statement'), period:rangeTxt(r), party, cols, rows,
    summary:[...(r.f ? [[L('पिछला बाक़ी', 'Opening balance'), balTxt(open)]] : []), [L('कुल लेना (Dr)', 'Total debit'), money(dr)], [L('कुल देना (Cr)', 'Total credit'), money(cr)],
      [bal > 0.005 ? L('आपसे लेना बाक़ी', 'Balance due from you') : bal < -0.005 ? L('आपको देना बाक़ी', 'Balance payable to you') : L('बाक़ी', 'Balance'), money(Math.abs(bal)), 'big']] };
  makePdf(doc, `${me.name} statement ${r.f || 'start'} to ${r.t || today()}`);
}

/* ---------- Sales list and purchase list PDFs ---------- */
function openListPdf(kind){
  const sale = kind === 'sale';
  openWin(`<h3>📄 ${sale ? L('बिक्री की सूची की PDF', 'Sales list PDF') : L('ख़रीद की सूची की PDF', 'Purchase list PDF')}</h3>
    <p class="hint2">${L('पूरे महीने या साल की PDF बनाकर शेयर करें।', 'Make a PDF for a whole month or year and share it.')}</p>
    ${rangeBox('month')}
    <div class="secT">✅ ${L('PDF में क्या-क्या हो', 'What to include')}</div>
    ${sale ? optBox('op_lines', false, L('हर बिल का सामान (विवरण)', 'Items in each bill')) + optBox('op_status', true, L('पेड / पेंडिंग स्थिति', 'Paid / pending status')) : optBox('op_rate', true, L('रेट और मात्रा', 'Rate and quantity'))}
    <button class="green" style="margin-top:12px" onclick="makeListPdf('${kind}')">📄 ${L('PDF बनाएँ', 'Make PDF')}</button>
    <button class="gray" style="margin-top:12px" onclick="closePreview()">${t('close')}</button>
    <div id="pdfOut"></div>`);
}
function makeListPdf(kind){
  const r = getRange(), rows = [];
  if(kind === 'sale'){
    const list = db.invoices.filter(i => inRange(i.cd, r)).sort((a, b) => (a.cd || '').localeCompare(b.cd || '') || (a.ts || 0) - (b.ts || 0));
    const st = chk('op_status'), lines = chk('op_lines');
    const cols = [{ h:t('date'), w:.12 }, { h:t('billNo'), w:.15 }, { h:L('ग्राहक', 'Customer'), w:st ? .25 : .33 }, { h:L('GST से पहले', 'Taxable'), w:.16, a:'r' }, { h:'GST', w:.12, a:'r' }, { h:t('total'), w:st ? .12 : .12, a:'r' }];
    if(st) cols.push({ h:L('स्थिति', 'Status'), w:.08 });
    let sub = 0, gst = 0, tot = 0, paid = 0;
    list.forEach(i => {
      const x = totals(i); sub += x.sub; gst += x.gstAmt; tot += x.total; if(i.paid) paid += x.total;
      const c = [fmtDate(i.cd), i.no, i.cn, money(x.sub), money(x.gstAmt), money(x.total)];
      if(st) c.push(i.paid ? L('पेड', 'Paid') : L('बाक़ी', 'Due'));
      rows.push({ c, colors:[null, null, null, null, null, null, i.paid ? '#15803d' : '#b91c1c'] });
      if(lines) i.lines.forEach(l => rows.push({ sub:`• ${l.n}  ${fmtQty(l.q)} ${uLabel(l.unit)} × ${money(l.r)}${l.gst ? ' + GST ' + l.gst + '%' : ''}` }));
    });
    makePdf({ title:L('बिक्री की सूची', 'Sales Register'), period:rangeTxt(r), cols, rows,
      summary:[[L('कुल बिल', 'Total bills'), String(list.length)], [L('GST से पहले', 'Taxable value'), money(sub)], ['GST', money(gst)],
        [L('पैसा मिला', 'Received'), money(paid), 'green'], [L('बाक़ी', 'Pending'), money(tot - paid), 'red'], [L('कुल बिक्री', 'Total sales'), money(tot), 'big']] },
      `Sales ${r.f || 'start'} to ${r.t || today()}`);
  } else {
    const list = db.purchases.filter(p => inRange(p.date, r)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const rq = chk('op_rate');
    const cols = rq ? [{ h:t('date'), w:.13 }, { h:L('सप्लायर', 'Supplier'), w:.25 }, { h:t('desc'), w:.25 }, { h:t('qty'), w:.12, a:'r' }, { h:t('rate'), w:.11, a:'r' }, { h:L('रक़म', 'Amount'), w:.14, a:'r' }]
                    : [{ h:t('date'), w:.15 }, { h:L('सप्लायर', 'Supplier'), w:.33 }, { h:t('desc'), w:.34 }, { h:L('रक़म', 'Amount'), w:.18, a:'r' }];
    let tot = 0;
    list.forEach(p => { const a = pAmt(p); tot += a;
      rows.push({ c:rq ? [fmtDate(p.date), p.supplier, p.n, fmtQty(p.q) + ' ' + uLabel(p.unit), money(p.r), money(a)] : [fmtDate(p.date), p.supplier, p.n, money(a)] }); });
    makePdf({ title:L('ख़रीद की सूची', 'Purchase Register'), period:rangeTxt(r), cols, rows,
      summary:[[L('कुल एंट्री', 'Total entries'), String(list.length)], [L('कुल ख़रीद', 'Total purchases'), money(tot), 'big']] },
      `Purchases ${r.f || 'start'} to ${r.t || today()}`);
  }
}

if(NEED_IDB){ try{ const str = await idbOp('readonly', st => st.get('db:' + DB_KEY)); if(str) db = normalize(JSON.parse(str)); }catch(e){} }

<div id="licLock" style="display:none;position:fixed;inset:0;background:#1f5fbf;z-index:30;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px;padding:20px;text-align:center">
  <h2 style="margin:0">BillEasy</h2>
  <div id="licMsg"></div>
  <input id="licIn" placeholder="BE-YYYYMMDD-XXXX" style="width:260px;text-align:center;font-size:18px;padding:8px;border-radius:8px;border:0">
  <button class="green" onclick="activateLic()">सक्रिय करें / Activate</button>
  <div id="licErr" style="color:#ffd3d3"></div>
</div>
<script>
/* ---- License settings: change LIC_SECRET before publishing and keep it private ---- */
const LIC_SECRET = 'BILLEASY-CHANGE-THIS-SECRET';
const LIC_CONTACT = 'आपका UPI ID या फ़ोन नंबर यहाँ लिखें';
const TRIAL_DAYS = 30;
/* true = सबके लिए मुफ़्त (कोई ट्रायल या लॉक नहीं). बाद में पेड व्यवस्था चालू करने के लिए false करें. */
const FREE_MODE = true;

function todayYMD(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function checkLicense(){
  const today = todayYMD();
  if(FREE_MODE){
    const tg = document.getElementById('tagline');
    tg.textContent = tg.textContent.split(' · ')[0];
    return;
  }
  if(!db.settings.trialStart){ db.settings.trialStart = today; save(); }
  const trialLeft = TRIAL_DAYS - daysBetween(db.settings.trialStart, today);
  const tag = document.getElementById('tagline');
  const base = tag.textContent.split(' · ')[0];
  if(db.settings.licUntil && db.settings.licUntil >= today){
    tag.textContent = base + ' · सक्रिय / Active'; return;
  }
  if(trialLeft > 0){
    tag.textContent = base + ' · ट्रायल: ' + trialLeft + ' दिन'; return;
  }
  document.getElementById('licMsg').innerHTML =
    'ट्रायल समाप्त हो गया है।<br>पूरे ऐप के लिए ₹999 प्रति 3 महीने।<br>भुगतान के बाद सक्रियण कोड लें: ' + LIC_CONTACT;
  document.getElementById('licLock').style.display = 'flex';
}
async function activateLic(){
  const code = document.getElementById('licIn').value.trim().toUpperCase();
  const err = document.getElementById('licErr');
  const wait = guardWait('lic');
  if(wait){ err.textContent = 'बहुत बार गलत कोड। ' + wait + ' सेकंड बाद फिर कोशिश करें'; return; }
  const m = code.match(/^BE-(\d{8})-([0-9A-F]{4})$/);
  if(!m){ err.textContent = 'कोड सही फ़ॉर्मेट में नहीं है'; return; }
  const ymd = m[1].slice(0,4) + '-' + m[1].slice(4,6) + '-' + m[1].slice(6,8);
  const h = await sha(LIC_SECRET + ymd);
  if(h.slice(0,4).toUpperCase() !== m[2]){ guardFail('lic'); err.textContent = 'कोड गलत है'; return; }
  guardOk('lic');
  if(ymd < todayYMD()){ err.textContent = 'यह कोड समाप्त हो चुका है'; return; }
  db.settings.licUntil = ymd; save();
  err.textContent = '';
  document.getElementById('licLock').style.display = 'none';
  checkLicense();
}
applyDesign();
checkLicense();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
