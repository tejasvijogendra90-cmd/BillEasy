<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillEasy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="qrcode.js"></script>
<script src="xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5fb;margin:0;color:#1d2433}
header{background:linear-gradient(135deg,#1f5fbf,#3a8ee6);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;opacity:.85}
select{padding:6px;border-radius:6px;border:1px solid #cfd7e6;font-size:14px;background:#fff}
header select{border:0}
.wrap{max-width:900px;margin:auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
h3{margin:0 0 8px;color:#1f5fbf}
label{display:block;margin:10px 0 4px;font-size:14px;color:#444}
input{width:100%;padding:9px;border:1px solid #cfd7e6;border-radius:8px;font-size:15px;background:#fff}
button{background:#1f5fbf;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
button.green{background:#2e8b57}
button.wa{background:#25d366}
button.red{background:#c0392b}
button.gray{background:#6b7280}
button.light{background:#e3ebf7;color:#1d2433}
button.on{background:#1f5fbf;color:#fff}
button.sm{padding:6px 9px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #eef1f6;padding:7px 5px;text-align:left;vertical-align:middle}
.tot{font-size:18px;font-weight:bold;text-align:right;margin-top:12px;line-height:1.7}
.paid{color:#2e8b57;font-weight:bold}
.due{color:#c0392b;font-weight:bold}
.low{color:#c0392b;font-weight:bold}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary div{flex:1;min-width:130px;background:#f5f8fd;padding:12px;border-radius:10px;text-align:center;font-size:14px}
.summary b{display:block;font-size:19px;margin-top:4px}
.sugg{background:#fff;border:1px solid #cfd7e6;border-radius:8px;margin-top:4px;max-height:220px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #eef1f6;display:flex;gap:8px;align-items:center}
.sugg div:hover{background:#eef4fc}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#eef1f6;border:1px solid #ddd}
.ph{width:42px;height:42px;border-radius:6px;background:#eef1f6;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.cust-row{cursor:pointer}
.cust-row:hover{background:#f5f8fd}
.line td input{padding:6px}
.view{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;overflow:auto;padding:20px}
#modal .box{background:#fff;max-width:760px;margin:auto;border-radius:12px;padding:16px}
#print{display:none}
.bill{font-size:14px}
.qr{width:140px;height:140px;border:1px solid #eee;border-radius:8px}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px}
}
.bill{font-family:var(--bfont,system-ui,sans-serif)}
.bill .title{font-size:20px;font-weight:bold;color:var(--bcolor,#1f5fbf);text-align:var(--balign,left);margin-bottom:4px}
.bill h2{color:var(--bcolor,#1f5fbf)!important;text-align:var(--balign,left)}
.bill .tot{text-align:right}
.tpl-classic table td,.tpl-classic table th{border:1px solid #999;padding:6px}
.tpl-classic table th{background:#f0f0f0}
.tpl-modern table th{background:var(--bcolor,#1f5fbf);color:#fff;border:none;padding:8px}
.tpl-modern table td{border-bottom:1px solid #eee;padding:7px}
.tpl-modern .tot b{color:var(--bcolor,#1f5fbf)}
.tpl-minimal table td,.tpl-minimal table th{border:none;border-bottom:1px solid #ddd;padding:6px}
.tpl-minimal table th{color:var(--bcolor,#1f5fbf)}

/* ---------- Motion: short, smooth, never blocks work ---------- */
:root{--ease:cubic-bezier(.22,.9,.3,1)}
button{transition:transform .15s var(--ease),box-shadow .2s,background-color .25s,color .25s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
button:not(.light):not(.sm):hover{box-shadow:0 4px 12px rgba(31,95,191,.25)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
button.light .rip,button.on .rip{background:rgba(31,95,191,.25)}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.tabs button{transition:transform .15s var(--ease),background-color .3s,color .3s,box-shadow .3s}
.tabs button.on{box-shadow:0 4px 14px rgba(31,95,191,.35)}
.view.enter{animation:viewIn .32s var(--ease)}
.view.enter .card{animation:cardIn .42s var(--ease) both}
.view.enter .card:nth-child(2){animation-delay:.05s}
.view.enter .card:nth-child(3){animation-delay:.1s}
.view.enter .card:nth-child(4){animation-delay:.15s}
.view.enter .card:nth-child(n+5){animation-delay:.2s}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{transition:box-shadow .3s}
.sugg:not(:empty){animation:dropIn .2s var(--ease);box-shadow:0 8px 20px rgba(20,50,100,.12)}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sugg div{transition:background-color .15s}
.sugg .hint{font-size:12px;color:#6b7a90;cursor:default;background:#f7f9fd}
tr.line.added td{animation:rowIn .9s var(--ease)}
@keyframes rowIn{0%{background:#d9f2e3}100%{background:transparent}}
tr.line.added{animation:rowSlide .35s var(--ease)}
@keyframes rowSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.tot.pulse{animation:pulse .35s var(--ease)}
@keyframes pulse{50%{transform:scale(1.04);color:#2e8b57}}
.tot{transform-origin:right center}
.low{animation:lowBlink 2.4s ease-in-out infinite}
@keyframes lowBlink{50%{opacity:.55}}
#modal{animation:fadeIn .2s ease}
#modal .box{animation:boxIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes boxIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3a8ee6;box-shadow:0 0 0 3px rgba(58,142,230,.18)}
header .brand svg{animation:logoIn .6s var(--ease)}
@keyframes logoIn{from{transform:rotate(-12deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
#lock{animation:fadeIn .25s ease}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.vids{display:grid;gap:10px}
.vids a{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e3ebf7;border-radius:12px;text-decoration:none;color:#1d2433;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s}
.vids a:hover,.vids a:active{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,95,191,.15);border-color:#9bb8e6}
.vids .play{flex:none;width:40px;height:40px;border-radius:50%;background:#e62117;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.vids small{display:block;color:#6b7a90;font-size:12px}

/* ---------- Colourful look ---------- */
body{background:linear-gradient(180deg,#eef3ff 0%,#f6f0ff 45%,#effaf4 100%) fixed}
header{background:linear-gradient(120deg,#1e40af 0%,#2563eb 40%,#7c3aed 100%);box-shadow:0 6px 20px rgba(37,99,235,.3)}
.brand small{opacity:.95;font-weight:600;letter-spacing:.3px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.tabs{grid-template-columns:repeat(8,1fr)}}
.tabs button{margin:0;padding:9px 4px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#fff;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 30%,transparent);font-weight:800;font-size:13px;line-height:1.15;
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 16%,transparent)}
.tabs button .ti{font-size:21px;line-height:1;filter:saturate(1.2)}
.tabs button .tl{display:block;min-height:15px}
.tabs button.light{background:#fff;color:var(--c)}
.tabs button.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-2px)}
.tabs button.on:active{transform:scale(.95)}
#newView{--vc:#16a34a}#listView{--vc:#2563eb}#itemsView{--vc:#9333ea}#purchView{--vc:#ea580c}
#ledgerView{--vc:#dc2626}#custView{--vc:#0d9488}#settingsView{--vc:#475569}#videosView{--vc:#e11d48}
#rcptView{--vc:#0891b2}#cashView{--vc:#65a30d}#cnView{--vc:#db2777}#dnView{--vc:#b45309}
#vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;min-height:0}
#vbar:empty{display:none}
#vbar .vt{font-weight:800;font-size:17px;color:var(--vc,#1e3a8a)}
#vbar .lb{margin:0;padding:7px 13px;font-size:13.5px;font-weight:800;border-radius:20px;white-space:nowrap;
  background:linear-gradient(135deg,var(--vc,#2563eb),color-mix(in srgb,var(--vc,#2563eb) 70%,#000))}
#vbar .lb .n{display:inline-block;min-width:20px;margin-left:5px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.28)}
.inout{display:flex;gap:6px}.inout button{flex:1;margin:0}
.cashOnly .cmore{display:none}
button.pdfBtn{background:linear-gradient(135deg,#e11d48,#be123c)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.rchips button{margin:0;border-radius:20px}
.rchips button.on{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
.pdfReady{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:14px;background:#f0fdf4;border:1px solid #bbf7d0;flex-wrap:wrap}
.pdfReady img{width:96px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.18);background:#fff}
.pdfReady>div{flex:1 1 170px}.pdfReady b{display:block;color:#15803d}.pdfReady small{display:block;color:#4b5563;margin:2px 0 6px}
.pdfReady button{margin:4px 6px 0 0}
/* ---------- Settings: neat sections that open and close ---------- */
.setHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#eef2ff,#fdf4ff)!important;border-top:0!important}
.setHead .shLogo{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;box-shadow:0 4px 12px rgba(80,60,160,.18);flex:none}
.setHead .shLogo img{width:100%;height:100%;object-fit:contain}
.setHead .shTxt{flex:1 1 150px;min-width:0}.setHead .shTxt b{display:block;font-size:17px;color:#312e81}
.setHead .shTxt small{display:block;color:#6b7280;font-size:12.5px;margin-top:2px}
.setHead button{margin:0;background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.sset{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 14px rgba(30,60,120,.08);border:1px solid #eef0f6;overflow:hidden}
.sset summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sset summary::-webkit-details-marker{display:none}
.sset .si{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;
  background:color-mix(in srgb,var(--sc) 14%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 25%,#fff)}
.sset .st{flex:1;min-width:0}.sset .st b{display:block;font-size:15.5px;color:color-mix(in srgb,var(--sc) 80%,#111)}
.sset .st small{display:block;font-size:12px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sset .sc{font-size:20px;color:#94a3b8;transition:transform .3s var(--ease)}
.sset[open] .sc{transform:rotate(180deg);color:var(--sc)}
.sset[open] summary{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 8%,#fff),#fff);border-bottom:1px solid #f1f3f8}
.sset .sb{padding:4px 14px 16px}
.sset[open] .sb{animation:dropIn .3s var(--ease)}
.sset .grid2>div,.sset .grid3>div{min-width:0}
.sset select{width:100%;max-width:100%}
.sset textarea{width:100%;padding:9px;border:1px solid #cfd7e6;border-radius:8px;font:inherit}
.secT{margin:16px 0 4px;font-weight:800;font-size:14px;color:#334155}
.hint2{font-size:12.5px;color:#6b7280;margin:6px 0}
.swg{margin-top:8px;border:1px solid #eef0f6;border-radius:12px;padding:8px 10px;background:#fbfcff}
.swgT{font-weight:700;font-size:13px;color:#475569;margin-bottom:4px}
.swgB{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
@media(max-width:520px){.swgB{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px;color:#1f2937;cursor:pointer;font-weight:500}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:12px;background:#cbd5e1;position:relative;flex:none;margin:0;padding:0;border:0;cursor:pointer;transition:background .25s}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw input:checked{background:linear-gradient(135deg,#22c55e,#16a34a)}
.sw input:checked::after{transform:translateX(17px)}
.dprev{border:1px dashed #9bb3d9;padding:10px;border-radius:10px;overflow:auto;background:#fff}
.saveBar{position:sticky;bottom:0;z-index:5;padding:10px 0 12px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(240,244,255,.95) 40%)}
.saveBar button{width:100%;margin:0;padding:13px;font-size:16px;font-weight:800;border-radius:14px;box-shadow:0 8px 20px rgba(22,163,74,.35)}
.imgpick{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.imgpick>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.imgpick .logo{width:64px;height:64px;border-radius:16px;margin:0;padding:0;background:linear-gradient(135deg,#fef3c7,#fde68a)!important;color:#92400e;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;overflow:hidden;box-shadow:0 4px 12px rgba(146,64,14,.22),inset 0 0 0 2px #fff}
.imgpick .logo.sig{width:120px;background:linear-gradient(135deg,#e0f2fe,#bae6fd)!important;color:#075985}
.imgpick .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.imgpick small{font-size:12px;color:#475569;font-weight:700}.imgpick .sm{margin:0}
.t3{font-size:11px;font-weight:700;color:#7c3aed;background:#f3e8ff;padding:1px 7px;border-radius:10px;margin-left:4px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips span{font-size:12px;padding:3px 9px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:600}
.cashOnly .chips{display:none}
.win h3{margin-top:0}.win .newg{display:none;margin-top:8px;padding:10px;border-radius:12px;background:#faf5ff;border:1px dashed #c4b5fd}
.win .newg.show{display:block;animation:dropIn .25s var(--ease)}
.cashTip{display:none;margin-top:6px;padding:7px 10px;border-radius:10px;background:#ecfdf5;color:#047857;font-size:13px;font-weight:700}
.cashOnly .cashTip{display:block;animation:dropIn .25s var(--ease)}
/* dates show as DD/MM/YY everywhere; tapping opens the phone's calendar */
.dwrap{position:relative;display:block}
.dwrap input[type=date]{color:transparent}
.dwrap input[type=date]:focus{color:transparent}
.dwrap .dtxt{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:15px;color:#1d2433;font-weight:600}
.billOpen{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:10px;border-radius:12px;background:linear-gradient(135deg,#eef6ff,#f5f3ff)}
.billOpen input{flex:1 1 140px}.billOpen button{margin:0;flex:none}
.view .card{border-top:4px solid var(--vc,#2563eb);border-radius:14px;box-shadow:0 6px 18px rgba(30,60,120,.08)}
.view h3{color:var(--vc,#1f5fbf);font-weight:800}
.view label{font-weight:600;color:#374151}
.view table th{background:color-mix(in srgb,var(--vc,#2563eb) 10%,#fff);color:color-mix(in srgb,var(--vc,#2563eb) 75%,#111);font-weight:700}
.view .card > .tot{color:#0f3a82;background:linear-gradient(135deg,#eef6ff,#f2fbf5);border-radius:12px;padding:10px 14px;display:inline-block;float:right;clear:both}
.view .card::after{content:'';display:table;clear:both}
.summary div{background:linear-gradient(135deg,color-mix(in srgb,var(--vc,#2563eb) 12%,#fff),#fff);border:1px solid color-mix(in srgb,var(--vc,#2563eb) 18%,#fff);font-weight:600}
.summary div:nth-child(2){background:linear-gradient(135deg,#fff1f2,#fff)}
.summary div:nth-child(3){background:linear-gradient(135deg,#f5f3ff,#fff)}
button{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
button.green{background:linear-gradient(135deg,#16a34a,#0f7a37)}
button.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}
button.gray{background:linear-gradient(135deg,#64748b,#475569)}
button.wa{background:linear-gradient(135deg,#25d366,#128c4a)}
button.light{background:#eef2ff;color:#1e3a8a}
.sugg div:hover{background:color-mix(in srgb,var(--vc,#2563eb) 8%,#fff)}
.ph{background:linear-gradient(135deg,#fef3c7,#fde68a)}

/* ---------- Zip opening screen ---------- */
#zip{position:fixed;inset:0;z-index:40;touch-action:none;cursor:grab;background:transparent}
#zip canvas{position:absolute;inset:0;width:100%;height:100%}
#zip .zhint{position:absolute;left:0;right:0;text-align:center;color:#fff;font-size:15px;font-weight:600;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.35);transition:opacity .3s}
#zip.grab{cursor:grabbing}

/* ---------- Side menu (☰): stays open until ☰ is tapped again ---------- */
:root{--sideW:118px;--hh:64px}
@media(min-width:700px){:root{--sideW:150px}}
header{position:sticky;top:0;z-index:30;flex-wrap:nowrap}
.burger{margin:0 4px 0 0;width:42px;height:42px;padding:0;border-radius:12px;background:rgba(255,255,255,.18)!important;font-size:22px;line-height:1;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.burger.on{background:#fff!important;color:#1e40af}
.brand{min-width:0}
#side{position:fixed;left:0;top:var(--hh);bottom:0;width:var(--sideW);z-index:25;display:flex;flex-direction:column;gap:7px;padding:10px 7px 12px;
  background:linear-gradient(180deg,#ffffff,#f3f0ff);box-shadow:4px 0 18px rgba(30,60,140,.12);overflow-y:auto;overflow-x:hidden;
  transform:translateX(-105%);transition:transform .32s var(--ease);perspective:700px}
body.menu #side{transform:none}
.wrap{transition:margin-left .32s var(--ease)}
body.menu .wrap{margin-left:var(--sideW)}
@media(min-width:1150px){body.menu .wrap{margin-left:auto}}
.co{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px 9px;margin-bottom:2px;border-bottom:2px dashed #ddd6fe}
.co .logo{width:54px;height:54px;border-radius:16px;margin:0;padding:0;background:linear-gradient(135deg,#fef3c7,#fde68a)!important;color:#92400e;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1.1;text-align:center;overflow:hidden;
  box-shadow:0 4px 12px rgba(146,64,14,.25),inset 0 0 0 2px #fff}
.co .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.co .cn{font-size:11.5px;font-weight:800;color:#312e81;text-align:center;line-height:1.2;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.co .cedit{margin:0;padding:4px 8px;font-size:11px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#4f46e5)!important}
#side .mi{margin:0;width:100%;padding:11px 6px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
  background:#fff;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 30%,transparent);font-weight:800;font-size:13.5px;line-height:1.2;
  box-shadow:0 3px 8px color-mix(in srgb,var(--c) 14%,transparent)}
#side .mi .ti,#sideTip .ti{display:none}
#side .mi .tl{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .mi.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent}
#side .gap{flex:1 0 6px}
#sideTip{position:fixed;z-index:35;pointer-events:none;padding:8px 14px;border-radius:14px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;box-shadow:0 12px 26px rgba(20,30,80,.35);opacity:0;transform:translateX(-12px) scale(.9);
  transition:opacity .22s,transform .3s var(--ease)}
#sideTip.show{opacity:1;transform:none}
#modal{z-index:50}
#lock{z-index:55!important}
#licLock{z-index:56!important}

/* ---------- 3D tap: what you tap lifts up, the last one settles back ---------- */
button,.card,tr,.sugg div,.vids a{transition:transform .28s var(--ease),box-shadow .28s var(--ease),background-color .25s,color .25s}
.up{position:relative;z-index:3}
button.up,#side .mi.up{transform:perspective(500px) translateZ(18px) translateY(-3px);box-shadow:0 12px 22px rgba(30,50,120,.32)!important}
#side .mi.up{z-index:4}
.card.up{transform:translateY(-3px);box-shadow:0 16px 34px rgba(30,60,140,.18)!important}
tr.up,.sugg div.up{transform:translateY(-2px) scale(1.01);box-shadow:0 8px 18px rgba(30,60,140,.16);background:#fff}
.vids a.up{transform:translateY(-3px);box-shadow:0 10px 22px rgba(31,95,191,.2)}
button.up:active,#side .mi.up:active{transform:perspective(500px) translateZ(6px) scale(.97)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

/* ---- Security: clean every value that comes from storage or a backup file ----
   A backup file can come from anyone, so ids, bill numbers, dates, numbers,
   pictures and design values are forced into safe shapes before use. */
function safeId(v){ return String(v ?? '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40); }
function safeTxt(v, max){ return String(v ?? '').replace(/[<>"'`\\&]/g, '').slice(0, max || 60); }
function safeStr(v, max){ return String(v ?? '').slice(0, max || 500); }
function safeNum(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function safeDate(v){ v = String(v ?? ''); return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : ''; }
function safeImg(v){ v = String(v ?? ''); return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : ''; }
function pick(v, list, def){ return list.includes(v) ? v : def; }
function arr(v){ return Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : []; }
function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  const s = d.settings = Object.assign({}, blankSettings, (d.settings && typeof d.settings === 'object') ? d.settings : {});
  ['name','addr','city','phone','gstin','upi','terms','footer'].forEach(k => { s[k] = safeStr(s[k], k === 'terms' ? 2000 : 300); });
  s.gst = safeNum(s.gst); s.next = Math.max(1, Math.floor(safeNum(s.next)) || 1);
  s.lang = pick(s.lang, Object.keys(LANGS), 'en');
  s.billPrefix = safeTxt(s.billPrefix, 20);
  s.billNoMode = pick(s.billNoMode, ['auto','manual'], 'auto');
  s.entryMode = pick(s.entryMode, ['manual','scan'], 'manual');
  s.paper = pick(s.paper, ['a4','thermal'], 'a4');
  s.logo = safeImg(s.logo); s.sign = safeImg(s.sign);
  s.cfields = (Array.isArray(s.cfields) ? s.cfields : []).map(f => safeTxt(f, 40)).filter(Boolean).slice(0, 20);
  const b = (s.bank && typeof s.bank === 'object') ? s.bank : {};
  s.bank = { holder:safeStr(b.holder,100), name:safeStr(b.name,100), acc:safeStr(b.acc,40), ifsc:safeStr(b.ifsc,20) };
  const sh = Object.assign({}, DEFAULT_SHOW, (s.show && typeof s.show === 'object') ? s.show : {});
  s.show = Object.fromEntries(SHOW_KEYS.map(k => [k, !!sh[k]]));
  s.backupMode = s.backupMode === 'auto' ? 'auto' : 'manual';
  const D = Object.assign({ template:'classic', color:'#1f5fbf', font:'system', align:'left', title:'टैक्स इनवॉइस / बिल' }, (s.design && typeof s.design === 'object') ? s.design : {});
  s.design = { template:pick(D.template, ['classic','modern','minimal'], 'classic'),
    color:/^#[0-9a-fA-F]{6}$/.test(D.color) ? D.color : '#1f5fbf',
    font:pick(D.font, ['system','serif','rounded'], 'system'),
    align:pick(D.align, ['left','center','right'], 'left'), title:safeStr(D.title, 100) };
  s.zipOn = s.zipOn !== false;
  s.pinOn = !!s.pinOn; s.pinHash = /^[0-9a-f]*$/.test(s.pinHash || '') ? (s.pinHash || '') : '';
  s.pinSalt = /^[0-9a-f]*$/.test(s.pinSalt || '') ? (s.pinSalt || '') : '';
  s.trialStart = safeDate(s.trialStart) || undefined; s.licUntil = safeDate(s.licUntil) || undefined;
  const extra = x => { const o = {}; if(x && typeof x === 'object') Object.keys(x).slice(0, 20).forEach(k => { const kk = safeTxt(k, 40); if(kk) o[kk] = safeStr(x[k], 300); }); return o; };
  const line = l => ({ iid:l.iid ? safeId(l.iid) : null, n:safeStr(l.n, 200), hsn:safeStr(l.hsn, 20),
    unit:pick(l.unit, UNITS, 'pcs'), q:safeNum(l.q), r:safeNum(l.r), gst:safeNum(l.gst) });
  d.customers = arr(d.customers).map(c => ({ id:safeId(c.id) || ('C' + randHex()), name:safeStr(c.name, 200), phone:safeStr(c.phone, 30),
    gstin:safeStr(c.gstin, 20), email:safeStr(c.email, 100), address:safeStr(c.address, 300), extra:extra(c.extra),
    group:safeStr(c.group, 80) || (c.id === 'CASH' ? 'Cash-in-hand' : 'Sundry Debtors') }));
  /* a ready "Cash" account in every company, so nobody has to make one */
  if(!d.customers.some(c => c.id === 'CASH')) d.customers.unshift({ id:'CASH', name:'Cash', phone:'', gstin:'', email:'', address:'', extra:{}, group:'Cash-in-hand' });
  d.groups = arr(d.groups).map(g => ({ id:safeId(g.id) || ('G' + randHex()), name:safeStr(g.name, 80), parent:safeStr(g.parent, 80) })).filter(g => g.name);
  d.items = arr(d.items).map(i => ({ id:safeId(i.id) || ('I' + randHex()), name:safeStr(i.name, 200), photo:safeImg(i.photo), hsn:safeStr(i.hsn, 20),
    gst:safeNum(i.gst), unit:pick(i.unit, UNITS, 'pcs'), sale:safeNum(i.sale), buy:safeNum(i.buy), stock:safeNum(i.stock),
    bc:safeStr(i.bc, 60), minQty:safeNum(i.minQty), stockDate:safeDate(i.stockDate) }));
  d.suppliers = arr(d.suppliers).map(x => ({ id:safeId(x.id) || ('S' + randHex()), name:safeStr(x.name, 200),
    phone:safeStr(x.phone, 30), gstin:safeStr(x.gstin, 20), address:safeStr(x.address, 300) }));
  if(!d.suppliers.some(x => x.id === 'CASH' || /^cash$/i.test(x.name))) d.suppliers.unshift({ id:'CASH', name:'Cash', phone:'', gstin:'', address:'' });
  d.purchases = arr(d.purchases).map(p => Object.assign({}, p, { id:p.id ? safeId(p.id) : p.id, sid:p.sid ? safeId(p.sid) : p.sid,
    iid:p.iid ? safeId(p.iid) : p.iid, date:safeDate(p.date), q:safeNum(p.q), r:safeNum(p.r),
    supplier:safeStr(p.supplier, 200), n:safeStr(p.n, 200), unit:pick(p.unit, UNITS, 'pcs') }));
  d.payments = arr(d.payments).map(p => ({ id:safeId(p.id) || ('Y' + randHex()), ty:pick(p.ty, ['c','s'], 'c'), pid:safeId(p.pid),
    amt:safeNum(p.amt), date:safeDate(p.date), mode:safeStr(p.mode, 30), note:safeStr(p.note, 300),
    auto:!!p.auto, inv:p.inv !== undefined ? safeTxt(p.inv, 40) : undefined, rno:p.rno ? safeTxt(p.rno, 30) : undefined,
    note2:p.note2 ? safeId(p.note2) : undefined }));
  /* credit notes (sale return) and debit notes (purchase return) */
  d.notes = arr(d.notes).map(n => ({ id:safeId(n.id) || ('N' + randHex()), ty:pick(n.ty, ['cn','dn'], 'cn'), no:safeTxt(n.no, 30),
    date:safeDate(n.date), pid:safeId(n.pid), pname:safeStr(n.pname, 200), iid:n.iid ? safeId(n.iid) : null, n:safeStr(n.n, 200),
    unit:pick(n.unit, UNITS, 'pcs'), q:safeNum(n.q), r:safeNum(n.r), reason:safeStr(n.reason, 300), ts:safeNum(n.ts) || undefined }));
  /* cash book entries typed by hand (expenses, cash added, opening cash) */
  d.cashbook = arr(d.cashbook).map(c => ({ id:safeId(c.id) || ('K' + randHex()), date:safeDate(c.date), dir:pick(c.dir, ['in','out'], 'out'),
    amt:Math.abs(safeNum(c.amt)), note:safeStr(c.note, 300) }));
  ['nextRcpt','nextCn','nextDn'].forEach(k => { s[k] = Math.max(1, Math.floor(safeNum(s[k])) || 1); });
  d.invoices = arr(d.invoices).map(inv => {
    const lines = Array.isArray(inv.lines) ? inv.lines : (Array.isArray(inv.items) ? inv.items.map(l => ({ n:l.n, q:l.q, r:l.r, gst:s.gst })) : []);
    return { no:safeTxt(inv.no, 40), cid:inv.cid ? safeId(inv.cid) : null, cn:safeStr(inv.cn, 200), cp:safeStr(inv.cp, 30),
      cgstin:safeStr(inv.cgstin, 20), cemail:safeStr(inv.cemail, 100), caddr:safeStr(inv.caddr, 300), cextra:extra(inv.cextra),
      cd:safeDate(inv.cd), lines:lines.filter(l => l && typeof l === 'object').map(line),
      paid:!!inv.paid, pmode:safeStr(inv.pmode, 30), total:safeNum(inv.total), ts:safeNum(inv.ts) || undefined };
  });
  return d;
}

/* ---- Security: slow down guessing of PIN and activation code ----
   After 5 wrong tries the app waits 30 sec, then 1 min, 2 min ... (max 1 hour).
   The count is kept in storage, so closing and opening the app does not reset it. */
function guardState(k){ try{ return JSON.parse(localStorage.getItem('be_guard_' + k) || '{}'); }catch(e){ return {}; } }
function guardWait(k){ const g = guardState(k); return Math.max(0, Math.ceil(((g.until || 0) - Date.now()) / 1000)); }
function guardFail(k){
  const g = guardState(k); g.n = (g.n || 0) + 1;
  if(g.n >= 5) g.until = Date.now() + Math.min(3600, 30 * Math.pow(2, g.n - 5)) * 1000;
  localStorage.setItem('be_guard_' + k, JSON.stringify(g));
}
function guardOk(k){ localStorage.removeItem('be_guard_' + k); }

/* ---------- Automatic backup to a chosen folder ---------- */
let backupDir = null;
let lastBackup = '';
function idbOp(mode, fn){
  return new Promise((res, rej) => {
    const req = indexedDB.open('billeasy-cfg', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', mode);
      const r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(r.result);
      tx.onerror = () => rej(tx.error);
    };
    req.onerror = () => rej(req.error);
  });
}
async function restoreBackupHandle(){
  try{ backupDir = (await idbOp('readonly', st => st.get('dir'))) || null; }catch(e){ backupDir = null; }
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ alert(t('backupNotSupported')); return; }
  try{
    backupDir = await window.showDirectoryPicker({ mode:'readwrite' });
    await idbOp('readwrite', st => st.put(backupDir, 'dir'));
    await writeBackup();
    alert(t('backupSet'));
    renderSettings();
  }catch(e){ /* user cancelled */ }
}
async function grantBackup(){
  if(!backupDir) return;
  if((await backupDir.requestPermission({ mode:'readwrite' })) === 'granted'){ await writeBackup(); renderSettings(); }
}
async function writeBackup(){

    const w = await fh.createWritable();
    await w.write(JSON.stringify(db, null, 2));
    await w.close();
    lastBackup = new Date().toLocaleString();
  }catch(e){ /* keep working even if backup fails */ }
}

function digits(s){ return String(s||'').replace(/\D/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Indian digit grouping: 100000 -> 1,00,000.00 */
function money(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
/* Dates are stored as YYYY-MM-DD and shown as DD/MM/YY */
function fmtDate(ymd){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || '')); return m ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : String(ymd || ''); }
/* Bill time in the phone's own time format (12 or 24 hour, as set on the device) */
function fmtTime(ts){ return ts ? new Date(ts).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }) : ''; }
function fmtQty(n){ return (Number(n)||0).toLocaleString('en-IN', { maximumFractionDigits:3 }); }
/* Amount boxes show commas while typing; the stored value is always a plain number */
function parseNum(v){ const n = Number(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function fmtIn(v){
  if(v === '' || v === null || v === undefined) return '';
  const s = String(v).replace(/,/g, '');
  const dot = s.indexOf('.');
  const ip = (dot < 0 ? s : s.slice(0, dot)).replace(/\D/g, '');
  let out = ip ? Number(ip).toLocaleString('en-IN', { maximumFractionDigits:0 }) : (dot >= 0 ? '0' : '');
  if(dot >= 0) out += '.' + s.slice(dot + 1).replace(/\D/g, '').slice(0, 3);
  return out;
}
function numIn(el){
  const fromEnd = el.value.length - (el.selectionStart ?? el.value.length);
  const f = fmtIn(el.value);
  if(f !== el.value){ el.value = f; const p = Math.max(0, f.length - fromEnd); try{ el.setSelectionRange(p, p); }catch(e){} }
  return parseNum(f);
}
function amtBox(val, onin, style){

function totals(inv){
  let sub = 0, gstAmt = 0;
  (inv.lines||[]).forEach(l => {
    const amt = (Number(l.q)||0) * (Number(l.r)||0);
    sub += amt; gstAmt += amt * (Number(l.gst)||0) / 100;
  });
  return { sub, gstAmt, total: sub + gstAmt };

function qrUrl(amount){
  if(!db.settings.upi) return '';
  let link = 'upi://pay?pa=' + encodeURIComponent(db.settings.upi) + '&pn=' + encodeURIComponent(db.settings.name || 'BillEasy') + '&cu=INR';
  if(amount) link += '&am=' + Number(amount).toFixed(2);
  /* QR is made on the phone itself (qrcode.js); nothing is sent to any website */
  if(typeof qrcode === 'undefined') return '';
  try{
    if(qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const q = qrcode(0, 'M');
    q.addData(link);
    q.make();
    return q.createDataURL(6, 4);
  }catch(e){ return ''; }
}
function readPhoto(file, cb, max){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = (max || 160) / Math.max(img.width, img.height, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * Math.min(m,1)); c.height = Math.round(img.height * Math.min(m,1));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); /* see-through pictures stay white, not black */
      g.drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', max ? 0.85 : 0.7));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function randHex(){ return [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function sha(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function hexToBytes(h){ return Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16))); }
function bytesToHex(b){ return [...b].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function pbkdf2hex(pin, saltHex){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:hexToBytes(saltHex), iterations:200000, hash:'SHA-256' }, key, 256);
  return bytesToHex(new Uint8Array(bits));
}
async function deriveAes(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptBackup(json, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAes(pass, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(json));
  return JSON.stringify({ enc:1, salt:bytesToHex(salt), iv:bytesToHex(iv), data:bytesToHex(new Uint8Array(ct)) });
}
async function decryptBackup(obj, pass){
  const key = await deriveAes(pass, hexToBytes(obj.salt));
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:hexToBytes(obj.iv) }, key, hexToBytes(obj.data));
  return new TextDecoder().decode(pt);
}

async function unlock(){
  const wait = guardWait('pin');
  if(wait){ document.getElementById('pinErr').textContent = 'बहुत बार गलत PIN। ' + wait + ' सेकंड बाद फिर कोशिश करें / Too many tries, wait ' + wait + ' sec'; return; }
  const v = document.getElementById('pinIn').value.trim();
  const calc = db.settings.pinVer === 2 ? await pbkdf2hex(v, db.settings.pinSalt) : await sha(db.settings.pinSalt + v);
  if(calc === db.settings.pinHash){
    guardOk('pin');
    if(db.settings.pinVer !== 2){
      /* old, weaker PIN format: upgrade it to the stronger one */
      db.settings.pinSalt = randHex();
      db.settings.pinHash = await pbkdf2hex(v, db.settings.pinSalt);
      db.settings.pinVer = 2; save();
    }
    document.getElementById('lock').style.display = 'none';
    document.getElementById('pinIn').value = '';
    document.getElementById('pinErr').textContent = '';
  } else {
    guardFail('pin');
    document.getElementById('pinIn').value = '';
    document.getElementById('pinErr').textContent = t('pinWrong');
  }
}

      db.payments = db.payments.filter(p => !(p.auto && p.inv === old.no));

/* open a bill for changes by typing its number (INV-0007, inv-7 and 7 all find INV-0007) */
function openBillByNo(){
  const box = document.getElementById('billNoOpen'), q = (box.value || '').trim();
  if(!q){ toast(L('बिल नंबर लिखें', 'Type a bill number')); box.focus(); return; }
  const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
  const num = s => { const m = String(s).match(/(\d+)\s*$/); return m ? Number(m[1]) : null; };
  let inv = db.invoices.find(i => norm(i.no) === norm(q));
  if(!inv && num(q) !== null){
    const hits = db.invoices.filter(i => num(i.no) === num(q) && (!/[a-z]/i.test(q) || norm(i.no).replace(/[\d\W]/g, '') === norm(q).replace(/[\d\W]/g, '')));
    if(hits.length === 1) inv = hits[0];
    else if(hits.length > 1){ toast(L('इस नंबर के कई बिल हैं, पूरा नंबर लिखें', 'Several bills match, type the full number')); return; }
  }
  if(!inv){ toast(L('इस नंबर का कोई बिल नहीं मिला', 'No bill found with this number')); box.focus(); return; }
  editInv(inv.no);
  toast(L('बिल ' + inv.no + ' बदलने के लिए खुल गया', 'Bill ' + inv.no + ' opened for changes'));
}
function delInv(no){
  if(!confirm(t('confDel'))) return;
  const inv = db.invoices.find(i=>i.no===no);
  if(inv) inv.lines.forEach(l => { const it = l.iid && itemById(l.iid); if(it) it.stock = (Number(it.stock)||0) + l.q; });
  db.invoices = db.invoices.filter(i=>i.no!==no); save(); renderBillRows();
}

let camStream = null, camTimer = null;
async function openCamScan(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){ alert(t('camNo')); return; }
  try{ camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch(e){ alert(t('camNo')); return; }
  document.getElementById('modalBody').innerHTML = `<video id="cam" autoplay playsinline style="width:100%;border-radius:8px"></video>
    <p style="font-size:13px;color:#666">${t('camHelp')}</p><button class="gray" onclick="stopCam()">${t('close')}</button>`;
  document.getElementById('modal').style.display = 'block';
  const v = document.getElementById('cam');
  v.srcObject = camStream;
  const det = new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'] });
  camTimer = setInterval(async () => {
    try{
      const codes = await det.detect(v);
      if(codes.length){ const code = codes[0].rawValue; stopCam(); scanCode(code); }
    }catch(e){}
  }, 400);
}
function stopCam(){
  if(camTimer){ clearInterval(camTimer); camTimer = null; }
  if(camStream){ camStream.getTracks().forEach(x => x.stop()); camStream = null; }
  document.getElementById('modal').style.display = 'none';
}

function parseRows(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const c = l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.split(/\s{2,}/);
    return c.map(x => x.trim());
  }).filter(c => c[0] && !/^(name|नाम|item|सामान)$/i.test(c[0]));
}
function importText(){
  const rows = parseRows(document.getElementById('impText').value);
  let added = 0, updated = 0;
  rows.forEach((c, idx) => {
    const name = c[0], hsn = c[1] || '', gst = Number(c[2]) || 0;
    const unit = UNITS.includes((c[3]||'').toLowerCase()) ? c[3].toLowerCase() : 'pcs';
    const sale = Number(c[4]) || 0, buy = Number(c[5]) || 0, stock = Number(c[6]) || 0;
    const ex = db.items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if(ex){
      Object.assign(ex, { hsn, gst, unit, sale });
      if(buy) ex.buy = buy;
      if(c[6] !== undefined && c[6] !== '') ex.stock = stock;
      updated++;
    } else {
      db.items.push({ id:'I' + Date.now() + idx, name, photo:'', hsn, gst, unit, sale, buy, stock });
      added++;
    }
  });
  save();
  alert(t('importDone').replace('{a}', added).replace('{u}', updated));
  renderItems();
}
function importFile(input){
  const f = input.files[0]; if(!f) return;
  if(/\.(xlsx|xls)$/i.test(f.name)){
    if(typeof XLSX === 'undefined'){ alert(t('xlsxNoLib')); return; }
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(e.target.result, { type:'array' });
        const lines = [];
        wb.SheetNames.forEach(sn => {
          XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' }).forEach(row => {
            if(row.some(c => String(c).trim() !== ''))
              lines.push(row.map(c => String(c).replace(/[\t\r\n]+/g, ' ')).join('\t'));
          });
        });
        document.getElementById('impText').value = lines.join('\n');
        alert(t('xlsxLoaded').replace('{n}', lines.length));
      }catch(err){ alert(t('badXlsx')); }
    };
    r.readAsArrayBuffer(f);
  } else {
    const r = new FileReader();
    r.onload = e => { document.getElementById('impText').value = e.target.result; };
    r.readAsText(f);
  }
}

function savePurch(){
  const it = itemById(purchDraft.iid);
  if(!it){ alert(t('pickItem')); return; }
  const q = Number(purchDraft.q)||0, r = Number(purchDraft.r)||0;
  it.stock = (Number(it.stock)||0) + q;
  it.buy = r;
  db.purchases.push({ id:'P'+Date.now(), date:purchDraft.date, supplier:purchDraft.supplier.trim(), sid:upsertSupplier(purchDraft.supplier), iid:it.id, n:it.name, unit:it.unit, q, r });
  if(purchDraft.paid){
    const pr = db.purchases[db.purchases.length - 1];
    db.payments.push({ id:'A' + Date.now() + Math.floor(Math.random() * 1000), ty:'s', pid:pr.sid, amt:pr.q * pr.r,
      date:pr.date, mode:purchDraft.pmode || t('mCash'), note:t('purchLabel') + ' ' + pr.n, auto:true, inv:pr.id });
  }
  save(); alert(t('purchSaved'));
  purchDraft = { supplier:'Cash', date:new Date().toISOString().slice(0,10), iid:'', q:1, r:0 };
  renderPurch();
}

/* ---------- Ledger: parties, balances, payments ---------- */
function upsertSupplier(name){
  const n = (name || '').trim();
  if(!n) return null;
  let s = db.suppliers.find(x => x.name.toLowerCase() === n.toLowerCase());
  if(!s){ s = { id:'S' + Date.now(), name:n, phone:'', gstin:'', address:'' }; db.suppliers.push(s); }
  return s.id;
}
function partyBalance(ty, id){
  const ret = (db.notes || []).filter(n => n.ty === (ty === 'c' ? 'cn' : 'dn') && n.pid === id).reduce((a,n) => a + n.q * n.r, 0);
  if(ty === 'c'){
    const sale = db.invoices.filter(i => i.cid === id).reduce((a,i) => a + i.total, 0);
    const got = db.payments.filter(p => p.ty === 'c' && p.pid === id).reduce((a,p) => a + p.amt, 0);
    return sale - got - ret;
  }
  const buy = db.purchases.filter(p => p.sid === id).reduce((a,p) => a + p.q * p.r, 0);
  const paid = db.payments.filter(p => p.ty === 's' && p.pid === id).reduce((a,p) => a + p.amt, 0);
  return buy - paid - ret;
}
function partyName(ty, id){
  const p = ty === 'c' ? db.customers.find(x => x.id === id) : db.suppliers.find(x => x.id === id);
  return p ? p.name : '';
}
function validGSTIN(g){
  if(!g) return true;
  if(!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let sum = 0;
  for(let i = 0; i < 14; i++){
    const p = chars.indexOf(g[i]) * (i % 2 === 0 ? 1 : 2);
    sum += Math.floor(p / 36) + (p % 36);
  }
  return chars[(36 - (sum % 36)) % 36] === g[14];
}

  </div>` : `
  <div class="card summary">
    <div>${t('recvDue')}<b class="due">${money(recv)}</b></div>
    <div>${t('payDue')}<b class="low">${money(pay)}</b></div>

      <div><label>${t('selParty')}</label><select id="lpParty"><option value="">—</option>
        ${parties.map(p => `<option value="${p.key}">${p.ty === 'c' ? '👤' : '🏭'} ${esc(p.name)} (${money(p.bal)})</option>`).join('')}

    ${pend.length ? `<table>${pend.map(p => `<tr><td>${p.ty === 'c' ? '👤' : '🏭'} ${esc(p.name)}</td><td class="${p.ty === 'c' ? 'due' : 'low'}">${money(p.bal)}</td>

function addPayment(){
  const key = document.getElementById('lpParty').value;
  const amt = parseNum(document.getElementById('lpAmt').value);
  if(!key){ alert(t('pickParty')); return; }
  if(!(amt > 0)){ alert(t('badAmt')); return; }
  const [ty, pid] = key.split(':');
  db.payments.push({ id:'Y' + Date.now(), ty, pid, amt,
    date: document.getElementById('lpDate').value,
    mode: document.getElementById('lpMode').value,
    note: document.getElementById('lpNote').value.trim() });
  save(); renderLedger();
}
function editPayment(id){
  const p = db.payments.find(x => x.id === id);
  if(!p || p.auto) return;
  const ans = prompt(t('newAmt'), fmtIn(p.amt));
  if(ans === null) return;
  const v = parseNum(ans);
  if(!(v > 0)) return;
  p.amt = v; save(); renderLedger();
}
function delPayment(id){
  if(!confirm(t('confDel'))) return;
  const pm = db.payments.find(p => p.id === id);
  if(pm && pm.auto && pm.ty === 'c'){ const bill = db.invoices.find(i => i.no === pm.inv); if(bill) bill.paid = false; }
  db.payments = db.payments.filter(p => p.id !== id);
  save(); if(tab === 'rcpt') renderRcpt(); else renderLedger();
}

/* ---------- Cash book: every cash payment in or out, plus entries typed by hand ---------- */
function cashRows(){
  const rows = [];
  db.payments.filter(p => isCash(p.mode)).forEach(p => {
    const inflow = (p.ty === 'c') === (p.amt > 0);
    rows.push({ date:p.date, dir:inflow ? 'in' : 'out', amt:Math.abs(p.amt), who:partyName(p.ty, p.pid),
      note:p.rno || p.note || (p.auto ? (p.ty === 'c' ? t('billLabel') : t('purchLabel')) : ''), ts:p.id });
  });
  db.cashbook.forEach(c => rows.push({ date:c.date, dir:c.dir, amt:c.amt, who:'', note:c.note, id:c.id, ts:c.id }));
  const tnum = x => Number(String(x).replace(/\D/g, '').slice(0, 13)) || 0;
  return rows.sort((a, b) => (a.date || '').localeCompare(b.date || '') || tnum(a.ts) - tnum(b.ts));
}
let cashDir = 'out';
function renderCash(){
  const rows = cashRows();
  const inT = rows.filter(r => r.dir === 'in').reduce((a, r) => a + r.amt, 0), outT = rows.filter(r => r.dir === 'out').reduce((a, r) => a + r.amt, 0);
  const d0 = today(), tIn = rows.filter(r => r.date === d0 && r.dir === 'in').reduce((a, r) => a + r.amt, 0), tOut = rows.filter(r => r.date === d0 && r.dir === 'out').reduce((a, r) => a + r.amt, 0);
  const sum = `<div class="card summary">
    <div>${L('हाथ में कैश', 'Cash in hand')}<b class="${inT - outT < 0 ? 'due' : 'paid'}">${money(inT - outT)}</b></div>
    <div>${L('आज आया', 'In today')}<b class="paid">${money(tIn)}</b></div>
    <div>${L('आज गया', 'Out today')}<b class="due">${money(tOut)}</b></div></div>`;
  const v = document.getElementById('cashView');
  if(LIST.cash){
    let bal = 0;
    const lines = rows.map(r => { bal += r.dir === 'in' ? r.amt : -r.amt; return Object.assign({ bal }, r); }).reverse();
    v.innerHTML = sum + `<div class="card"><h3>📋 ${L('कैश बुक की सूची', 'Cash book list')}</h3>
      ${lines.length ? `<div style="overflow-x:auto"><table>
        <tr><th>${t('date')}</th><th>${t('desc')}</th><th>${L('आया', 'In')}</th><th>${L('गया', 'Out')}</th><th>${L('बाक़ी', 'Balance')}</th><th></th></tr>
        ${lines.map(r => `<tr class="line"><td>${fmtDate(r.date)}</td><td>${esc([r.who, r.note].filter(Boolean).join(' · '))}</td>
          <td class="paid">${r.dir === 'in' ? money(r.amt) : ''}</td><td class="due">${r.dir === 'out' ? money(r.amt) : ''}</td><td><b>${money(r.bal)}</b></td>
          <td>${r.id ? `<button class="red sm" onclick="delCash('${r.id}')">${t('del')}</button>` : ''}</td></tr>`).join('')}
      </table></div>` : `<p>${L('अभी कोई कैश एंट्री नहीं है।', 'No cash entries yet.')}</p>`}</div>`;
    return;
  }
  v.innerHTML = sum + `<div class="card">
    <h3>${L('कैश की एंट्री', 'Cash entry')}</h3>
    <p style="font-size:13px;color:#666;margin-top:0">${L('नकद वाली बिक्री, रसीद और भुगतान यहाँ अपने-आप जुड़ते हैं। ख़र्चे (किराया, बिजली, तनख़्वाह) या गल्ले में डाला पैसा यहाँ लिखें।', 'Cash sales, receipts and payments are added here automatically. Write expenses (rent, power, salary) or cash added here.')}</p>
    <div class="inout">
      <button class="${cashDir === 'in' ? 'green' : 'light'}" onclick="cashDir='in';renderCash()">⬇️ ${L('कैश आया', 'Cash in')}</button>
      <button class="${cashDir === 'out' ? 'red' : 'light'}" onclick="cashDir='out';renderCash()">⬆️ ${L('कैश गया / ख़र्चा', 'Cash out / expense')}</button>
    </div>
    <div class="grid2">
      <div><label>${t('payAmt')}</label><input id="ca_amt" type="text" inputmode="decimal" autocomplete="off" oninput="numIn(this)"></div>
      <div><label>${t('date')}</label><input id="ca_date" type="date" value="${d0}"></div>
      <div style="grid-column:1/-1"><label>${t('desc')}</label><input id="ca_note" placeholder="${cashDir === 'in' ? L('जैसे: शुरुआती कैश, गल्ले में डाला', 'e.g. opening cash, cash added') : L('जैसे: दुकान का किराया, बिजली बिल', 'e.g. shop rent, electricity bill')}"></div>
    </div>
    <button class="green" onclick="saveCash()">💾 ${L('एंट्री सेव करें', 'Save entry')}</button>
  </div>`;
}
function saveCash(){
  const amt = parseNum(document.getElementById('ca_amt').value);
  if(!(amt > 0)){ alert(t('badAmt')); return; }
  db.cashbook.push({ id:'K' + Date.now(), date:document.getElementById('ca_date').value || today(), dir:cashDir, amt, note:document.getElementById('ca_note').value.trim() });
  save(); toast(L('कैश एंट्री सेव हो गई', 'Cash entry saved')); renderCash();
}
function delCash(id){
  if(!confirm(t('confDel'))) return;
  db.cashbook = db.cashbook.filter(c => c.id !== id); save(); renderCash();
}

/* ---------- Credit note (customer returns goods) and debit note (we return goods to supplier) ---------- */
const noteDraft = { cn:{ pid:'', iid:'', q:1, r:0, date:'', reason:'', refund:false, mode:'' }, dn:{ pid:'', iid:'', q:1, r:0, date:'', reason:'', refund:false, mode:'' } };
function renderNote(ty){
  const v = document.getElementById(ty + 'View'), isCn = ty === 'cn', pty = isCn ? 'c' : 's', d = noteDraft[ty];
  if(LIST[ty]){
    const list = db.notes.filter(n => n.ty === ty).reverse();
    v.innerHTML = `<div class="card"><h3>📋 ${isCn ? L('क्रेडिट नोट की सूची', 'Credit notes list') : L('डेबिट नोट की सूची', 'Debit notes list')}</h3>
      ${list.length ? `<div style="overflow-x:auto"><table>
        <tr><th>${t('date')}</th><th>${L('नंबर', 'No.')}</th><th>${isCn ? L('ग्राहक', 'Customer') : L('सप्लायर', 'Supplier')}</th><th>${t('desc')}</th><th>${t('qty')}</th><th>${L('रक़म', 'Amount')}</th><th></th></tr>
        ${list.map(n => `<tr class="line"><td>${fmtDate(n.date)}</td><td>${esc(n.no)}</td><td>${esc(partyName(pty, n.pid) || n.pname)}</td>
          <td>${esc(n.n)}${n.reason ? `<br><small style="color:#6b7a90">${esc(n.reason)}</small>` : ''}</td><td>${fmtQty(n.q)} ${uLabel(n.unit)}</td><td>${money(n.q * n.r)}</td>
          <td><button class="red sm" onclick="delNote('${n.id}')">${t('del')}</button></td></tr>`).join('')}
      </table></div>` : `<p>${L('अभी कोई एंट्री नहीं है।', 'No entries yet.')}</p>`}</div>`;
    return;
  }
  const parties = isCn ? db.customers : db.suppliers;
  if(!parties.length || !db.items.length){ v.innerHTML = `<div class="card"><p>${isCn
    ? L('क्रेडिट नोट तब बनता है जब ग्राहक बिका हुआ सामान वापस करे। पहले कोई ग्राहक और सामान होना चाहिए।', 'A credit note is made when a customer returns goods. You need a customer and an item first.')
    : L('डेबिट नोट तब बनता है जब आप सप्लायर को सामान वापस करें। पहले कोई ख़रीद (सप्लायर) और सामान होना चाहिए।', 'A debit note is made when you return goods to a supplier. You need a purchase (supplier) and an item first.')}</p></div>`; return; }
  const next = (isCn ? 'CN-' : 'DN-') + String(db.settings[isCn ? 'nextCn' : 'nextDn']).padStart(4, '0');
  v.innerHTML = `<div class="card">
    <h3>${isCn ? L('ग्राहक ने सामान वापस किया (बिक्री वापसी)', 'Customer returned goods (sale return)') : L('सप्लायर को सामान वापस किया (ख़रीद वापसी)', 'Goods returned to supplier (purchase return)')}</h3>
    <div class="grid2">
      <div><label>${L('नंबर', 'Number')}</label><input value="${next}" disabled></div>
      <div><label>${t('date')}</label><input type="date" value="${d.date || today()}" oninput="noteDraft.${ty}.date=this.value"></div>
      <div style="grid-column:1/-1"><label>${isCn ? L('ग्राहक', 'Customer') : L('सप्लायर', 'Supplier')}</label>
        <select onchange="noteDraft.${ty}.pid=this.value">${partyOpts(pty).replace(`value="${d.pid}"`, `value="${d.pid}" selected`)}</select></div>
      <div style="grid-column:1/-1"><label>${t('desc')}</label><select onchange="noteDraft.${ty}.iid=this.value;noteDraft.${ty}.r=(itemById(this.value)||{}).${isCn ? 'sale' : 'buy'}||0;renderNote('${ty}')">
        <option value="">—</option>${db.items.map(i => `<option value="${i.id}" ${i.id === d.iid ? 'selected' : ''}>${esc(i.name)} (${t('stock')}: ${fmtQty(i.stock)})</option>`).join('')}</select></div>
      <div><label>${t('qty')}</label>${amtBox(d.q, `noteDraft.${ty}.q=numIn(this);document.getElementById('nt_tot').value=money(noteDraft.${ty}.q*noteDraft.${ty}.r)`)}</div>
      <div><label>${t('rate')}</label>${amtBox(d.r, `noteDraft.${ty}.r=numIn(this);document.getElementById('nt_tot').value=money(noteDraft.${ty}.q*noteDraft.${ty}.r)`)}</div>
      <div><label>${L('कुल रक़म', 'Total amount')}</label><input id="nt_tot" value="${money((Number(d.q)||0) * (Number(d.r)||0))}" disabled></div>
      <div><label>${L('कारण', 'Reason')}</label><input value="${esc(d.reason)}" placeholder="${L('जैसे: टूटा हुआ, ख़राब, ग़लत सामान', 'e.g. damaged, wrong item')}" oninput="noteDraft.${ty}.reason=this.value"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" style="width:auto" ${d.refund ? 'checked' : ''} onchange="noteDraft.${ty}.refund=this.checked;renderNote('${ty}')">
      ${isCn ? L('ग्राहक को पैसा अभी लौटा दिया', 'Money refunded to customer now') : L('सप्लायर से पैसा अभी वापस मिल गया', 'Money received back from supplier now')}</label>
    ${d.refund ? `<select onchange="noteDraft.${ty}.mode=this.value">${modeOpts(d.mode || t('mCash'))}</select>` : `<p style="font-size:13px;color:#666">${isCn ? L('पैसा नहीं लौटाया तो यह रक़म ग्राहक के बाक़ी में से घट जाएगी।', 'If not refunded, this amount is reduced from the customer’s balance.') : L('पैसा वापस नहीं मिला तो यह रक़म सप्लायर को देने वाले बाक़ी में से घट जाएगी।', 'If not refunded, this amount is reduced from what you owe the supplier.')}</p>`}
    <button class="green" onclick="saveNote('${ty}')">💾 ${L('सेव करें', 'Save')}</button>
    <p style="font-size:12.5px;color:#6b7a90">${isCn ? L('सेव करने पर सामान स्टॉक में वापस जुड़ जाएगा।', 'On save, the items go back into stock.') : L('सेव करने पर सामान स्टॉक से घट जाएगा।', 'On save, the items are removed from stock.')}</p>
  </div>`;
}
function saveNote(ty){
  const d = noteDraft[ty], isCn = ty === 'cn', it = itemById(d.iid), q = Number(d.q) || 0, r = Number(d.r) || 0;
  if(!d.pid){ alert(t('pickParty')); return; }
  if(!it){ alert(t('pickItem')); return; }
  if(!(q > 0) || !(r >= 0)){ alert(t('badAmt')); return; }
  const k = isCn ? 'nextCn' : 'nextDn';
  const n = { id:'N' + Date.now(), ty, no:(isCn ? 'CN-' : 'DN-') + String(db.settings[k]).padStart(4, '0'), date:d.date || today(), pid:d.pid,
    pname:partyName(isCn ? 'c' : 's', d.pid), iid:it.id, n:it.name, unit:it.unit, q, r, reason:(d.reason || '').trim(), ts:Date.now() };
  db.notes.push(n); db.settings[k]++;
  it.stock = (Number(it.stock) || 0) + (isCn ? q : -q);
  if(d.refund && q * r > 0) db.payments.push({ id:'Y' + Date.now(), ty:isCn ? 'c' : 's', pid:d.pid, amt:-(q * r), date:n.date,
    mode:d.mode || t('mCash'), note:n.no, note2:n.id });
  noteDraft[ty] = { pid:'', iid:'', q:1, r:0, date:'', reason:'', refund:false, mode:'' };
  save(); toast(n.no + ' ' + L('सेव हो गया', 'saved')); renderNote(ty);
}
function delNote(id){
  const n = db.notes.find(x => x.id === id); if(!n || !confirm(t('confDel'))) return;
  const it = itemById(n.iid); if(it) it.stock = (Number(it.stock) || 0) - (n.ty === 'cn' ? n.q : -n.q);
  db.notes = db.notes.filter(x => x.id !== id);
  db.payments = db.payments.filter(p => p.note2 !== id);
  save(); renderNote(n.ty);
}

/* ---------- Customers and history ---------- */
function custBills(cid){ return db.invoices.filter(i => i.cid === cid); }
function renderCustomers(){
  if(selCid){ renderCustDetail(); return; }
  document.getElementById('custView').innerHTML = `
  <div class="card">
    <h3>${t('allCust')}</h3>
    <input id="custSearch" placeholder="${t('search')}" oninput="renderCustRows()">
    <div id="custRows" style="margin-top:10px"></div>
  </div>`;
  renderCustRows();
}
function renderCustRows(){
  const el = document.getElementById('custRows'); if(!el) return;
  const q = document.getElementById('custSearch').value.trim().toLowerCase();
  const d = digits(q);
  const list = db.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (d && digits(c.phone).includes(d)));
  if(!list.length){ el.innerHTML = `<p>${t('noCust')}</p>`; return; }
  el.innerHTML = `<table>${list.map(c => {
    const bills = custBills(c.id);
    const due = bills.filter(i=>!i.paid).reduce((a,i)=>a+i.total,0);
    return `<tr class="cust-row" onclick="openCust('${c.id}')">
      <td><b>${esc(c.name)}</b><br><small>${esc(c.phone)}</small></td>
      <td>${bills.length} ${t('bills')}</td>
      <td>${money(bills.reduce((a,i)=>a+i.total,0))}<br><small class="due">${money(due)}</small></td>
      <td><button class="pdfBtn sm" onclick="event.stopPropagation();openStatement('c','${c.id}')">📄 PDF</button></td></tr>`;
  }).join('')}</table>`;
}
function openCust(id){ selCid = id; renderCustomers(); }
function closeCust(){ selCid = null; renderCustomers(); }
function renderCustDetail(){
  const c = db.customers.find(x => x.id === selCid);
  if(!c){ selCid = null; renderCustomers(); return; }
  const bills = custBills(c.id).slice().reverse();
  const billed = bills.reduce((a,i)=>a+i.total,0);
  const due = bills.filter(i=>!i.paid).reduce((a,i)=>a+i.total,0);
  const cf = db.settings.cfields.map(f => `<div><label>${esc(f)}</label><input id="e_x_${esc(f)}" value="${esc((c.extra||{})[f]||'')}"></div>`).join('');
  document.getElementById('custView').innerHTML = `
  <div class="card"><button class="light sm" onclick="closeCust()">← ${t('back')}</button></div>
  <div class="card">
    <h3>${esc(c.name)} · ${esc(c.phone)}</h3>
    <div class="summary" style="margin-bottom:12px">
      <div>${t('bills')}<b>${bills.length}</b></div>
      <div>${t('billed')}<b>${money(billed)}</b></div>
      <div>${t('openDue')}<b class="due">${money(due)}</b></div>
    </div>
    <div class="grid2">
      <div><label>${t('cname')}</label><input id="e_n" value="${esc(c.name)}"></div>
      <div><label>${t('phone')}</label><input id="e_p" value="${esc(c.phone)}"></div>
      <div><label>${t('gstin')}</label><input id="e_g" value="${esc(c.gstin||'')}"></div>
      <div><label>${t('email')}</label><input id="e_e" value="${esc(c.email||'')}"></div>
      <div style="grid-column:1/-1"><label>${t('address')}</label><input id="e_a" value="${esc(c.address||'')}"></div>
      ${cf}
    </div>
    <button class="green" onclick="saveCustEdit()">${t('edit')}</button>
    <button onclick="newBillFor('${c.id}')">${t('newFor')}</button>
    <button class="pdfBtn" onclick="openStatement('c','${c.id}')">📄 ${L('PDF स्टेटमेंट / शेयर', 'PDF statement / share')}</button>
  </div>
  <div class="card">
    <h3>${t('history')}</h3>
    ${bills.length ? `<div style="overflow-x:auto"><table>${bills.map(i => `<tr>
      <td>${i.no}</td><td>${fmtDate(i.cd)}${i.ts ? `<br><small style="color:#6b7a90">${fmtTime(i.ts)}</small>` : ''}</td><td>${money(i.total)}</td>
      <td class="${i.paid?'paid':'due'}">${i.paid?t('paid'):t('unpaid')}</td>
      <td><button class="light sm" onclick="openPreviewNo('${i.no}')">${t('prev')}</button>
          <button class="light sm" onclick="togglePaid('${i.no}');renderCustDetail()">${i.paid?t('markDue'):t('markPaid')}</button></td>
    </tr>`).join('')}</table></div>` : `<p>${t('empty')}</p>`}
  </div>`;
}
function saveCustEdit(){
  const c = db.customers.find(x => x.id === selCid); if(!c) return;
  c.name = document.getElementById('e_n').value.trim();
  c.phone = document.getElementById('e_p').value.trim();
  c.gstin = document.getElementById('e_g').value.trim();
  c.email = document.getElementById('e_e').value.trim();
  c.address = document.getElementById('e_a').value.trim();
  c.extra = c.extra || {};
  db.settings.cfields.forEach(f => { const el = document.getElementById('e_x_'+f); if(el) c.extra[f] = el.value.trim(); });
  save(); alert(t('custSaved')); renderCustDetail();
}
function newBillFor(id){
  const c = db.customers.find(x => x.id === id); if(!c) return;
  cur = blankInv(); selCid = null;
  cur.cid = c.id; cur.cn = c.name; cur.cp = c.phone || '';
  cur.cgstin = c.gstin || ''; cur.cemail = c.email || ''; cur.caddr = c.address || '';
  cur.cextra = Object.assign({}, c.extra || {});
  showTab('new');
}

}
async function exportData(){

  const a = document.createElement('a');

function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async e => {
    try{
      let obj = JSON.parse(e.target.result);
      if(obj.enc){
        const pass = prompt(t('askRestorePass'));
        if(!pass) return;
        obj = JSON.parse(await decryptBackup(obj, pass));
      }
      if(!obj.settings || !Array.isArray(obj.invoices)) throw new Error();
      db = normalize(obj); save(); applyLang(); alert(t('restored')); showTab('list');
    }catch(err){ alert(t('badFile')); }
  };
  r.readAsText(f);
}

function startZip(){
  let noZip = false; try{ noZip = sessionStorage.getItem('be_nozip') === '1'; sessionStorage.removeItem('be_nozip'); }catch(e){}
  if(noZip || !db.settings.zipOn || document.getElementById('zip')) return;
  const z = document.createElement('div');
  z.id = 'zip'; z.tabIndex = 0; z.setAttribute('role', 'button');
  z.setAttribute('aria-label', L('ऐप खोलने के लिए ज़िप नीचे खींचें', 'Pull the zip down to open the app'));
  const cv = document.createElement('canvas');
  const hint = document.createElement('div'); hint.className = 'zhint';
  hint.textContent = L('⬇  ज़िप नीचे खींचकर खोलें', '⬇  Pull the zip down to open');
  z.appendChild(cv); z.appendChild(hint); document.body.appendChild(z);
  document.body.style.overflow = 'hidden';
  const ctx = cv.getContext('2d');
  let base = null, tickTimer = 0;
  let W, H, cx, dpr, fab, Y0, Y, targetY = 0, dragging = false, startPY = 0, startY = 0, opening = false, spread = 1, raf = 0, t0 = performance.now();
  const TOOTH = 16;

    try{
      if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
      if(actx.state === 'suspended') actx.resume();
    }catch(e){}
  }
  function tooth(){
    if(!actx || actx.state !== 'running') return;
    try{
      const tt = actx.currentTime, o = actx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(620, tt); o.frequency.exponentialRampToValueAtTime(300, tt + .03);
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      const g = actx.createGain(); g.gain.setValueAtTime(.07, tt); g.gain.exponentialRampToValueAtTime(.0008, tt + .03);
      o.connect(lp); lp.connect(g); g.connect(actx.destination); o.start(tt); o.stop(tt + .05);
    }catch(e){}
  }
  function zipSound(){
    if(Y > H) { lastTooth = null; return; }
    const tt = Math.floor(Y / TOOTH);
    if(lastTooth !== null && tt !== lastTooth){
      const n = Math.min(3, Math.abs(tt - lastTooth));
      for(let i = 0; i < n; i++) setTimeout(tooth, i * 14);
    }
    lastTooth = tt;
  }

  function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function build(){
    dpr = Math.min(2, window.devicePixelRatio || 1); W = Math.max(320, window.innerWidth || 0); H = Math.max(480, window.innerHeight || 0); cx = Math.round(W / 2);
    Y0 = Math.max(54, Math.round(H * 0.08)); if(!dragging && !opening) Y = Y0;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    base = document.createElement('canvas'); base.width = W * dpr; base.height = H * dpr;
    fab = document.createElement('canvas'); fab.width = W * dpr; fab.height = H * dpr;
    const f = base.getContext('2d'); f.setTransform(dpr, 0, 0, dpr, 0, 0);
    const wg = 46, ws = Math.max(90, Math.min(cx - wg - 12, 165));
    widget = { s:ws, ch:Math.round(ws * 1.2), top:Math.max(14, Y0 - 30), lx:cx - wg - ws, rx:cx + wg };
    const g = f.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2f7ae0'); g.addColorStop(.5, '#1f5fbf'); g.addColorStop(1, '#0f3a82');
    f.fillStyle = g; f.fillRect(0, 0, W, H);
    const glow = f.createRadialGradient(W * .3, H * .25, 10, W * .3, H * .25, Math.max(W, H) * .7);
    glow.addColorStop(0, 'rgba(255,255,255,.16)'); glow.addColorStop(1, 'rgba(255,255,255,0)'); f.fillStyle = glow; f.fillRect(0, 0, W, H);

    f.fillStyle = '#fff'; f.font = `800 ${Math.min(46, W * .11)}px system-ui, "Segoe UI", sans-serif`; f.textBaseline = 'alphabetic';
    f.shadowColor = 'rgba(0,0,0,.25)'; f.shadowBlur = 10; f.fillText('BillEasy', cx, ly + 98);

  /* ---------- Cover: colour waves + shop name card + calendar (with Hindu tithi) + live clock ---------- */
  const HF = '"Nirmala UI", system-ui, sans-serif';
  function glass(f, x, y, w, h){
    f.save(); f.shadowColor = 'rgba(0,0,0,.18)'; f.shadowBlur = 14; f.shadowOffsetY = 5;
    f.fillStyle = 'rgba(255,255,255,.14)'; rr(f, x, y, w, h, 16); f.fill(); f.restore();
    f.strokeStyle = 'rgba(255,255,255,.35)'; f.lineWidth = 1.2; rr(f, x, y, w, h, 16); f.stroke();
  }
  function wrapText(f, text, x, y, maxW, lh){
    const words = String(text).split(' '); let line = '', yy = y;
    words.forEach(w => { const t = line ? line + ' ' + w : w; if(f.measureText(t).width > maxW && line){ f.fillText(line, x, yy); line = w; yy += lh; } else line = t; });
    if(line) f.fillText(line, x, yy); return yy;
  }
  function coverBg(f){
    const cols = ['#f472b6', '#facc15', '#34d399', '#a78bfa', '#38bdf8', '#fb923c'];
    f.save();
    for(let i = 0; i < 14; i++){
      const x = (i * 97) % W, y = (i * 151) % H, r = 40 + (i * 23) % 90;
      const g = f.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, cols[i % cols.length] + '88'); g.addColorStop(1, cols[i % cols.length] + '00');
      f.fillStyle = g; f.beginPath(); f.arc(x, y, r, 0, Math.PI * 2); f.fill();
    }
    for(let b = 0; b < 4; b++){
      f.globalAlpha = .16; f.fillStyle = cols[b + 1]; f.beginPath();
      const base = H * (.62 + b * .09); f.moveTo(0, base);
      for(let x = 0; x <= W; x += 10) f.lineTo(x, base + Math.sin(x / 50 + b) * 18);
      f.lineTo(W, base + 40); f.lineTo(0, base + 40); f.closePath(); f.fill();
    }
    f.restore();
  }
  function coverFg(f, top){
    const name = db.settings.name || L('आपकी दुकान', 'Your shop');
    const y = top + 18, w = Math.min(W - 32, 560), x = cx - w / 2, h = 150;

    f.fillStyle = '#fff'; f.font = `800 ${Math.min(32, W * .08)}px ${HF}`; wrapText(f, name, cx, y + 76, w - 40, 36);
    f.globalAlpha = .85; f.font = `500 ${Math.min(14, W * .037)}px ${HF}`;
