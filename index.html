<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillEasy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5fbf">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5fb;margin:0;color:#1d2433}
header{background:linear-gradient(135deg,#1f5fbf,#3a8ee6);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;opacity:.85}
select{padding:6px;border-radius:6px;border:1px solid #cfd7e6;font-size:14px;background:#fff}
header select{border:0}
.wrap{max-width:900px;margin:auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
h3{margin:0 0 8px;color:#1f5fbf}
label{display:block;margin:10px 0 4px;font-size:14px;color:#444}
input{width:100%;padding:9px;border:1px solid #cfd7e6;border-radius:8px;font-size:15px;background:#fff}
button{background:#1f5fbf;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
button.green{background:#2e8b57}
button.wa{background:#25d366}
button.red{background:#c0392b}
button.gray{background:#6b7280}
button.light{background:#e3ebf7;color:#1d2433}
button.on{background:#1f5fbf;color:#fff}
button.sm{padding:6px 9px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #eef1f6;padding:7px 5px;text-align:left;vertical-align:middle}
.tot{font-size:18px;font-weight:bold;text-align:right;margin-top:12px;line-height:1.7}
.paid{color:#2e8b57;font-weight:bold}
.due{color:#c0392b;font-weight:bold}
.low{color:#c0392b;font-weight:bold}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary div{flex:1;min-width:130px;background:#f5f8fd;padding:12px;border-radius:10px;text-align:center;font-size:14px}
.summary b{display:block;font-size:19px;margin-top:4px}
.sugg{background:#fff;border:1px solid #cfd7e6;border-radius:8px;margin-top:4px;max-height:220px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #eef1f6;display:flex;gap:8px;align-items:center}
.sugg div:hover{background:#eef4fc}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#eef1f6;border:1px solid #ddd}
.ph{width:42px;height:42px;border-radius:6px;background:#eef1f6;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.cust-row{cursor:pointer}
.cust-row:hover{background:#f5f8fd}
.line td input{padding:6px}
.view{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;overflow:auto;padding:20px}
#modal .box{background:#fff;max-width:760px;margin:auto;border-radius:12px;padding:16px}
#print{display:none}
.bill{font-size:14px}
.qr{width:140px;height:140px;border:1px solid #eee;border-radius:8px}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px}
}
.bill{font-family:var(--bfont,system-ui,sans-serif)}
.bill .title{font-size:20px;font-weight:bold;color:var(--bcolor,#1f5fbf);text-align:var(--balign,left);margin-bottom:4px}
.bill h2{color:var(--bcolor,#1f5fbf)!important;text-align:var(--balign,left)}
.bill .tot{text-align:right}
.tpl-classic table td,.tpl-classic table th{border:1px solid #999;padding:6px}
.tpl-classic table th{background:#f0f0f0}
.tpl-modern table th{background:var(--bcolor,#1f5fbf);color:#fff;border:none;padding:8px}
.tpl-modern table td{border-bottom:1px solid #eee;padding:7px}
.tpl-modern .tot b{color:var(--bcolor,#1f5fbf)}
.tpl-minimal table td,.tpl-minimal table th{border:none;border-bottom:1px solid #ddd;padding:6px}
.tpl-minimal table th{color:var(--bcolor,#1f5fbf)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <rect width="44" height="44" rx="12" fill="#fff"/>
      <path d="M12 8h20v28l-3-2-3 2-3-2-3 2-3-2-3 2z" fill="#1f5fbf"/>
      <path d="M16 15h12M16 20h12M16 25h7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="33" cy="33" r="7" fill="#2e8b57"/>
      <text x="33" y="37" font-size="10" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">₹</text>
    </svg>
    <div><b>BillEasy</b><small id="tagline"></small></div>
  </div>
  <select id="langSel" onchange="setLang(this.value)"></select>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="t-new" onclick="showTab('new')"></button>
    <button id="t-list" class="light" onclick="showTab('list')"></button>
    <button id="t-items" class="light" onclick="showTab('items')"></button>
    <button id="t-purch" class="light" onclick="showTab('purch')"></button>
    <button id="t-cust" class="light" onclick="showTab('cust')"></button>
    <button id="t-settings" class="light" onclick="showTab('settings')"></button>
  </div>
  <div id="newView" class="view"></div>
  <div id="listView" class="view"></div>
  <div id="itemsView" class="view"></div>
  <div id="purchView" class="view"></div>
  <div id="custView" class="view"></div>
  <div id="settingsView" class="view"></div>
</div>

<div id="lock" style="display:none;position:fixed;inset:0;background:#1f5fbf;z-index:20;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:10px">
  <h2 style="margin:0">BillEasy</h2>
  <div>PIN दर्ज करें / Enter PIN</div>
  <input id="pinIn" type="password" inputmode="numeric" style="width:200px;text-align:center;font-size:22px;padding:8px;border-radius:8px;border:0" onkeydown="if(event.key==='Enter')unlock()">
  <button class="green" onclick="unlock()">खोलें / Open</button>
  <div id="pinErr" style="color:#ffd3d3"></div>
</div>
<div id="modal"><div class="box"><div id="modalBody"></div></div></div>
<div id="print"></div>

  });

}

/* ---------- Automatic backup to a chosen folder ---------- */
let backupDir = null;
let lastBackup = '';
function idbOp(mode, fn){
  return new Promise((res, rej) => {
    const req = indexedDB.open('billeasy-cfg', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', mode);
      const r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(r.result);
      tx.onerror = () => rej(tx.error);
    };
    req.onerror = () => rej(req.error);
  });
}
async function restoreBackupHandle(){
  try{ backupDir = (await idbOp('readonly', st => st.get('dir'))) || null; }catch(e){ backupDir = null; }
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ alert(t('backupNotSupported')); return; }
  try{
    backupDir = await window.showDirectoryPicker({ mode:'readwrite' });
    await idbOp('readwrite', st => st.put(backupDir, 'dir'));
    await writeBackup();
    alert(t('backupSet'));
    renderSettings();
  }catch(e){ /* user cancelled */ }
}
async function grantBackup(){
  if(!backupDir) return;
  if((await backupDir.requestPermission({ mode:'readwrite' })) === 'granted'){ await writeBackup(); renderSettings(); }
}
async function writeBackup(){
  if(!backupDir || db.settings.backupMode !== 'auto') return;
  try{
    if((await backupDir.queryPermission({ mode:'readwrite' })) !== 'granted') return;
    const fh = await backupDir.getFileHandle('billeasy-backup.json', { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(db, null, 2));
    await w.close();
    lastBackup = new Date().toLocaleString();
  }catch(e){ /* keep working even if backup fails */ }
}
function autoBackup(){ writeBackup(); }
function setBackupMode(m){
  db.settings.backupMode = m;
  save();
  renderSettings();
  if(m === 'auto' && !backupDir) pickBackupFolder();
}
function digits(s){ return String(s||'').replace(/\D/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return '₹' + Number(n||0).toFixed(2); }
function uLabel(u){ return t('u_' + u) || u; }
function unitSelect(sel, onchange){
  return `<select onchange="${onchange}">${UNITS.map(u => `<option value="${u}" ${u===sel?'selected':''}>${uLabel(u)}</option>`).join('')}</select>`;
}
function blankInv(){
  return { cid:null, cn:'', cp:'', cgstin:'', cemail:'', caddr:'', cextra:{}, cd:new Date().toISOString().slice(0,10), lines:[] };

function blankItem(){
  return { id:null, name:'', photo:'', hsn:'', gst:db.settings.gst||0, unit:'pcs', sale:0, buy:0, stock:0, bc:'', minQty:0, stockDate:'' };

function totals(inv){
  let sub = 0, gstAmt = 0;
  (inv.lines||[]).forEach(l => {
    const amt = (Number(l.q)||0) * (Number(l.r)||0);
    sub += amt; gstAmt += amt * (Number(l.gst)||0) / 100;
  });
  return { sub, gstAmt, total: sub + gstAmt };
}
function itemById(id){ return db.items.find(i => i.id === id); }
function qrUrl(amount){
  if(!db.settings.upi) return '';
  let link = 'upi://pay?pa=' + encodeURIComponent(db.settings.upi) + '&pn=' + encodeURIComponent(db.settings.name || 'BillEasy') + '&cu=INR';
  if(amount) link += '&am=' + Number(amount).toFixed(2);
  return 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link);
}
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 160 / Math.max(img.width, img.height, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * Math.min(m,1)); c.height = Math.round(img.height * Math.min(m,1));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function findByPhone(p){ const d = digits(p); return d ? db.customers.find(c => digits(c.phone) === d) : null; }
function custMatches(q){
  const s = q.trim().toLowerCase(), d = digits(q);
  if(!s) return [];
  return db.customers.filter(c => c.name.toLowerCase().includes(s) || (d && digits(c.phone).includes(d))).slice(0,5);
}
function updateCustSugg(){
  const box = document.getElementById('custSugg'); if(!box) return;
  const list = custMatches(cur.cn || cur.cp);
  box.innerHTML = list.map(c => `<div onclick="pickCustomer('${c.id}')"><b>${esc(c.name)}</b> ${esc(c.phone)}</div>`).join('');
}
function pickCustomer(id){
  const c = db.customers.find(x => x.id === id); if(!c) return;
  cur.cid = c.id; cur.cn = c.name; cur.cp = c.phone || '';
  cur.cgstin = c.gstin || ''; cur.cemail = c.email || ''; cur.caddr = c.address || '';
  cur.cextra = Object.assign({}, c.extra || {});
  renderNew();
}
function phoneChanged(v){
  cur.cp = v;
  const c = findByPhone(v);
  if(c) pickCustomer(c.id); else { cur.cid = null; updateCustSugg(); }
}
function customerFields(src){
  const extra = db.settings.cfields.map(f => `
    <div><label>${esc(f)}</label><input value="${esc((src.cextra||{})[f]||'')}" oninput="cur.cextra['${esc(f)}']=this.value"></div>`).join('');
  return `<div class="grid2">
    <div><label>${t('gstin')}</label><input value="${esc(src.cgstin)}" oninput="cur.cgstin=this.value"></div>
    <div><label>${t('email')}</label><input value="${esc(src.cemail)}" oninput="cur.cemail=this.value"></div>
    <div style="grid-column:1/-1"><label>${t('address')}</label><input value="${esc(src.caddr)}" oninput="cur.caddr=this.value"></div>
    ${extra}</div>`;
}

function calc(){
  cur.lines.forEach((l, i) => {
    const a = (Number(l.q)||0) * (Number(l.r)||0);
    const g = a * (Number(l.gst)||0) / 100;
    const set = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = money(v); };
    set('amt' + i, a); set('gamt' + i, g); set('lt' + i, a + g);
  });
  const el = document.getElementById('tot'); if(!el) return;
  const x = totals(cur);
  el.innerHTML = `${t('sub')}: ${money(x.sub)}<br>GST: ${money(x.gstAmt)}<br>${t('total')}: ${money(x.total)}`;
}

function randHex(){ return [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function sha(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function showLockIfNeeded(){
  if(db.settings.pinOn && db.settings.pinHash){
    document.getElementById('lock').style.display = 'flex';
    document.getElementById('pinIn').focus();
  }
}
async function unlock(){
  const v = document.getElementById('pinIn').value.trim();
  if((await sha(db.settings.pinSalt + v)) === db.settings.pinHash){
    document.getElementById('lock').style.display = 'none';
    document.getElementById('pinIn').value = '';
    document.getElementById('pinErr').textContent = '';
  } else {
    document.getElementById('pinErr').textContent = t('pinWrong');
  }
}
function buildInv(cid){

    q:Number(l.q)||0, r:Number(l.r)||0, gst:Number(l.gst)||0 }));
  const inv = { no: billNumber(), cid,
    cn:cur.cn.trim(), cp:cur.cp.trim(), cgstin:cur.cgstin.trim(), cemail:cur.cemail.trim(),
    caddr:cur.caddr.trim(), cextra:Object.assign({}, cur.cextra), cd:cur.cd, lines, paid:false };
  inv.total = totals(inv).total;

function validCur(){

  if(!cur.lines.some(l => l.n.trim())){ alert(t('needLine')); return false; }
  return true;

let camStream = null, camTimer = null;
async function openCamScan(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){ alert(t('camNo')); return; }
  try{ camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch(e){ alert(t('camNo')); return; }
  document.getElementById('modalBody').innerHTML = `<video id="cam" autoplay playsinline style="width:100%;border-radius:8px"></video>
    <p style="font-size:13px;color:#666">${t('camHelp')}</p><button class="gray" onclick="stopCam()">${t('close')}</button>`;
  document.getElementById('modal').style.display = 'block';
  const v = document.getElementById('cam');
  v.srcObject = camStream;
  const det = new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'] });
  camTimer = setInterval(async () => {
    try{
      const codes = await det.detect(v);
      if(codes.length){ const code = codes[0].rawValue; stopCam(); scanCode(code); }
    }catch(e){}
  }, 400);
}
function stopCam(){
  if(camTimer){ clearInterval(camTimer); camTimer = null; }
  if(camStream){ camStream.getTracks().forEach(x => x.stop()); camStream = null; }
  document.getElementById('modal').style.display = 'none';
}

function parseRows(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const c = l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.split(/\s{2,}/);
    return c.map(x => x.trim());
  }).filter(c => c[0] && !/^(name|नाम|item|सामान)$/i.test(c[0]));
}
function importText(){
  const rows = parseRows(document.getElementById('impText').value);
  let added = 0, updated = 0;
  rows.forEach((c, idx) => {
    const name = c[0], hsn = c[1] || '', gst = Number(c[2]) || 0;
    const unit = UNITS.includes((c[3]||'').toLowerCase()) ? c[3].toLowerCase() : 'pcs';
    const sale = Number(c[4]) || 0, buy = Number(c[5]) || 0, stock = Number(c[6]) || 0;
    const ex = db.items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if(ex){
      Object.assign(ex, { hsn, gst, unit, sale });
      if(buy) ex.buy = buy;
      if(c[6] !== undefined && c[6] !== '') ex.stock = stock;
      updated++;
    } else {
      db.items.push({ id:'I' + Date.now() + idx, name, photo:'', hsn, gst, unit, sale, buy, stock });
      added++;
    }
  });
  save();
  alert(t('importDone').replace('{a}', added).replace('{u}', updated));
  renderItems();
}
function importFile(input){
  const f = input.files[0]; if(!f) return;
  if(/\.(xlsx|xls)$/i.test(f.name)){
    if(typeof XLSX === 'undefined'){ alert(t('xlsxNoLib')); return; }
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(e.target.result, { type:'array' });
        const lines = [];
        wb.SheetNames.forEach(sn => {
          XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' }).forEach(row => {
            if(row.some(c => String(c).trim() !== ''))
              lines.push(row.map(c => String(c).replace(/[\t\r\n]+/g, ' ')).join('\t'));
          });
        });
        document.getElementById('impText').value = lines.join('\n');
        alert(t('xlsxLoaded').replace('{n}', lines.length));
      }catch(err){ alert(t('badXlsx')); }
    };
    r.readAsArrayBuffer(f);
  } else {
    const r = new FileReader();
    r.onload = e => { document.getElementById('impText').value = e.target.result; };
    r.readAsText(f);
  }
}

}

async function saveSettings(){
  const s = db.settings;
  s.name = document.getElementById('sn').value.trim();
  s.phone = document.getElementById('sp').value.trim();
  s.gstin = document.getElementById('sgi').value.trim();
  s.upi = document.getElementById('su').value.trim();
  s.addr = document.getElementById('sa').value.trim();
  s.gst = Number(document.getElementById('sg').value) || 0;
  s.cfields = document.getElementById('scf').value.split(',').map(x=>x.trim()).filter(Boolean);
  s.city = document.getElementById('sc_city').value.trim();
  s.bank = {
    holder: document.getElementById('bn_holder').value.trim(),
    name: document.getElementById('bn_name').value.trim(),
    acc: document.getElementById('bn_acc').value.trim(),
    ifsc: document.getElementById('bn_ifsc').value.trim()
  };
  SHOW_KEYS.forEach(k => { s.show[k] = document.getElementById('sh_' + k).checked; });
  s.billNoMode = document.getElementById('bnm').value;
  s.billPrefix = document.getElementById('bpf').value;
  s.next = Math.max(1, Number(document.getElementById('bnx').value) || s.next);
  s.entryMode = document.getElementById('entm').value;
  s.paper = document.getElementById('paper').value;
  s.terms = document.getElementById('termsTxt').value.trim();
  s.footer = document.getElementById('footerTxt').value.trim();
  s.pinOn = document.getElementById('pin_on').checked;
  const newPin = document.getElementById('pin_new').value.trim();
  if(!s.pinOn){ s.pinHash = ''; s.pinSalt = ''; }
  else if(newPin){
    if(!/^\d{4,6}$/.test(newPin)){ alert(t('pinBad')); return; }
    s.pinSalt = randHex();
    s.pinHash = await sha(s.pinSalt + newPin);
  }
  else if(!s.pinHash){ alert(t('pinNeed')); s.pinOn = false; }
  save(); alert(t('saveDone')); renderSettings();
}
function exportData(){
  const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'billeasy-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const obj = JSON.parse(e.target.result);
      if(!obj.settings || !Array.isArray(obj.invoices)) throw new Error();
      db = normalize(obj); save(); applyLang(); alert(t('restored')); showTab('list');
    }catch(err){ alert(t('badFile')); }
  };
  r.readAsText(f);
}

<script>
/* ---- License settings: change LIC_SECRET before publishing and keep it private ---- */
const LIC_SECRET = 'BILLEASY-CHANGE-THIS-SECRET';
const LIC_CONTACT = 'आपका UPI ID या फ़ोन नंबर यहाँ लिखें';
const TRIAL_DAYS = 30;
/* true = सबके लिए मुफ़्त (कोई ट्रायल या लॉक नहीं). बाद में पेड व्यवस्था चालू करने के लिए false करें. */
const FREE_MODE = true;

function todayYMD(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function checkLicense(){
  const today = todayYMD();
  if(FREE_MODE){
    const tg = document.getElementById('tagline');
    tg.textContent = tg.textContent.split(' · ')[0] + ' · मुफ़्त / Free';
    return;
  }
  if(!db.settings.trialStart){ db.settings.trialStart = today; save(); }
  const trialLeft = TRIAL_DAYS - daysBetween(db.settings.trialStart, today);
  const tag = document.getElementById('tagline');
  const base = tag.textContent.split(' · ')[0];
  if(db.settings.licUntil && db.settings.licUntil >= today){
    tag.textContent = base + ' · सक्रिय / Active'; return;
  }
  if(trialLeft > 0){
    tag.textContent = base + ' · ट्रायल: ' + trialLeft + ' दिन'; return;
  }
  document.getElementById('licMsg').innerHTML =
    'ट्रायल समाप्त हो गया है।<br>पूरे ऐप के लिए ₹999 प्रति 3 महीने।<br>भुगतान के बाद सक्रियण कोड लें: ' + LIC_CONTACT;
  document.getElementById('licLock').style.display = 'flex';
}
async function activateLic(){
  const code = document.getElementById('licIn').value.trim().toUpperCase();
  const err = document.getElementById('licErr');
  const m = code.match(/^BE-(\d{8})-([0-9A-F]{4})$/);
  if(!m){ err.textContent = 'कोड सही फ़ॉर्मेट में नहीं है'; return; }
  const ymd = m[1].slice(0,4) + '-' + m[1].slice(4,6) + '-' + m[1].slice(6,8);
  const h = await sha(LIC_SECRET + ymd);
  if(h.slice(0,4).toUpperCase() !== m[2]){ err.textContent = 'कोड गलत है'; return; }
  if(ymd < todayYMD()){ err.textContent = 'यह कोड समाप्त हो चुका है'; return; }
  db.settings.licUntil = ymd; save();
  err.textContent = '';
  document.getElementById('licLock').style.display = 'none';
  checkLicense();
}
applyDesign();
checkLicense();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
