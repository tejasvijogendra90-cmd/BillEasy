<html lang="hi">

<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f1f5fb;margin:0;color:#1d2433}
header{background:linear-gradient(135deg,#1f5fbf,#3a8ee6);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:22px;letter-spacing:.5px}
.brand small{display:block;font-size:12px;opacity:.85}
select{padding:6px;border-radius:6px;border:1px solid #cfd7e6;font-size:14px;background:#fff}
header select{border:0}
.wrap{max-width:900px;margin:auto;padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
h3{margin:0 0 8px;color:#1f5fbf}
label{display:block;margin:10px 0 4px;font-size:14px;color:#444}
input{width:100%;padding:9px;border:1px solid #cfd7e6;border-radius:8px;font-size:15px;background:#fff}
button{background:#1f5fbf;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
button.green{background:#2e8b57}
button.wa{background:#25d366}
button.red{background:#c0392b}
button.gray{background:#6b7280}
button.light{background:#e3ebf7;color:#1d2433}
button.on{background:#1f5fbf;color:#fff}
button.sm{padding:6px 9px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #eef1f6;padding:7px 5px;text-align:left;vertical-align:middle}
.tot{font-size:18px;font-weight:bold;text-align:right;margin-top:12px;line-height:1.7}
.paid{color:#2e8b57;font-weight:bold}
.due{color:#c0392b;font-weight:bold}
.low{color:#c0392b;font-weight:bold}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary div{flex:1;min-width:130px;background:#f5f8fd;padding:12px;border-radius:10px;text-align:center;font-size:14px}
.summary b{display:block;font-size:19px;margin-top:4px}
.sugg{background:#fff;border:1px solid #cfd7e6;border-radius:8px;margin-top:4px;max-height:220px;overflow:auto}
.sugg div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #eef1f6;display:flex;gap:8px;align-items:center}
.sugg div:hover{background:#eef4fc}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#eef1f6;border:1px solid #ddd}
.ph{width:42px;height:42px;border-radius:6px;background:#eef1f6;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.cust-row{cursor:pointer}
.cust-row:hover{background:#f5f8fd}
.line td input{padding:6px}
.view{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;overflow:auto;padding:20px}
#modal .box{background:#fff;max-width:760px;margin:auto;border-radius:12px;padding:16px}
#print{display:none}
.bill{font-size:14px}
.qr{width:140px;height:140px;border:1px solid #eee;border-radius:8px}
@media print{
  body *{visibility:hidden}
  header,#side,#modal,nav,.fab{display:none!important}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px}
}
.bill{font-family:var(--bfont,system-ui,sans-serif)}
.bill .title{font-size:20px;font-weight:bold;color:var(--bcolor,#1f5fbf);text-align:var(--balign,left);margin-bottom:4px}
.bill h2{color:var(--bcolor,#1f5fbf)!important;text-align:var(--balign,left)}
.bill .tot{text-align:right}
.bill .billMeta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;padding:8px 10px;background:#f5f7fb;border-radius:8px;font-size:12.5px}
.bill .billMeta span{display:flex;flex-direction:column}.bill .billMeta small{color:#6b7a90}
.bill .billTbl{width:100%}
.bill .billTbl th,.bill .billTbl td{font-size:12px;padding:5px 4px}
.bill .billTbl th{white-space:normal;line-height:1.2;vertical-align:bottom;text-align:right}
.bill .billTbl th:nth-child(-n+3){text-align:left}
@media print{.bill .billTbl th,.bill .billTbl td{font-size:10.5px;padding:4px 3px}}
.pLine .grid3{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.warnOv{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.warnBox{background:#fff;color:#111827;border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:6px solid #dc2626}
.warnHead{font-size:19px;font-weight:800;color:#b91c1c;margin-bottom:10px}
.warnItem{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px;line-height:1.45}
.warnItem > b{display:block;margin-bottom:3px}.warnItem button{margin:8px 0 0}
.warnBtns{display:flex;gap:8px;flex-wrap:wrap}.warnBtns button{flex:1 1 150px;margin:0}
.tpl-classic table td,.tpl-classic table th{border:1px solid #999;padding:6px}
.tpl-classic table th{background:#f0f0f0}
.tpl-modern table th{background:var(--bcolor,#1f5fbf);color:#fff;border:none;padding:8px}
.tpl-modern table td{border-bottom:1px solid #eee;padding:7px}
.tpl-modern .tot b{color:var(--bcolor,#1f5fbf)}
.tpl-minimal table td,.tpl-minimal table th{border:none;border-bottom:1px solid #ddd;padding:6px}
.tpl-minimal table th{color:var(--bcolor,#1f5fbf)}

/* ---------- Motion: short, smooth, never blocks work ---------- */
:root{--ease:cubic-bezier(.22,.9,.3,1)}
button{transition:transform .15s var(--ease),box-shadow .2s,background-color .25s,color .25s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.95)}
button:not(.light):not(.sm):hover{box-shadow:0 4px 12px rgba(31,95,191,.25)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
button.light .rip,button.on .rip{background:rgba(31,95,191,.25)}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.tabs button{transition:transform .15s var(--ease),background-color .3s,color .3s,box-shadow .3s}
.tabs button.on{box-shadow:0 4px 14px rgba(31,95,191,.35)}
.view.enter{animation:viewIn .32s var(--ease)}
.view.enter .card{animation:cardIn .42s var(--ease) both}
.view.enter .card:nth-child(2){animation-delay:.05s}
.view.enter .card:nth-child(3){animation-delay:.1s}
.view.enter .card:nth-child(4){animation-delay:.15s}
.view.enter .card:nth-child(n+5){animation-delay:.2s}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{transition:box-shadow .3s}
.sugg:not(:empty){animation:dropIn .2s var(--ease);box-shadow:0 8px 20px rgba(20,50,100,.12)}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sugg div{transition:background-color .15s}
.sugg .hint{font-size:12px;color:#6b7a90;cursor:default;background:#f7f9fd}
tr.line.added td{animation:rowIn .9s var(--ease)}
@keyframes rowIn{0%{background:#d9f2e3}100%{background:transparent}}
tr.line.added{animation:rowSlide .35s var(--ease)}
@keyframes rowSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.tot.pulse{animation:pulse .35s var(--ease)}
@keyframes pulse{50%{transform:scale(1.04);color:#2e8b57}}
.tot{transform-origin:right center}
.low{animation:lowBlink 2.4s ease-in-out infinite}
@keyframes lowBlink{50%{opacity:.55}}
#modal{animation:fadeIn .2s ease}
#modal .box{animation:boxIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes boxIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3a8ee6;box-shadow:0 0 0 3px rgba(58,142,230,.18)}
header .brand svg{animation:logoIn .6s var(--ease)}
@keyframes logoIn{from{transform:rotate(-12deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
#lock{animation:fadeIn .25s ease}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.vids{display:grid;gap:10px}
.vids a{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e3ebf7;border-radius:12px;text-decoration:none;color:#1d2433;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s}
.vids a:hover,.vids a:active{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,95,191,.15);border-color:#9bb8e6}
.vids .play{flex:none;width:40px;height:40px;border-radius:50%;background:#e62117;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.vids small{display:block;color:#6b7a90;font-size:12px}

/* ---------- Colourful look ---------- */
body{background:linear-gradient(180deg,#eef3ff 0%,#f6f0ff 45%,#effaf4 100%) fixed}
header{background:linear-gradient(120deg,#1e40af 0%,#2563eb 40%,#7c3aed 100%);box-shadow:0 6px 20px rgba(37,99,235,.3)}
.brand small{opacity:.95;font-weight:600;letter-spacing:.3px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.tabs{grid-template-columns:repeat(8,1fr)}}
.tabs button{margin:0;padding:9px 4px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#fff;color:var(--c);border:2px solid color-mix(in srgb,var(--c) 30%,transparent);font-weight:800;font-size:13px;line-height:1.15;
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 16%,transparent)}
.tabs button .ti{font-size:21px;line-height:1;filter:saturate(1.2)}
.tabs button .tl{display:block;min-height:15px}
.tabs button.light{background:#fff;color:var(--c)}
.tabs button.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-2px)}
.tabs button.on:active{transform:scale(.95)}
#newView{--vc:#16a34a}#listView{--vc:#2563eb}#itemsView{--vc:#9333ea}#purchView{--vc:#ea580c}
#ledgerView{--vc:#dc2626}#custView{--vc:#0d9488}#settingsView{--vc:#475569}#videosView{--vc:#e11d48}
#homeView{--vc:#2563eb}
.chartCard .chips2{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.chips2 button{margin:0;flex:none;padding:7px 11px;font-size:12.5px;font-weight:700;border-radius:20px;white-space:nowrap}
.chips2 button.on{background:linear-gradient(135deg,#2563eb,#7c3aed)}
.chartBox{background:linear-gradient(180deg,#f8fbff,#fff);border-radius:14px;padding:6px 4px;border:1px solid #eef2ff}
svg.chart{width:100%;height:auto;display:block}.cgrid{stroke:#e5e7eb;stroke-dasharray:3 4}.cax{font-size:17px;fill:#4b5563;font-weight:600}
.cline{stroke-dasharray:2000;stroke-dashoffset:2000;animation:drawL 1.1s var(--ease) forwards}@keyframes drawL{to{stroke-dashoffset:0}}
.cbar{transform-box:fill-box;transform-origin:bottom;animation:growY .7s var(--ease)}
.donutWrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px}
svg.donut{width:170px;height:170px;flex:none}.cslice{transition:transform .2s;transform-origin:100px 100px}.cslice:hover{transform:scale(1.05)}
.dT{font-size:12px;fill:#6b7280}.dV{font-size:20px;font-weight:800;fill:#111827}
.dLeg{display:grid;gap:5px;flex:1 1 160px;font-size:13px}.dLeg div{display:flex;align-items:center;gap:6px}.dLeg span{width:12px;height:12px;border-radius:4px;flex:none}
.dLeg b{margin-left:auto;font-size:12px;white-space:nowrap}
.cLeg{display:flex;gap:12px;justify-content:center;font-size:12.5px;margin-bottom:2px}.cLeg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}#gstrView{--vc:#b45309}
.stBar{display:block;width:100%;height:8px;border-radius:5px;background:#e0f2fe;overflow:hidden;margin-top:4px}.stBar span{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#0891b2)}
#backBtn{font-size:24px;font-weight:800}#posView{--vc:#16a34a}#auditView{--vc:#475569}#usersView{--vc:#7c3aed}
#side .mi.mUser{flex:none;font-size:11px;padding:6px 4px;background:#fef3c7!important;color:#92400e!important;border:1px dashed #f59e0b!important;margin-bottom:6px}
#ulock{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1e40af,#7c3aed)}
.ulBox{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:22px;width:min(360px,100%);color:#fff;text-align:center}
.ulBox h2{margin:0}.ulBox p{opacity:.85;margin:4px 0 12px}.ulUsers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.ulUsers button{margin:0}.ulUsers button.on{background:#fff;color:#1e3a8a}.ulBox input{text-align:center;font-size:22px;letter-spacing:6px;margin-bottom:8px}
.ulBox .green{width:100%;margin:0 0 6px}
.altBtn{display:block;margin:4px 0 0;padding:3px 8px;font-size:11.5px}
.posWrap{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:900px){.posWrap{grid-template-columns:1.4fr 1fr;gap:12px}}
.posGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px;max-height:46vh;overflow:auto;padding:2px}
.posTile{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;background:linear-gradient(145deg,#fff,#ecfdf5)!important;color:#111827;border:1.5px solid #bbf7d0;box-shadow:0 4px 10px rgba(22,163,74,.12)}
.posTile img{width:42px;height:42px;object-fit:cover;border-radius:10px}.posTile span{font-size:26px}.posTile b{font-size:12.5px;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.posTile small{color:#15803d;font-weight:700}
.posLine{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eef0f6}.posLine small{display:block;color:#6b7280;font-size:12px}
.posQty{display:flex;align-items:center;gap:6px}.posQty button{margin:0;width:30px;height:30px;padding:0;border-radius:50%}
.posTot{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:18px;font-weight:800;color:#15803d}.posTot b{font-size:26px}
.posPay{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}.posPay button{margin:0;padding:14px;font-size:16px;font-weight:800}#aledView{--vc:#1d4ed8}#cflowView{--vc:#0891b2}#anaView{--vc:#7c3aed}
#side .mi.mHome{flex:none;padding:9px 4px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed)!important;color:#fff!important;border:0!important;box-shadow:0 6px 14px rgba(79,70,229,.35);margin-bottom:7px}
#side .mi.mHome .ti{display:block;font-size:18px}#side .mi.mHome.on{outline:3px solid #c7d2fe}
.homeHi{margin-bottom:10px}.homeHi b{display:block;font-size:20px;color:#1e3a8a}.homeHi small{color:#6b7280}
.srch{position:relative;margin-bottom:12px}.srch input{font-size:15px;padding:12px 14px;border-radius:14px;border:2px solid #c7d2fe;box-shadow:0 4px 14px rgba(79,70,229,.12)}
#gsr{margin-top:6px;display:grid;gap:5px}.gsRow{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(30,60,120,.08)}
.gsRow>span{font-size:20px}.gsRow small{display:block;color:#6b7280;font-size:12px}
.qas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 3px;border-radius:16px;font-weight:800;font-size:11.5px;line-height:1.15;word-break:break-word;min-width:0;
  background:linear-gradient(135deg,var(--hc),color-mix(in srgb,var(--hc) 70%,#000))!important;box-shadow:0 6px 14px color-mix(in srgb,var(--hc) 35%,transparent)}
.qa span{font-size:22px}
.alerts{display:flex;gap:8px;flex-wrap:wrap}.alerts button{margin:0;flex:1 1 180px;text-align:left}
.hbars{display:grid;gap:8px}.hbar{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbL{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#374151;font-weight:600}.hbT{height:12px;background:#f1f5f9;border-radius:7px;overflow:hidden;display:block}
.hbT span{display:block;height:100%;border-radius:7px;animation:growX .7s var(--ease)}.hbar b{font-size:12.5px;white-space:nowrap}
@keyframes growX{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.vcols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:14px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vcB{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;animation:growY .7s var(--ease);transform-origin:bottom}

#bankView{--vc:#1e40af}#outsView{--vc:#b91c1c}#stocksumView{--vc:#9333ea}#tbView{--vc:#047857}
/* menu sections */
#menuSecs{display:flex;flex-direction:column;gap:7px}
.ms{border-radius:14px;background:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--c) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden;flex:none}
.msh{margin:0;width:100%;padding:8px 4px 7px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,#fff),#fff)!important;color:color-mix(in srgb,var(--c) 85%,#000);font-weight:800;font-size:12.5px;line-height:1.15}
.msh .msi{font-size:19px;line-height:1}.msh .msl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msh .msc{font-size:11px;opacity:.7;transition:transform .3s var(--ease)}
.ms.open .msh{background:linear-gradient(135deg,var(--c),var(--c2))!important;color:#fff}
.ms.open .msh .msc{transform:rotate(180deg);opacity:1}
.msb{display:none;flex-direction:column;gap:5px;padding:6px 5px 7px;background:color-mix(in srgb,var(--c) 6%,#fff)}
.ms.open .msb{display:flex;animation:dropIn .28s var(--ease)}
#side .msb .mi{padding:8px 4px;font-size:12px;border-radius:10px;border-width:1.5px;flex-direction:column;gap:1px}
#side .msb .mi .ti{display:block;font-size:15px}
#side .msb .mi.mFavEdit{background:#fff7ed;color:#c2410c;border-style:dashed}
.mEmpty{font-size:11px;color:#92400e;text-align:center;padding:4px 2px;line-height:1.3}

/* ---- Security: slow down guessing of PIN and activation code ----
   After 5 wrong tries the app waits 30 sec, then 1 min, 2 min ... (max 1 hour).
   The count is kept in storage, so closing and opening the app does not reset it. */
function guardState(k){ try{ return JSON.parse(localStorage.getItem('be_guard_' + k) || '{}'); }catch(e){ return {}; } }
function guardWait(k){ const g = guardState(k); return Math.max(0, Math.ceil(((g.until || 0) - Date.now()) / 1000)); }
function guardFail(k){
  const g = guardState(k); g.n = (g.n || 0) + 1;
  if(g.n >= 5) g.until = Date.now() + Math.min(3600, 30 * Math.pow(2, g.n - 5)) * 1000;
  localStorage.setItem('be_guard_' + k, JSON.stringify(g));
}

/* ---------- Automatic backup to a chosen folder ---------- */
let backupDir = null;
let lastBackup = '';
function idbOp(mode, fn){
  return new Promise((res, rej) => {
    const req = indexedDB.open('billeasy-cfg', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => {
      const tx = req.result.transaction('kv', mode);
      const r = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(r.result);
      tx.onerror = () => rej(tx.error);
    };
    req.onerror = () => rej(req.error);
  });
}
async function restoreBackupHandle(){
  try{ backupDir = (await idbOp('readonly', st => st.get('dir'))) || null; }catch(e){ backupDir = null; }
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ alert(t('backupNotSupported')); return; }
  try{
    backupDir = await window.showDirectoryPicker({ mode:'readwrite' });
    await idbOp('readwrite', st => st.put(backupDir, 'dir'));
    await writeBackup();
    alert(t('backupSet'));
    renderSettings();
  }catch(e){ /* user cancelled */ }
}
async function grantBackup(){
  if(!backupDir) return;
  if((await backupDir.requestPermission({ mode:'readwrite' })) === 'granted'){ await writeBackup(); renderSettings(); }
}
async function writeBackup(){
  if(!backupDir || db.settings.backupMode !== 'auto') return;
  try{
    if((await backupDir.queryPermission({ mode:'readwrite' })) !== 'granted') return;
    const fh = await backupDir.getFileHandle(CO === 'main' ? 'billeasy-backup.json' : 'billeasy-backup-' + CO + '.json', { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(db, null, 2));
    await w.close();
    lastBackup = new Date().toLocaleString();
  }catch(e){ /* keep working even if backup fails */ }
}
function autoBackup(){ writeBackup(); }

/* Whole bill worked out line by line.
   Line: qty × rate − line discount (% and ₹) − its share of the bill discount = amount before GST, then GST,
   split as CGST + SGST (same state) or IGST (other state). Other charges (freight, packing…) are extra lines

function totals(inv){

    return { l, gross, ld, pre0:gross - ld };

  const bd = Math.min(pre0, pre0 * N(inv.bdp) / 100 + N(inv.bda)), f = pre0 > 0 ? (pre0 - bd) / pre0 : 1;
  const mk = (o, pre, rate) => { const tax = pre * rate / 100;
    return Object.assign(o, { pre, gst:rate, tax, cgst:inter ? 0 : tax / 2, sgst:inter ? 0 : tax / 2, igst:inter ? tax : 0, tot:pre + tax }); };
  const rows = base.map(x => mk({ l:x.l, n:x.l.n, hsn:x.l.hsn, unit:x.l.unit, q:N(x.l.q), fq:N(x.l.fq), r:N(x.l.r), gross:x.gross, disc:x.ld + x.pre0 * (1 - f) }, x.pre0 * f, N(x.l.gst)));
  const chRows = (inv.ch || []).filter(c => N(c.a)).map(c => mk({ charge:true, n:c.n || L('दूसरा ख़र्च', 'Other charge'), hsn:'', unit:'', q:0, fq:0, r:0, gross:N(c.a), disc:0 }, N(c.a), N(c.gst)));
  const all = rows.concat(chRows), sum = k => all.reduce((a, x) => a + x[k], 0);
  const sub = sum('pre'), gstAmt = sum('tax'), raw = sub + gstAmt;
  const round = inv.ro ? Math.round(raw) - raw : 0;
  return { rows, chRows, all, sub, gstAmt, cgst:sum('cgst'), sgst:sum('sgst'), igst:sum('igst'), inter,
    gross:rows.reduce((a, x) => a + x.gross, 0), lineDisc:base.reduce((a, x) => a + x.ld, 0), billDisc:bd,
    disc:base.reduce((a, x) => a + x.ld, 0) + bd, charges:chRows.reduce((a, x) => a + x.pre, 0), round, total:raw + round };

/* amount in words, Indian style: 1,25,050.50 -> Rupees One Lakh Twenty Five Thousand Fifty and Fifty Paise Only */
function inWords(n){
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + two(x % 100);
  n = Math.abs(Number(n) || 0); let r = Math.floor(n), p = Math.round((n - r) * 100); if(p === 100){ r++; p = 0; }
  const parts = [], cr = Math.floor(r / 1e7); r %= 1e7;
  if(cr) parts.push((cr >= 1000 ? inWords(cr).replace(/^Rupees | Only$/g, '') : three(cr)) + ' Crore');
  const lk = Math.floor(r / 1e5); r %= 1e5; if(lk) parts.push(two(lk) + ' Lakh');
  const th = Math.floor(r / 1000); r %= 1000; if(th) parts.push(two(th) + ' Thousand');
  if(r) parts.push(three(r));
  return 'Rupees ' + (parts.join(' ') || 'Zero') + (p ? ' and ' + two(p) + ' Paise' : '') + ' Only';

    const img = new Image();
    img.onload = () => {
      const m = (max || 160) / Math.max(img.width, img.height, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * Math.min(m,1)); c.height = Math.round(img.height * Math.min(m,1));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); /* see-through pictures stay white, not black */
      g.drawImage(img, 0, 0, c.width, c.height);

    };
    img.src = r.result;
  };
  r.readAsDataURL(file);

/* ---------- Dates: every date box shows DD/MM/YY (phones and browsers otherwise show their own format) ---------- */
function enhanceDate(inp){
  if(inp.dataset.dd) return; inp.dataset.dd = '1';
  const w = document.createElement('span'); w.className = 'dwrap';
  inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
  const s = document.createElement('span'); s.className = 'dtxt'; w.appendChild(s);
  const show = () => { s.textContent = inp.value ? fmtDate(inp.value) : 'DD/MM/YY'; s.style.color = inp.value ? '' : '#9aa3b2'; };
  show();
  inp.addEventListener('input', show); inp.addEventListener('change', show);
  inp.addEventListener('click', () => { try{ inp.showPicker(); }catch(e){} });
}
function enhanceDates(root){ (root || document).querySelectorAll('input[type=date]').forEach(enhanceDate); }

function showTab(x, fromHistory){

  if(typeof allowedTab === 'function' && !allowedTab(x)){ toast(L('यह हिस्सा खोलने का अधिकार नहीं है', 'You are not allowed to open this')); x = 'home'; }
  const changed = tab !== x;
  if(tab === 'new') saveDraft();
  tab = x;
  /* phone back button returns to the previous screen instead of closing the app (and losing a half-made bill) */
  if(changed && !fromHistory){ try{ history.pushState({ tab:x }, ''); }catch(e){} }
  if(x === 'videos' && !SHOW_VIDEOS) x = tab = 'new';

}

function findByPhone(p){ const d = digits(p); return d ? db.customers.find(c => digits(c.phone) === d) : null; }
function custMatches(q){
  const s = q.trim().toLowerCase(), d = digits(q);

  return db.customers.filter(c => c.name.toLowerCase().includes(s) || (d && digits(c.phone).includes(d))).slice(0,5);
}

  x.rows.forEach((r, i) => { set('amt' + i, money(r.pre)); set('gamt' + i, money(r.tax)); set('lt' + i, money(r.tot));
    set('spl' + i, x.inter ? money(r.igst) : money(r.cgst) + ' + ' + money(r.sgst)); });
  climitCheck(x.total);
  const el = document.getElementById('tot'); if(!el) return;
  el.innerHTML = `${x.disc > 0.004 ? `<small>${L('छूट से पहले', 'Before discount')}: ${money(x.gross)} · ${L('छूट', 'Discount')}: − ${money(x.disc)}</small><br>` : ''}${x.charges ? `<small>${L('दूसरे ख़र्च', 'Other charges')}: ${money(x.charges)}</small><br>` : ''}${t('sub')}: ${money(x.sub)}<br>${x.gstAmt > 0 ? (x.inter ? `IGST: ${money(x.igst)}` : `CGST: ${money(x.cgst)} · SGST: ${money(x.sgst)}`) : 'GST: ' + money(0)}<br>${Math.abs(x.round) > 0.004 ? `${L('राउंड ऑफ़', 'Round off')}: ${x.round > 0 ? '+' : '−'} ${money(Math.abs(x.round))}<br>` : ''}<b>${t('total')}: ${money(x.total)}</b>${cur.cur && cur.fx ? `<br><small>${cur.cur} ${(x.total / cur.fx).toFixed(2)}</small>` : ''}`;
  if(!quiet && lastTotal !== null && lastTotal !== x.total){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  lastTotal = x.total;
  saveDraftSoon();
}

  cur.lines.push({ iid:it.id, n:it.name, hsn:it.hsn||'', unit:it.unit||'pcs', q:1, r:itemRate(it), gst:it.gst||0 });
  lastAdded = cur.lines.length - 1;
  schemeFq(lastAdded);
  renderNew();
}
/* party-wise rate: a special rate saved for this customer wins over retail / wholesale */
function partyRate(cid, iid){ const c = cid && iid && db.customers.find(x => x.id === cid); return c && c.prates && Number(c.prates[iid]) > 0 ? Number(c.prates[iid]) : 0; }
/* retail or wholesale rate (wholesale falls back to retail when not set) */
function itemRate(it){ const pr = partyRate(cur.cid, it.id); if(pr) return pr; return cur.rl === 'w' && Number(it.sale2) > 0 ? Number(it.sale2) : (Number(it.sale) || 0); }
/* scheme: "buy 10 get 1 free" fills the free qty by itself (unless typed by hand) */
function schemeFq(i){
  const l = cur.lines[i], it = l && l.iid && itemById(l.iid); if(!l || !it || !it.sch || l.fqx) return;
  l.fq = Math.floor((Number(l.q) || 0) / it.sch.b) * it.sch.f || 0;
  const e = document.querySelectorAll('#newView tr.line')[i]; if(e){ const box = e.children[4] && e.children[4].querySelector('input'); if(box) box.value = l.fq ? fmtIn(l.fq) : ''; }
}
/* credit limit: warn when this bill takes the customer past the limit */
function custOver(cid, billTotal, oldTotal){
  const c = cid && cid !== 'CASH' && db.customers.find(x => x.id === cid); if(!c || !c.climit) return null;
  const now = partyBalance('c', c.id) - (oldTotal || 0), after = now + billTotal;
  return { c, now, after, over:after > c.climit + 0.004 };
}

function upsertCustomer(){
  if(isCashName(cur.cn)) return 'CASH';
  let c = cur.cid && cur.cid !== 'CASH' ? db.customers.find(x => x.id === cur.cid) : null;
  if(!c) c = findByPhone(cur.cp);
  if(!c){ const n = cur.cn.trim().toLowerCase(); c = !cur.cp.trim() && db.customers.find(x => x.id !== 'CASH' && x.name.trim().toLowerCase() === n && !x.phone) || null; }
  if(!c){ c = { id:'C'+Date.now() }; db.customers.push(c); }
  c.name = cur.cn.trim(); c.phone = cur.cp.trim(); c.gstin = cur.cgstin.trim();
  c.email = cur.cemail.trim(); c.address = cur.caddr.trim(); c.extra = Object.assign({}, cur.cextra);
  c.group = cur.cgroup || c.group || 'Sundry Debtors';
  c.st = cur.pos || stCode((c.gstin || '').slice(0, 2)) || c.st || '';
  return c.id;
}

function randHex(){ return [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function sha(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function hexToBytes(h){ return Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16))); }
function bytesToHex(b){ return [...b].map(x => x.toString(16).padStart(2,'0')).join(''); }
async function pbkdf2hex(pin, saltHex){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:hexToBytes(saltHex), iterations:200000, hash:'SHA-256' }, key, 256);
  return bytesToHex(new Uint8Array(bits));
}
async function deriveAes(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptBackup(json, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAes(pass, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(json));
  return JSON.stringify({ enc:1, salt:bytesToHex(salt), iv:bytesToHex(iv), data:bytesToHex(new Uint8Array(ct)) });
}
async function decryptBackup(obj, pass){
  const key = await deriveAes(pass, hexToBytes(obj.salt));
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:hexToBytes(obj.iv) }, key, hexToBytes(obj.data));
  return new TextDecoder().decode(pt);
}

async function unlock(){
  const wait = guardWait('pin');
  if(wait){ document.getElementById('pinErr').textContent = 'बहुत बार गलत PIN। ' + wait + ' सेकंड बाद फिर कोशिश करें / Too many tries, wait ' + wait + ' sec'; return; }
  const v = document.getElementById('pinIn').value.trim();
  const calc = db.settings.pinVer === 2 ? await pbkdf2hex(v, db.settings.pinSalt) : await sha(db.settings.pinSalt + v);
  if(calc === db.settings.pinHash){
    guardOk('pin');
    if(db.settings.pinVer !== 2){
      /* old, weaker PIN format: upgrade it to the stronger one */
      db.settings.pinSalt = randHex();
      db.settings.pinHash = await pbkdf2hex(v, db.settings.pinSalt);
      db.settings.pinVer = 2; save();
    }
    document.getElementById('lock').style.display = 'none';
    document.getElementById('pinIn').value = '';
    document.getElementById('pinErr').textContent = '';
  } else {
    guardFail('pin');
    document.getElementById('pinIn').value = '';
    document.getElementById('pinErr').textContent = t('pinWrong');
  }
}

let SAVING = false;
async function saveInv(){
  if(SAVING || !validCur()) return;
  const ws = saleWarnings();
  if(ws.length){ SAVING = true; let ok; try{ ok = await warnAsk(ws); } finally { SAVING = false; } if(!ok || ws.some(w => w.stop)) return; }
  if(isCashName(cur.cn)){ cur.cp = ''; cur.cgstin = ''; cur.cemail = ''; cur.caddr = ''; cur.cextra = {}; }
  { const c = cur.cid && db.customers.find(x => x.id === cur.cid);
    if(!cur.due && !cur.paid && c && c.cdays){ const d = new Date((cur.cd || today()) + 'T12:00:00'); d.setDate(d.getDate() + c.cdays); cur.due = ymd(d); } }
  const cid = upsertCustomer();
  const inv = buildInv(cid);
  inv.lines.forEach(l => {
    const it = l.iid && itemById(l.iid);
    if(it) it.stock = (Number(it.stock)||0) - outQ(l);
  });
  if(editingNo){
    const old = db.invoices.find(i => i.no === editingNo);
    if(old){
      old.lines.forEach(l => { const it = l.iid && itemById(l.iid); if(it) it.stock = (Number(it.stock)||0) + outQ(l); });
      db.payments = db.payments.filter(p => !(p.auto && p.inv === old.no));
      db.invoices = db.invoices.filter(i => i !== old);
    }
    inv.no = editingNo;
  } else {
    db.settings.next++;
  }
  inv.paid = !!cur.paid;
  inv.pmode = cur.pmode || t('mCash');
  db.invoices.push(inv);
  if(inv.paid) addAutoPayment(inv);
  save();
  if(window._quietSave) toast('✅ ' + t('saved') + ': ' + inv.no); else alert(t('saved') + ': ' + inv.no + lowStockNote());
  editingNo = null;
  cur = blankInv(); if(!window._quietSave) showTab('list');
}

/* open a bill for changes by typing its number (INV-0007, inv-7 and 7 all find INV-0007) */
function openBillByNo(){
  const box = document.getElementById('billNoOpen'), q = (box.value || '').trim();
  if(!q){ toast(L('बिल नंबर लिखें', 'Type a bill number')); box.focus(); return; }
  const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
  const num = s => { const m = String(s).match(/(\d+)\s*$/); return m ? Number(m[1]) : null; };
  let inv = db.invoices.find(i => norm(i.no) === norm(q));
  if(!inv && num(q) !== null){
    const hits = db.invoices.filter(i => num(i.no) === num(q) && (!/[a-z]/i.test(q) || norm(i.no).replace(/[\d\W]/g, '') === norm(q).replace(/[\d\W]/g, '')));
    if(hits.length === 1) inv = hits[0];
    else if(hits.length > 1){ toast(L('इस नंबर के कई बिल हैं, पूरा नंबर लिखें', 'Several bills match, type the full number')); return; }
  }
  if(!inv){ toast(L('इस नंबर का कोई बिल नहीं मिला', 'No bill found with this number')); box.focus(); return; }
  editInv(inv.no);
  toast(L('बिल ' + inv.no + ' बदलने के लिए खुल गया', 'Bill ' + inv.no + ' opened for changes'));
}
function delInv(no){
  if(!confirm(t('confDel'))) return;
  const inv = db.invoices.find(i=>i.no===no);
  if(inv) inv.lines.forEach(l => { const it = l.iid && itemById(l.iid); if(it) it.stock = (Number(it.stock)||0) + outQ(l); });
  db.invoices = db.invoices.filter(i=>i.no!==no); db.recur = (db.recur || []).filter(r => r.no !== no); save(); renderBillRows();
}

let camStream = null, camTimer = null;
async function openCamScan(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices){ alert(t('camNo')); return; }
  try{ camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch(e){ alert(t('camNo')); return; }
  document.getElementById('modalBody').innerHTML = `<video id="cam" autoplay playsinline style="width:100%;border-radius:8px"></video>
    <p style="font-size:13px;color:#666">${t('camHelp')}</p><button class="gray" onclick="stopCam()">${t('close')}</button>`;
  document.getElementById('modal').style.display = 'block';
  const v = document.getElementById('cam');
  v.srcObject = camStream;
  const det = new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'] });
  camTimer = setInterval(async () => {
    try{
      const codes = await det.detect(v);
      if(codes.length){ const code = codes[0].rawValue; stopCam(); scanCode(code); }
    }catch(e){}
  }, 400);
}
function stopCam(){
  if(camTimer){ clearInterval(camTimer); camTimer = null; }
  if(camStream){ camStream.getTracks().forEach(x => x.stop()); camStream = null; }
  document.getElementById('modal').style.display = 'none';
}

function parseRows(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const c = l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.split(/\s{2,}/);
    return c.map(x => x.trim());
  }).filter(c => c[0] && !/^(name|नाम|item|सामान)$/i.test(c[0]));
}
function importText(){
  const rows = parseRows(document.getElementById('impText').value);
  let added = 0, updated = 0;
  rows.forEach((c, idx) => {
    const name = c[0], hsn = c[1] || '', gst = Number(c[2]) || 0;
    const unit = UNITS.includes((c[3]||'').toLowerCase()) ? c[3].toLowerCase() : 'pcs';
    const sale = Number(c[4]) || 0, buy = Number(c[5]) || 0, stock = Number(c[6]) || 0;
    const ex = db.items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if(ex){
      Object.assign(ex, { hsn, gst, unit, sale });
      if(buy) ex.buy = buy;
      if(c[6] !== undefined && c[6] !== '') ex.stock = stock;
      updated++;
    } else {

function importFile(input){
  const f = input.files[0]; if(!f) return;
  if(/\.(xlsx|xls)$/i.test(f.name)){
    if(typeof XLSX === 'undefined'){ alert(t('xlsxNoLib')); return; }
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(e.target.result, { type:'array' });
        const lines = [];
        wb.SheetNames.forEach(sn => {
          XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'' }).forEach(row => {
            if(row.some(c => String(c).trim() !== ''))
              lines.push(row.map(c => String(c).replace(/[\t\r\n]+/g, ' ')).join('\t'));
          });
        });
        document.getElementById('impText').value = lines.join('\n');
        alert(t('xlsxLoaded').replace('{n}', lines.length));
      }catch(err){ alert(t('badXlsx')); }
    };
    r.readAsArrayBuffer(f);
  } else {
    const r = new FileReader();
    r.onload = e => { document.getElementById('impText').value = e.target.result; };
    r.readAsText(f);
  }
}

function upsertSupplier(name){
  const n = (name || '').trim();
  if(!n) return null;
  let s = db.suppliers.find(x => x.name.toLowerCase() === n.toLowerCase());
  if(!s){ s = { id:'S' + Date.now(), name:n, phone:'', gstin:'', address:'' }; db.suppliers.push(s); }
  return s.id;

/* purchase line amounts: taxable value plus GST paid to the supplier */
/* purchase line value before GST: stored after discounts (v); older entries are qty × rate */
const pVal = p => p.v !== undefined ? Number(p.v) || 0 : p.q * p.r;
const pTax = p => pVal(p) * (Number(p.gst) || 0) / 100;
const pAmt = p => pVal(p) + pTax(p);
/* credit / debit note amounts: value plus GST */
const nTax = x => x.q * x.r * (Number(x.gst) || 0) / 100;
const nAmt = x => x.q * x.r + nTax(x);
/* GST payable: collected on sales − on sale returns − (paid on purchases − on purchase returns) */
function gstNet(inP){
  return db.invoices.filter(i => inP(i.cd)).reduce((a, i) => a + totals(i).gstAmt, 0) - db.notes.filter(x => x.ty === 'cn' && inP(x.date)).reduce((a, x) => a + nTax(x), 0)
    - db.purchases.filter(x => inP(x.date)).reduce((a, x) => a + pTax(x), 0) + db.notes.filter(x => x.ty === 'dn' && inP(x.date)).reduce((a, x) => a + nTax(x), 0);
}
function partyBalance(ty, id){
  const ret = (db.notes || []).filter(n => n.ty === (ty === 'c' ? 'cn' : 'dn') && n.pid === id).reduce((a,n) => a + nAmt(n), 0);
  const key = ty + ':' + id, jdr = jrnlDr(key) + ((db.obs || {})[key] || 0); /* opening balance and journal entries, Dr positive */
  if(ty === 'c'){
    const sale = db.invoices.filter(i => i.cid === id).reduce((a,i) => a + i.total, 0);
    const got = db.payments.filter(p => p.ty === 'c' && p.pid === id).reduce((a,p) => a + p.amt, 0);
    return sale - got - ret + jdr;
  }
  const buy = db.purchases.filter(p => p.sid === id).reduce((a,p) => a + pAmt(p), 0);
  const paid = db.payments.filter(p => p.ty === 's' && p.pid === id).reduce((a,p) => a + p.amt, 0);
  return buy - paid - ret - jdr;
}
/* net Dr of one account from journal vouchers (optionally up to a date / within a period) */
function jrnlDr(key, upto, from){
  return (db.journals || []).filter(j => (!upto || (j.date || '') <= upto) && (!from || (j.date || '') >= from))
    .reduce((a, j) => a + (j.dr === key ? j.amt : 0) - (j.cr === key ? j.amt : 0), 0);
}
function partyName(ty, id){
  const p = ty === 'c' ? db.customers.find(x => x.id === id) : db.suppliers.find(x => x.id === id);
  return p ? p.name : '';
}
function validGSTIN(g){
  if(!g) return true;
  if(!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return false;
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let sum = 0;
  for(let i = 0; i < 14; i++){
    const p = chars.indexOf(g[i]) * (i % 2 === 0 ? 1 : 2);
    sum += Math.floor(p / 36) + (p % 36);
  }
  return chars[(36 - (sum % 36)) % 36] === g[14];
}

function addPayment(){
  const key = document.getElementById('lpParty').value;
  const amt = parseNum(document.getElementById('lpAmt').value);
  if(!key){ alert(t('pickParty')); return; }
  if(!(amt > 0)){ alert(t('badAmt')); return; }
  const [ty, pid] = key.split(':');
  db.payments.push({ id:'Y' + Date.now(), ty, pid, amt,
    date: document.getElementById('lpDate').value,
    mode: document.getElementById('lpMode').value,
    note: document.getElementById('lpNote').value.trim() });
  save(); renderLedger();
}
function editPayment(id){
  const p = db.payments.find(x => x.id === id);
  if(!p || p.auto) return;
  const ans = prompt(t('newAmt'), fmtIn(p.amt));
  if(ans === null) return;
  const v = parseNum(ans);
  if(!(v > 0)) return;
  p.amt = v; save(); renderLedger();
}
function delPayment(id){
  if(!confirm(t('confDel'))) return;
  const pm = db.payments.find(p => p.id === id);
  if(pm && pm.ty === 'c' && pm.inv){ const bill = db.invoices.find(i => i.no === pm.inv); if(bill) bill.paid = false; }
  db.payments = db.payments.filter(p => p.id !== id);
  save(); if(tab === 'rcpt') renderRcpt(); else renderLedger();
}

  const pid = document.getElementById('rc_party').value, sel = document.getElementById('rc_bill'); if(!sel) return;
  const bills = db.invoices.filter(i => i.cid === pid && !i.paid && billDue(i) > 0.005);
  sel.innerHTML = `<option value="">${L('— बिना बिल के —', '— on account —')}</option>` + bills.map(i => `<option value="${esc(i.no)}">${esc(i.no)} · ${fmtDate(i.cd)} · ${L('बाक़ी', 'due')} ${money(billDue(i))}</option>`).join('');

function saveRcpt(){
  const pid = document.getElementById('rc_party').value, amt = parseNum(document.getElementById('rc_amt').value);
  if(!pid){ alert(t('pickParty')); return; }
  if(!(amt > 0)){ alert(t('badAmt')); return; }
  const billNo = (document.getElementById('rc_bill') || {}).value || '';
  const p = { id:'R' + Date.now(), ty:'c', pid, amt, date:document.getElementById('rc_date').value || today(),

    rno:'RCPT-' + String(db.settings.nextRcpt).padStart(4,'0'), inv:billNo || undefined };
  if(billNo){ const b = db.invoices.find(i => i.no === billNo); if(b && amt >= billDue(b) - 0.005) b.paid = true; }
  db.payments.push(p); db.settings.nextRcpt++;
  save(); toast(L('रसीद सेव हो गई', 'Receipt saved')); renderRcpt(); openRcpt(p.id);
}

/* ---------- Cash book: every cash payment in or out, plus entries typed by hand ---------- */
function cashRows(){
  const rows = [];
  db.payments.filter(p => isCash(p.mode)).forEach(p => {
    const inflow = (p.ty === 'c') === (p.amt > 0);
    rows.push({ date:p.date, dir:inflow ? 'in' : 'out', amt:Math.abs(p.amt), who:partyName(p.ty, p.pid),
      note:p.rno || p.note || (p.auto ? (p.ty === 'c' ? t('billLabel') : t('purchLabel')) : ''), ts:p.id });
  });
  db.cashbook.forEach(c => rows.push({ date:c.date, dir:c.dir, amt:c.amt, who:'', note:c.note, id:c.id, ts:c.id }));
  /* opening cash and journal vouchers that touch cash */
  const ob = (db.obs || {})['sys:cash'] || 0;
  if(ob) rows.push({ date:'', dir:ob > 0 ? 'in' : 'out', amt:Math.abs(ob), who:'', note:L('शुरुआती कैश (Opening)', 'Opening cash'), ts:0 });
  (db.journals || []).filter(j => j.dr === 'sys:cash' || j.cr === 'sys:cash').forEach(j => rows.push({ date:j.date, dir:j.dr === 'sys:cash' ? 'in' : 'out', amt:j.amt,
    who:accName(j.dr === 'sys:cash' ? j.cr : j.dr), note:'Journal' + (j.note ? ' · ' + j.note : ''), ts:j.id }));
  const tnum = x => Number(String(x).replace(/\D/g, '').slice(0, 13)) || 0;
  return rows.sort((a, b) => (a.date || '').localeCompare(b.date || '') || tnum(a.ts) - tnum(b.ts));
}

function saveNote(ty){
  const d = noteDraft[ty], isCn = ty === 'cn', it = itemById(d.iid), q = Number(d.q) || 0, r = Number(d.r) || 0;
  if(!d.pid){ alert(t('pickParty')); return; }
  if(!it){ alert(t('pickItem')); return; }
  if(!(q > 0) || !(r >= 0)){ alert(t('badAmt')); return; }
  const k = isCn ? 'nextCn' : 'nextDn';
  const n = { id:'N' + Date.now(), ty, no:(isCn ? 'CN-' : 'DN-') + String(db.settings[k]).padStart(4, '0'), date:d.date || today(), pid:d.pid,
    pname:partyName(isCn ? 'c' : 's', d.pid), iid:it.id, n:it.name, unit:it.unit, q, r, reason:(d.reason || '').trim(), ts:Date.now(), gst:Number(d.gst ?? it.gst) || 0 };
  db.notes.push(n); db.settings[k]++;
  it.stock = (Number(it.stock) || 0) + (isCn ? q : -q);
  if(d.refund && nAmt(n) > 0) db.payments.push({ id:'Y' + Date.now(), ty:isCn ? 'c' : 's', pid:d.pid, amt:-nAmt(n), date:n.date,
    mode:d.mode || t('mCash'), note:n.no, note2:n.id });
  noteDraft[ty] = { pid:'', iid:'', q:1, r:0, date:'', reason:'', refund:false, mode:'' };
  save(); toast(n.no + ' ' + L('सेव हो गया', 'saved')); renderNote(ty);
}
function delNote(id){
  const n = db.notes.find(x => x.id === id); if(!n || !confirm(t('confDel'))) return;
  const it = itemById(n.iid); if(it) it.stock = (Number(it.stock) || 0) - (n.ty === 'cn' ? n.q : -n.q);
  db.notes = db.notes.filter(x => x.id !== id);
  db.payments = db.payments.filter(p => p.note2 !== id);
  save(); renderNote(n.ty);
}

function openPreview(inv){
  const data = JSON.stringify(inv).replace(/'/g,'&#39;');
  document.getElementById('modalBody').innerHTML = invoiceHTML(inv) + `
    <div style="margin-top:12px">
      <button onclick='printInv(${data})'>${t('print')}</button>
      <button class="wa" onclick='sendWA(${data})'>${t('wa')}</button>
      <button class="green" onclick='shareInv(${data})'>${t('share')}</button>
      <button class="gray" onclick="closePreview()">${t('close')}</button>
    </div>`;
  document.getElementById('modal').style.display = 'block';
  try{ history.pushState({ tab, modal:1 }, ''); }catch(e){}
}
function openPreviewNo(no){ const inv = db.invoices.find(i=>i.no===no); if(inv) openPreview(inv); }
function closePreview(fromHistory){
  const m = document.getElementById('modal');
  if(m.style.display !== 'block') return;
  m.style.display = 'none';
  if(!fromHistory && history.state && history.state.modal){ modalClosing = true; history.back(); }
}
let modalClosing = false;
function printInv(inv){ document.getElementById('print').innerHTML = invoiceHTML(inv); window.print(); }
function shareText(inv){
  const x = totals(inv), s = db.settings;
  const lines = x.all.map(r => r.charge ? `• ${r.n} = ${money(r.tot)}` : `• ${r.n} x${fmtQty(r.q)}${r.fq ? ' +' + fmtQty(r.fq) + ' ' + L('फ़्री', 'free') : ''} ${uLabel(r.unit)} = ${money(r.tot)}`).join('\n');
  return `*${s.name || 'BillEasy'}*\n${t('billNo')}: ${inv.no}\n${t('date')}: ${fmtDate(inv.cd)}${inv.ts ? ' · ' + fmtTime(inv.ts) : ''}\n${t('billTo')}: ${inv.cn}\n\n${lines}\n\n${x.disc > 0.004 ? L('छूट', 'Discount') + ': ' + money(x.disc) + '\n' : ''}GST: ${money(x.gstAmt)}\n${Math.abs(x.round) > 0.004 ? L('राउंड ऑफ़', 'Round off') + ': ' + money(x.round) + '\n' : ''}${t('total')}: *${money(x.total)}*` +
    (s.upi ? `\nUPI: ${s.upi}` : '') + `\n\n${t('thanks')}`;
}
function sendWA(inv){
  let num = digits(inv.cp);
  if(num.length === 10) num = '91' + num;
  window.open((num ? 'https://wa.me/' + num : 'https://wa.me/') + '?text=' + encodeURIComponent(shareText(inv)), '_blank', 'noopener,noreferrer');
}
function shareInv(inv){
  if(navigator.share) navigator.share({ title: inv.no, text: shareText(inv) }).catch(()=>{});
  else sendWA(inv);
}

async function exportData(){

function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async e => {
    try{
      let obj = JSON.parse(e.target.result);
      if(obj.enc){
        const pass = prompt(t('askRestorePass'));
        if(!pass) return;
        obj = JSON.parse(await decryptBackup(obj, pass));
      }
      if(!obj.settings || !Array.isArray(obj.invoices)) throw new Error();
      db = normalize(obj); save(); flushSave(); applyLang(); alert(t('restored')); showTab('list');
    }catch(err){ alert(t('badFile')); }
  };
  r.readAsText(f);
}

  hint.textContent = L('⬇  ज़िप नीचे खींचकर खोलें', '⬇  Pull the zip down to open');
  z.appendChild(cv); z.appendChild(hint); document.body.appendChild(z);
  document.body.style.overflow = 'hidden';
  const ctx = cv.getContext('2d');
  let base = null, tickTimer = 0;
  let W, H, cx, dpr, fab, Y0, Y, targetY = 0, dragging = false, startPY = 0, startY = 0, opening = false, spread = 1, raf = 0, t0 = performance.now();
  const TOOTH = 16;
  let lastTooth = null, actx = null;

  function tooth(){

      const tt = actx.currentTime, o = actx.createOscillator(); o.type = 'sine';

      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      const g = actx.createGain(); g.gain.setValueAtTime(.07, tt); g.gain.exponentialRampToValueAtTime(.0008, tt + .03);
      o.connect(lp); lp.connect(g); g.connect(actx.destination); o.start(tt); o.stop(tt + .05);
    }catch(e){}
  }
  function zipSound(){
    if(Y > H) { lastTooth = null; return; }

      const n = Math.min(3, Math.abs(tt - lastTooth));

  }

    f.fillStyle = tape; f.fillRect(cx - 26, 0, 52, H);

  /* ---------- Cover: colour waves + shop name card + calendar (with Hindu tithi) + live clock ---------- */
  const HF = '"Nirmala UI", system-ui, sans-serif';
  function glass(f, x, y, w, h){

  function wrapText(f, text, x, y, maxW, lh){

  /* Hindu calendar: tithi, paksha, month (purnimanta, as used in North India) and Vikram Samvat.
     Worked out on the phone from sun and moon positions at 6 AM local time, no internet needed. */
  function sunMoon(ms){
    const R = Math.PI / 180, n = x => ((x % 360) + 360) % 360, d = ms / 86400000 + 2440587.5 - 2451545.0;
    const g = (357.528 + .9856003 * d) * R;
    const sun = n(280.460 + .9856474 * d + 1.915 * Math.sin(g) + .020 * Math.sin(2 * g));
    const Mm = (134.963 + 13.064993 * d) * R, F = (93.272 + 13.229350 * d) * R, D = (297.850 + 12.190749 * d) * R, M = (357.529 + .985600 * d) * R;
    const moon = n(218.316 + 13.176396 * d + 6.289 * Math.sin(Mm) - 1.274 * Math.sin(2 * D - Mm) + .658 * Math.sin(2 * D) + .214 * Math.sin(2 * Mm)
      - .186 * Math.sin(M) - .114 * Math.sin(2 * F) + .059 * Math.sin(2 * D - 2 * Mm) + .057 * Math.sin(2 * D - M - Mm)
      + .053 * Math.sin(2 * D + Mm) + .046 * Math.sin(2 * D - M) + .041 * Math.sin(Mm - M) - .035 * Math.sin(D) - .031 * Math.sin(M + Mm));
    return { sun, moon, el:n(moon - sun) };
  }
  function panchang(date){
    const TITHI = ['प्रतिपदा','द्वितीया','तृतीया','चतुर्थी','पंचमी','षष्ठी','सप्तमी','अष्टमी','नवमी','दशमी','एकादशी','द्वादशी','त्रयोदशी','चतुर्दशी'];
    const MONTHS = ['चैत्र','वैशाख','ज्येष्ठ','आषाढ़','श्रावण','भाद्रपद','आश्विन','कार्तिक','मार्गशीर्ष','पौष','माघ','फाल्गुन'];
    const sr = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 6, 0, 0).getTime();
    const el = sunMoon(sr).el, ti = Math.floor(el / 12);
    let nm = sr - el / 12.19 * 86400000;
    for(let i = 0; i < 3; i++){ let e = sunMoon(nm).el; if(e > 180) e -= 360; nm -= e / 12.19 * 86400000; }
    const ay = 23.85 + .01397 * (new Date(nm).getFullYear() - 2000);
    const sign = Math.floor((((sunMoon(nm).sun - ay) % 360) + 360) % 360 / 30);
    const amanta = (sign + 1) % 12, shukla = ti < 15;
    return {
      month: MONTHS[shukla ? amanta : (amanta + 1) % 12],
      paksha: shukla ? 'शुक्ल पक्ष' : 'कृष्ण पक्ष',
      tithi: ti === 14 ? 'पूर्णिमा' : ti === 29 ? 'अमावस्या' : TITHI[ti % 15],

  }
  let pc = null, pcDay = '';

  /* Clock: classic dial + digital time. Ivory dial, gold rim and green accents (light, auspicious colours as per Vastu belief) */
  function drawClock(f, ccx, ccy, r, now){
    f.save();
    f.shadowColor = 'rgba(0,0,0,.4)'; f.shadowBlur = 18; f.shadowOffsetY = 7;
    const rim = f.createLinearGradient(ccx - r, ccy - r, ccx + r, ccy + r);

      f.beginPath(); f.moveTo(ccx + Math.sin(a) * r1, ccy - Math.cos(a) * r1); f.lineTo(ccx + Math.sin(a) * r2, ccy - Math.cos(a) * r2); f.stroke();
    }

    [[12, 0], [3, 1], [6, 2], [9, 3]].forEach(([n, q]) => { const a = q * Math.PI / 2; f.fillText(String(n), ccx + Math.sin(a) * r * .53, ccy - Math.cos(a) * r * .53); });
    /* digital window */
    const dw = r * .92, dh = r * .26, dx = ccx - dw / 2, dy = ccy + r * .22;
    f.fillStyle = '#064e3b'; rr(f, dx, dy, dw, dh, dh * .3); f.fill();
    f.strokeStyle = '#d4a63a'; f.lineWidth = 1; rr(f, dx, dy, dw, dh, dh * .3); f.stroke();
    f.fillStyle = '#6ee7b7'; f.font = `700 ${dh * .62}px ui-monospace, Consolas, monospace`;
    f.fillText(now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit', second:'2-digit' }).replace(/\s?(am|pm|AM|PM)$/, m => m.toUpperCase()), ccx, dy + dh / 2 + 1);
    /* hands */
    const hr = now.getHours() % 12 + now.getMinutes() / 60, mn = now.getMinutes() + now.getSeconds() / 60, sc = now.getSeconds();
    const hand = (ang, len, wid, col) => {
      f.save(); f.translate(ccx, ccy); f.rotate(ang); f.shadowColor = 'rgba(0,0,0,.3)'; f.shadowBlur = 3; f.shadowOffsetY = 1.5;
      f.strokeStyle = col; f.lineWidth = wid; f.lineCap = 'round'; f.beginPath(); f.moveTo(0, len * .18); f.lineTo(0, -len); f.stroke(); f.restore();
    };
    hand(hr * Math.PI / 6, r * .42, Math.max(3, r * .07), '#1e3a8a');
    hand(mn * Math.PI / 30, r * .62, Math.max(2.2, r * .048), '#1e3a8a');
    hand(sc * Math.PI / 30, r * .7, Math.max(1, r * .018), '#dc2626');
    f.fillStyle = '#d4a63a'; f.beginPath(); f.arc(ccx, ccy, r * .07, 0, Math.PI * 2); f.fill();
    f.fillStyle = '#dc2626'; f.beginPath(); f.arc(ccx, ccy, r * .03, 0, Math.PI * 2); f.fill();
    f.textBaseline = 'alphabetic';
    f.restore();
  }
  /* calendar and clock sit on both sides of the top of the zip; redrawn every second so they stay live */
  let widget = null;
  function renderFab(){
    if(!base) return;
    const f = fab.getContext('2d');
    f.setTransform(1, 0, 0, 1, 0, 0); f.clearRect(0, 0, fab.width, fab.height); f.drawImage(base, 0, 0);
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = new Date();
    drawCalendar(f, widget.lx, widget.top, widget.s, widget.ch, now);
    drawClock(f, widget.rx + widget.s / 2, widget.top + widget.ch / 2, widget.s / 2, now);
  }
  function gapAt(y){
    if(y >= Y) return 0;
    const pr = Math.max(0, (Y - Y0) / Math.max(1, H - Y0));
    const maxGap = (W / 2 + 40) * Math.min(1, pr * 1.3) * spread;
    return maxGap * Math.pow((Y - y) / Math.max(1, Y), 1.15);
  }
  function draw(now){
    /* heavy feel: the slider follows the finger with a little weight instead of jumping */
    if(dragging) Y += (targetY - Y) * .3;
    zipSound();
    const bob = (!dragging && !opening) ? Math.abs(Math.sin((now - t0) / 420)) * 6 : 0;
    const yy = Y;
    ctx.clearRect(0, 0, W, H);
    const step = 3;
    for(let y = 0; y < H; y += step){
      const gp = gapAt(y + step / 2);
      ctx.drawImage(fab, 0, y * dpr, cx * dpr, step * dpr, -gp, y, cx, step);
      ctx.drawImage(fab, cx * dpr, y * dpr, (W - cx) * dpr, step * dpr, cx + gp, y, W - cx, step);
      if(gp > 1){
        ctx.fillStyle = 'rgba(0,0,0,.30)'; ctx.fillRect(cx - gp, y, 12, step); ctx.fillRect(cx + gp - 12, y, 12, step);
        ctx.fillStyle = 'rgba(0,10,30,.35)'; ctx.fillRect(cx - gp - 5, y, 5, step); ctx.fillRect(cx + gp, y, 5, step);
      }
    }
    if(yy < H + 60){
      const sy = yy + bob;
      const sg = ctx.createLinearGradient(cx - 26, 0, cx + 26, 0);
      sg.addColorStop(0, '#6b7482'); sg.addColorStop(.35, '#f8fafc'); sg.addColorStop(.6, '#cfd6df'); sg.addColorStop(1, '#5d6673');
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
      ctx.fillStyle = sg; rr(ctx, cx - 25, sy - 44, 50, 62, 12); ctx.fill(); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; rr(ctx, cx - 25, sy - 44, 50, 62, 12); ctx.stroke();
      ctx.fillStyle = 'rgba(40,50,65,.35)'; rr(ctx, cx - 15, sy - 32, 30, 5, 2.5); ctx.fill();
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6;
      ctx.fillStyle = sg; rr(ctx, cx - 17, sy + 8, 34, 72, 15); ctx.fill(); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; rr(ctx, cx - 17, sy + 8, 34, 72, 15); ctx.stroke();
      ctx.fillStyle = 'rgba(15,40,90,.6)'; rr(ctx, cx - 7, sy + 46, 14, 24, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, cx - 11, sy + 14, 6, 26, 3); ctx.fill();
      hint.style.top = (H - 58) + 'px';
    }
    hint.style.opacity = dragging || opening ? '0' : '1';
    if(!opening && document.body.contains(z)) raf = requestAnimationFrame(draw);
  }
  function animate(from, to, ms, set, done){
    const st = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - st) / ms), e = 1 - Math.pow(1 - k, 3);
      set(from + (to - from) * e); draw(now);
      if(k < 1) requestAnimationFrame(tick); else if(done) done();
    };
    requestAnimationFrame(tick);
  }
  function openAll(){
    if(opening) return; opening = true; cancelAnimationFrame(raf);
    try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(15); }catch(e){}
    animate(Y, H + 60, 380, v => { Y = v; }, () => animate(1, 2.4, 320, v => { spread = v; cv.style.opacity = String(Math.max(0, 2.4 - v) / 1.4); }, finish));
  }
  function finish(){
    clearInterval(tickTimer);
    try{ if(actx) setTimeout(() => actx.close(), 300); }catch(e){}
    z.remove(); document.body.style.overflow = '';
    window.removeEventListener('resize', onResize);
    const p = document.getElementById('pinIn'); if(p && document.getElementById('lock').style.display === 'flex') p.focus();
  }
  function onResize(){ build(); }
  z.addEventListener('pointerdown', e => {
    if(opening) return; initAudio(); dragging = true; z.classList.add('grab');
    startPY = e.clientY; startY = Y; targetY = Y; lastTooth = Math.floor(Y / TOOTH);
    try{ z.setPointerCapture(e.pointerId); }catch(er){}
  });
  z.addEventListener('pointermove', e => {
    if(!dragging) return;
    targetY = Math.max(Y0, Math.min(H - 20, startY + (e.clientY - startPY)));
  });
  /* the zip opens only when pulled almost to the bottom and let go; above that it can be moved up and down freely */
  const release = () => {
    if(!dragging) return; dragging = false; z.classList.remove('grab');
    Y = targetY;
    if(Y > H * .72) openAll();
  };
  z.addEventListener('pointerup', release); z.addEventListener('pointercancel', release);
  z.addEventListener('keydown', e => { if(['Enter', ' ', 'ArrowDown'].includes(e.key)){ e.preventDefault(); openAll(); } });
  window.addEventListener('resize', onResize);
  build(); raf = requestAnimationFrame(draw);
  tickTimer = setInterval(renderFab, 1000);
  setTimeout(() => { try{ z.focus({ preventScroll:true }); }catch(e){} }, 50);
}

/* ================= Books: accounts, journal, profit & loss, balance sheet (Busy-style) =================
   Every amount is kept as Dr positive / Cr negative. Sales, purchases, cash, bank, stock and GST
   come from the bills and entries already in the app; the user adds capital, loans, assets and
   expenses as accounts and moves money between them with Journal vouchers. */
const BS_LIAB = ['Capital Account','Reserves & Surplus','Loans (Liability)','Secured Loans','Unsecured Loans','Bank O/D Account',
  'Current Liabilities','Sundry Creditors','Duties & Taxes','Provisions','Expenses Payable','Suspense Account','Branch / Divisions'];
const BS_ASSET = ['Fixed Assets','Investments','Loans & Advances (Asset)','Deposits (Asset)','Securities & Deposits','Current Assets',
  'Stock-in-hand','Sundry Debtors','Cash-in-hand','Bank Accounts'];
const PL_GROUPS = ['Sale Accounts','Purchase Accounts','Direct Incomes','Direct Expenses','Indirect Incomes','Indirect Expenses'];
function rootGroup(g){
  let n = g, guard = 0;
  while(n && !DEF_GROUPS.includes(n) && guard++ < 12){ const x = db.groups.find(y => y.name === n); n = x ? x.parent : ''; }
  return DEF_GROUPS.includes(n) ? n : 'Suspense Account';
}
const SYS = { cash:['Cash-in-hand', () => L('कैश (हाथ में)', 'Cash in hand')], bank:['Bank Accounts', () => L('बैंक (UPI / चेक / ट्रांसफ़र)', 'Bank (UPI / cheque / transfer)')] };
function accName(key){
  const [ty, id] = String(key).split(':');
  if(ty === 'sys') return SYS[id] ? SYS[id][1]() : id;
  if(ty === 'a') return ((db.accounts || []).find(a => a.id === id) || {}).name || '?';
  return partyName(ty, id) || '?';
}
function accGroup(key){
  const [ty, id] = String(key).split(':');
  if(ty === 'sys') return SYS[id] ? SYS[id][0] : 'Suspense Account';
  if(ty === 'a') return rootGroup(((db.accounts || []).find(a => a.id === id) || {}).group);
  if(ty === 's') return 'Sundry Creditors';
  if(id === 'CASH') return 'Sundry Debtors';
  const g = rootGroup((db.customers.find(c => c.id === id) || {}).group || 'Sundry Debtors');
  return PL_GROUPS.includes(g) ? 'Sundry Debtors' : g;
}
function allAccKeys(){
  return ['sys:cash', 'sys:bank', ...db.accounts.map(a => 'a:' + a.id), ...db.customers.map(c => 'c:' + c.id), ...db.suppliers.map(s => 's:' + s.id)];
}
const before = (d, upto) => !upto || (d || '') <= upto;
/* Dr balance of any account up to a date */
function accBal(key, upto){
  const [ty, id] = key.split(':'), ob = db.obs[key] || 0;
  if(ty === 'c' || ty === 's'){
    const p = ty === 'c' ? { c:id, s:null } : { c:null, s:id };
    return partyEntries(p).filter(e => before(e.d, upto)).reduce((a, e) => a + e.amt, 0); /* already includes opening + journals */
  }
  if(key === 'sys:cash') return cashRows().filter(r => before(r.date, upto)).reduce((a, r) => a + (r.dir === 'in' ? r.amt : -r.amt), 0);
  if(key === 'sys:bank') return ob + jrnlDr(key, upto) + db.payments.filter(p => !isCash(p.mode) && before(p.date, upto))
    .reduce((a, p) => a + (p.ty === 'c' ? p.amt : -p.amt), 0);
  return ob + jrnlDr(key, upto);
}
/* stock quantity of an item at the end of a date ('' = before any entry) */
function stockAt(it, upto, initial){
  let q = Number(it.stock) || 0;
  const after = d => initial ? true : (d || '') > upto;
  db.purchases.forEach(p => { if(p.iid === it.id && after(p.date)) q -= p.q + (p.fq || 0); });
  db.invoices.forEach(i => { if(after(i.cd)) i.lines.forEach(l => { if(l.iid === it.id) q += outQ(l); }); });
  (db.prods || []).forEach(p => { if(!after(p.date)) return; if(p.iid === it.id) q -= p.q; p.parts.forEach(x => { if(x.iid === it.id) q += x.q; }); });
  db.notes.forEach(n => { if(n.iid === it.id && after(n.date)) q += n.ty === 'cn' ? -n.q : n.q; });
  (db.stockadj || []).forEach(a => { if(a.iid === it.id && after(a.date)) q -= a.q; });
  return q;
}
const stockValue = (upto, initial) => db.items.reduce((a, it) => a + stockAt(it, upto, initial) * (Number(it.buy) || 0), 0);
const dayBefore = ymdStr => { const d = new Date(ymdStr + 'T12:00:00'); d.setDate(d.getDate() - 1); return ymd(d); };
/* Profit & loss for a period; from = '' means from the very start */
function profitLoss(from, to){
  const inP = d => (!from || (d || '') >= from) && (!to || (d || '') <= to);
  const sales = db.invoices.filter(i => inP(i.cd)).reduce((a, i) => a + saleVal(i), 0);
  const salesRet = db.notes.filter(n => n.ty === 'cn' && inP(n.date)).reduce((a, n) => a + n.q * n.r, 0);
  const purch = db.purchases.filter(p => inP(p.date)).reduce((a, p) => a + pVal(p), 0);
  const purchRet = db.notes.filter(n => n.ty === 'dn' && inP(n.date)).reduce((a, n) => a + n.q * n.r, 0);
  const openStock = from ? stockValue(dayBefore(from)) : stockValue('', true);
  const closeStock = stockValue(to || '9999-12-31');
  const cbExp = db.cashbook.filter(c => c.dir === 'out' && inP(c.date)).reduce((a, c) => a + c.amt, 0);
  const lines = g => db.accounts.filter(a => rootGroup(a.group) === g).map(a => {
    const k = 'a:' + a.id; let v = jrnlDr(k, to, from); if(!from) v += db.obs[k] || 0; return { name:a.name, key:k, v };
  }).filter(x => Math.abs(x.v) > 0.004);
  const dExp = lines('Direct Expenses'), dInc = lines('Direct Incomes'), iExp = lines('Indirect Expenses'), iInc = lines('Indirect Incomes');
  const xPur = lines('Purchase Accounts'), xSal = lines('Sale Accounts');
  const sum = (arr, sign) => arr.reduce((a, x) => a + sign * x.v, 0);
  const tradeDr = openStock + (purch - purchRet) + sum(xPur, 1) + sum(dExp, 1);
  const tradeCr = (sales - salesRet) + sum(xSal, -1) + closeStock + sum(dInc, -1);
  const gross = tradeCr - tradeDr;
  const net = gross - cbExp - sum(iExp, 1) + sum(iInc, -1);
  return { sales, salesRet, purch, purchRet, openStock, closeStock, cbExp, dExp, dInc, iExp, iInc, xPur, xSal, tradeDr, tradeCr, gross, net };
}
/* Balance sheet as on a date: liabilities and assets by group */
function balanceSheet(upto){
  const L1 = {}, A1 = {}, add = (side, g, name, v, key) => { (side[g] = side[g] || []).push({ name, v, key }); };
  allAccKeys().forEach(k => {
    const g = accGroup(k); if(PL_GROUPS.includes(g)) return;
    const v = accBal(k, upto); if(Math.abs(v) < 0.005) return;
    if(BS_ASSET.includes(g)) add(A1, g, accName(k), v, k); else add(L1, g, accName(k), -v, k);
  });
  const gst = gstNet(d => before(d, upto));
  if(Math.abs(gst) > 0.004) add(L1, 'Duties & Taxes', L('GST (बिक्री पर वसूला − ख़रीद पर दिया)', 'GST (collected − paid on purchases)'), gst);
  const cs = stockValue(upto || '9999-12-31'); if(Math.abs(cs) > 0.004) add(A1, 'Stock-in-hand', L('बचा हुआ स्टॉक (ख़रीद रेट पर)', 'Closing stock (at purchase rate)'), cs);
  const os = stockValue('', true); if(Math.abs(os) > 0.004) add(L1, 'Capital Account', L('शुरुआती स्टॉक (मालिक का लगाया)', 'Opening stock (owner brought in)'), os);
  const cin = db.cashbook.filter(c => c.dir === 'in' && before(c.date, upto)).reduce((a, c) => a + c.amt, 0);
  if(cin > 0.004) add(L1, 'Capital Account', L('कैश बुक में डाला पैसा', 'Cash added in Cash Book'), cin);
  const pl = profitLoss('', upto);
  const obDiff = Object.keys(db.obs).reduce((a, k) => a + db.obs[k], 0);
  const tot = side => Object.values(side).reduce((a, arr) => a + arr.reduce((b, x) => b + x.v, 0), 0);
  const extraL = [], extraA = [];
  if(Math.abs(pl.net) > 0.004) (pl.net > 0 ? extraL : extraA).push({ name:pl.net > 0 ? L('लाभ (Profit & Loss A/c)', 'Profit & Loss A/c (profit)') : L('हानि (Profit & Loss A/c)', 'Profit & Loss A/c (loss)'), v:Math.abs(pl.net), pl:true });
  /* opening balances that do not match each other are shown like Busy does */
  if(Math.abs(obDiff) > 0.004) (obDiff > 0 ? extraL : extraA).push({ name:L('शुरुआती बाक़ी का अंतर', 'Difference in opening balances'), v:Math.abs(obDiff), diff:true });
  const TL = tot(L1) + extraL.reduce((a, x) => a + x.v, 0), TA = tot(A1) + extraA.reduce((a, x) => a + x.v, 0);
  return { L1, A1, extraL, extraA, TL, TA, pl };
}

/* ---------- Screen ---------- */
let BSV = { tab:'bs', upto:'', from:'', to:'' };
function renderBS(){
  /* Balance Sheet, Profit & Loss, Accounts and Journal each open from the side menu */
  const v = document.getElementById(BSV.tab + 'View'); if(!v) return;
  if(!BSV.upto) BSV.upto = today();
  if(!BSV.from){ const r = rangeOf('fy'); BSV.from = r[0]; BSV.to = r[1]; }

  const body = BSV.tab === 'bs' ? bsBody() : BSV.tab === 'pl' ? plBody() : BSV.tab === 'acc' ? accBody() : jvBody();
  v.innerHTML = `<div class="bsTitle">${titles[BSV.tab]}</div>${body}`;
}
const mrow = (name, v, cls) => `<div class="bsr ${cls || ''}"><span>${esc(name)}</span><b>${money(v)}</b></div>`;
function bsSide(title, side, extra, total, color){
  const order = (side === 'L' ? BS_LIAB : BS_ASSET);
  const data = side === 'L' ? BSV._bs.L1 : BSV._bs.A1;
  return `<div class="bsSide" style="--bc:${color}"><div class="bsH">${title}</div>
    ${order.filter(g => data[g]).map(g => { const arr = data[g], s = arr.reduce((a, x) => a + x.v, 0);
      return `<details class="bsG"><summary><span>${esc(g)}</span><b>${money(s)}</b></summary>${arr.map(x => mrow(x.name, x.v, 'sub')).join('')}</details>`; }).join('')}
    ${extra.map(x => mrow(x.name, x.v, x.pl ? 'pl' : 'diff')).join('')}
    <div class="bsT"><span>${L('कुल', 'Total')}</span><b>${money(total)}</b></div></div>`;
}
function bsBody(){

    <div class="secT">📒 ${L('लाभ-हानि खाता (शुद्ध लाभ)', 'Profit & loss account (net profit)')}</div>

/* ---------- PDFs of the balance sheet and profit & loss ---------- */
function pdfBS(){
  const bs = balanceSheet(BSV.upto), rows = [];
  const side = (title, order, data, extra, total) => {
    rows.push({ c:[title, ''], b:true, tone:'open' });
    order.filter(g => data[g]).forEach(g => { const arr = data[g]; rows.push({ c:[g, money(arr.reduce((a, x) => a + x.v, 0))], b:true });
      arr.forEach(x => rows.push({ c:['      ' + x.name, money(x.v)] })); });
    extra.forEach(x => rows.push({ c:[x.name, money(x.v)], b:true }));
    rows.push({ c:[L('कुल', 'Total'), money(total)], b:true, tone:'open' });
  };
  side(L('देनदारियाँ (Liabilities)', 'LIABILITIES'), BS_LIAB, bs.L1, bs.extraL, bs.TL);
  side(L('संपत्ति (Assets)', 'ASSETS'), BS_ASSET, bs.A1, bs.extraA, bs.TA);
  makePdf({ title:L('बैलेंस शीट', 'Balance Sheet'), period:L('तारीख़ तक: ', 'As on ') + fmtDate(BSV.upto), cols:[{ h:L('विवरण', 'Particulars'), w:.7 }, { h:L('रक़म', 'Amount'), w:.3, a:'r' }], rows,
    summary:[[L('कुल देनदारियाँ', 'Total liabilities'), money(bs.TL)], [L('कुल संपत्ति', 'Total assets'), money(bs.TA)], [bs.pl.net >= 0 ? L('शुद्ध लाभ', 'Net profit') : L('शुद्ध हानि', 'Net loss'), money(Math.abs(bs.pl.net)), 'big']] },
    `Balance Sheet ${BSV.upto}`);
}
function pdfPL(){
  const p = profitLoss(BSV.from, BSV.to), rows = [], r = (n, v, b) => rows.push({ c:[n, money(v)], b });
  rows.push({ c:[L('ट्रेडिंग खाता', 'TRADING ACCOUNT'), ''], b:true, tone:'open' });
  r(L('शुरुआती स्टॉक', 'Opening stock'), p.openStock); r(L('ख़रीद (वापसी घटाकर)', 'Purchases (less returns)'), p.purch - p.purchRet);
  [...p.xPur, ...p.dExp].forEach(x => r('      ' + x.name, x.v));
  r(L('बिक्री (वापसी घटाकर, GST छोड़कर)', 'Sales (less returns, without GST)'), p.sales - p.salesRet); [...p.xSal, ...p.dInc].forEach(x => r('      ' + x.name, -x.v));
  r(L('बचा हुआ स्टॉक', 'Closing stock'), p.closeStock);
  r(p.gross >= 0 ? L('कुल लाभ (Gross Profit)', 'Gross profit') : L('कुल हानि (Gross Loss)', 'Gross loss'), Math.abs(p.gross), true);
  rows.push({ c:[L('लाभ-हानि खाता', 'PROFIT & LOSS ACCOUNT'), ''], b:true, tone:'open' });
  if(p.cbExp) r(L('कैश बुक के ख़र्चे', 'Cash Book expenses'), p.cbExp);
  p.iExp.forEach(x => r(x.name + ' (' + L('ख़र्च', 'expense') + ')', x.v)); p.iInc.forEach(x => r(x.name + ' (' + L('आमदनी', 'income') + ')', -x.v));
  makePdf({ title:L('लाभ-हानि खाता', 'Profit & Loss'), period:rangeTxt({ f:BSV.from, t:BSV.to }), cols:[{ h:L('विवरण', 'Particulars'), w:.7 }, { h:L('रक़म', 'Amount'), w:.3, a:'r' }], rows,
    summary:[[L('कुल लाभ', 'Gross profit'), money(p.gross)], [p.net >= 0 ? L('शुद्ध लाभ', 'Net profit') : L('शुद्ध हानि', 'Net loss'), money(Math.abs(p.net)), p.net >= 0 ? 'big' : 'red']] },
    `Profit and Loss ${BSV.from || 'start'} to ${BSV.to || today()}`);
}

/* ---------- Day Book: every entry of a day (or a period) ---------- */
let DB_R = null;
function dayEntries(r){
  const E = [], push = (d, ty, no, who, amt, ic, ts) => { if(inRange(d, r)) E.push({ d, ty, no, who, amt, ic, ts:ts || 0 }); };
  const tn = x => Number(String(x).replace(/\D/g, '').slice(0, 13)) || 0;
  db.invoices.forEach(i => push(i.cd, L('बिक्री', 'Sale'), i.no, i.cn, i.total, '🧾', i.ts));
  db.purchases.forEach(p => push(p.date, L('ख़रीद', 'Purchase'), '', p.supplier + ' · ' + p.n, pAmt(p), '🛒', tn(p.id)));
  db.payments.forEach(p => push(p.date, p.ty === 'c' ? (p.amt > 0 ? L('रसीद', 'Receipt') : L('लौटाया', 'Refund')) : (p.amt > 0 ? L('पेमेंट', 'Payment') : L('वापस मिला', 'Refund in')),
    p.rno || '', partyName(p.ty, p.pid) + ' · ' + p.mode, Math.abs(p.amt), p.ty === 'c' ? '💰' : '💸', tn(p.id)));
  db.notes.forEach(n => push(n.date, n.ty === 'cn' ? L('क्रेडिट नोट', 'Credit note') : L('डेबिट नोट', 'Debit note'), n.no, n.pname + ' · ' + n.n, nAmt(n), n.ty === 'cn' ? '↩️' : '↪️', n.ts));
  db.cashbook.forEach(c => push(c.date, c.dir === 'in' ? L('कैश आया', 'Cash in') : L('कैश ख़र्च', 'Cash out'), '', c.note, c.amt, '💵', tn(c.id)));
  db.journals.forEach(j => push(j.date, j.kind === 'ct' ? 'Contra' : j.kind === 'pv' ? L('पेमेंट', 'Payment') : 'Journal', j.vno || '', accName(j.dr) + ' ← ' + accName(j.cr), j.amt, j.kind === 'ct' ? '🔄' : '🔁', tn(j.id)));
  db.stockadj.forEach(a => { const it = itemById(a.iid) || {}; push(a.date, L('स्टॉक घट-बढ़', 'Stock adjust'), '', (it.name || '?') + ' ' + (a.q > 0 ? '+' : '') + fmtQty(a.q), Math.abs(a.q) * (it.buy || 0), '⚖️', tn(a.id)); });
  db.quotes.forEach(q => push(q.date, QT[q.ty][1](), q.no, q.cn, qTotal(q).total, QT[q.ty][0], tn(q.id)));
  return E.sort((a, b) => (a.d || '').localeCompare(b.d || '') || a.ts - b.ts);
}
function shiftDay(n){ const d = new Date((DB_R.f || today()) + 'T12:00:00'); d.setDate(d.getDate() + n); DB_R = { f:ymd(d), t:ymd(d) }; renderDaybook(); }
function renderDaybook(){
  if(!DB_R) DB_R = { f:today(), t:today() };
  const E = dayEntries(DB_R), by = {}; E.forEach(e => { by[e.ty] = (by[e.ty] || 0) + e.amt; });
  const single = DB_R.f === DB_R.t;
  document.getElementById('daybookView').innerHTML = viewHead('📅', 'Day Book', L('चुने दिन की हर एंट्री एक जगह', 'Every entry of the chosen day in one place')) + `
  <div class="card">
    <div class="dayNav"><button class="light" onclick="shiftDay(-1)">◀</button>
      <div><input type="date" value="${DB_R.f}" onchange="DB_R={f:this.value,t:this.value};renderDaybook()"><small>${single ? new Date(DB_R.f + 'T12:00:00').toLocaleDateString(db.settings.lang === 'hi' ? 'hi-IN' : 'en-IN', { weekday:'long' }) : rangeTxt(DB_R)}</small></div>
      <button class="light" onclick="shiftDay(1)">▶</button></div>
    <div class="rchips" style="justify-content:center">${[['today', L('आज', 'Today')], ['month', L('यह महीना', 'This month')], ['last', L('पिछला महीना', 'Last month')]].map(([k, txt]) => `<button class="light sm" onclick="const r=rangeOf('${k}');DB_R={f:r[0],t:r[1]};renderDaybook()">${txt}</button>`).join('')}</div>
  </div>
  ${tiles(Object.keys(by).slice(0, 6).map(k => [k, money(by[k]), '', (E.find(e => e.ty === k) || {}).ic]))}
  <div class="card">
    <button class="pdfBtn sm" onclick="dayPdf()">📄 ${L('PDF बनाएँ / शेयर', 'Make PDF / share')}</button><div id="pdfOut"></div>
    ${E.length ? `<div class="dayList">${E.map(e => `<div class="dayRow"><span class="dIc">${e.ic}</span><div><b>${esc(e.ty)} ${esc(e.no)}</b><small>${single ? '' : fmtDate(e.d) + ' · '}${esc(e.who)}</small></div><b>${money(e.amt)}</b></div>`).join('')}</div>`
      : `<p class="hint2" style="text-align:center">📭 ${L('इस दिन कोई एंट्री नहीं।', 'No entries on this day.')}</p>`}
  </div>`;
}
function dayPdf(){

let OS_TY = 'c';
function ageing(ty, id){
  const p = ty === 'c' ? { c:id, s:null } : { c:null, s:id }, sg = ty === 'c' ? 1 : -1;
  const E = partyEntries(p).map(e => ({ d:e.d, v:sg * e.amt }));
  let credit = E.filter(e => e.v < 0).reduce((a, e) => a - e.v, 0);
  const now = new Date(today() + 'T12:00:00'), b = [0, 0, 0, 0]; let oldest = 0;
  E.filter(e => e.v > 0).forEach(e => { const use = Math.min(credit, e.v); credit -= use; const left = e.v - use; if(left < 0.005) return;
    const days = e.d ? Math.max(0, Math.round((now - new Date(e.d + 'T12:00:00')) / 86400000)) : 999;
    b[days <= 30 ? 0 : days <= 60 ? 1 : days <= 90 ? 2 : 3] += left; oldest = Math.max(oldest, days); });
  return { b, oldest };
}

    const q = Number(it.stock) || 0, low = it.minQty > 0 && q <= it.minQty;

function expiryRows(){
  const now = new Date(today() + 'T12:00:00'), out = [];
  db.items.forEach(it => {
    let left = Math.max(0, Number(it.stock) || 0);
    db.purchases.filter(p => p.iid === it.id && p.exp).sort((x, y) => (y.date || '').localeCompare(x.date || '')).forEach(p => {
      const inStock = Math.min(left, p.q); left -= inStock; if(inStock <= 0) return;

/* stock of one item in one godown; everything without a godown belongs to the main godown */
function gdQty(it, gid){
  const M = g => (g || 'main') === gid; let q = 0;
  if(gid === 'main'){
    q += stockAt(it, '', true);
    db.notes.forEach(n => { if(n.iid === it.id) q += n.ty === 'cn' ? n.q : -n.q; });
    db.stockadj.forEach(a => { if(a.iid === it.id) q += a.q; });
  }
  db.purchases.forEach(p => { if(p.iid === it.id && M(p.gd)) q += p.q + (p.fq || 0); });
  db.invoices.forEach(i => { if(M(i.gd)) i.lines.forEach(l => { if(l.iid === it.id) q -= outQ(l); }); });
  db.transfers.forEach(x => { if(x.iid === it.id){ if(x.to === gid) q += x.q; if(x.from === gid) q -= x.q; } });
  return q;
}
